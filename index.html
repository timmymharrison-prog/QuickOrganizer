<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Jefferson v5.1.0 - Cloud Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; margin: 0; }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .rich-editor { min-height: 100px; outline: none; }
        .rich-editor ul { list-style-type: disc; padding-left: 1.5rem; }
        .rich-editor ol { list-style-type: decimal; padding-left: 1.5rem; }
        .rich-editor b { font-weight: bold; }
        .rich-editor u { text-decoration: underline; }
        .firebase-status { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
        }
        .status-connected { background: #10b981; }
        .status-disconnected { background: #ef4444; }
        .status-syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4 md:p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC21uDcMLyGso3kLqBYimTL8loUi5zzLjw",
            authDomain: "nova-quick.firebaseapp.com",
            projectId: "nova-quick",
            storageBucket: "nova-quick.firebasestorage.app",
            messagingSenderId: "914595554926",
            appId: "1:914595554926:web:e19d4fc962794d9e9aa87f",
            measurementId: "G-YLV78DYWEJ"
        };

        // Initialize Firebase
        let db = null;
        let auth = null;
        let isFirebaseConfigured = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            isFirebaseConfigured = true;
            console.log("âœ… Firebase initialized successfully");
        } catch (error) {
            console.error("âŒ Firebase initialization error:", error);
            isFirebaseConfigured = false;
        }

        const formatKey = (d) => {
            const dateObj = d instanceof Date ? d : new Date(d);
            return `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}/${dateObj.getFullYear()}`;
        };

        function InlineDatePicker({ value, onChange }) {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const ref = useRef(null);
            
            useEffect(() => {
                const clickOut = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", clickOut);
                return () => document.removeEventListener("mousedown", clickOut);
            }, []);
            
            const renderDays = useMemo(() => {
                const year = viewDate.getFullYear(); 
                const month = viewDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];
                
                for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(
                        <button 
                            key={i} 
                            type="button" 
                            onClick={() => { 
                                onChange(formatKey(new Date(year, month, i))); 
                                setIsOpen(false); 
                            }} 
                            className="text-[9px] p-1.5 hover:bg-gray-800 hover:text-white rounded-md font-bold"
                        >
                            {i}
                        </button>
                    );
                }
                return days;
            }, [viewDate, onChange]);
            
            return (
                <div className="relative w-full" ref={ref}>
                    <button 
                        type="button" 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="text-[9px] font-black px-2 py-1.5 rounded-lg uppercase tracking-wider w-full text-center bg-gray-100 text-gray-900 hover:bg-gray-200 transition-all"
                    >
                        {value}
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-2 bg-white border border-gray-100 shadow-2xl rounded-2xl p-3 z-[100] w-56 text-black animate-pop">
                            <div className="flex justify-between items-center mb-2">
                                <button 
                                    type="button" 
                                    onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} 
                                    className="p-1 hover:bg-gray-100 rounded-lg"
                                >
                                    â†
                                </button>
                                <span className="text-[9px] font-black uppercase">
                                    {viewDate.toLocaleString('default', { month: 'short' })} {viewDate.getFullYear()}
                                </span>
                                <button 
                                    type="button" 
                                    onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} 
                                    className="p-1 hover:bg-gray-100 rounded-lg"
                                >
                                    â†’
                                </button>
                            </div>
                            <div className="day-grid gap-1">
                                {["S","M","T","W","T","F","S"].map(d => 
                                    <div key={d} className="text-center text-[7px] font-black text-gray-300">{d}</div>
                                )}
                                {renderDays}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const WinItem = React.memo(({ 
            item, 
            editingNoteId, 
            schedulingNoteId,
            tempNoteText,
            tempNoteDetails,
            onStartEdit,
            onStartSchedule,
            onSaveEdit,
            onCancelEdit,
            onToggleComplete,
            onDelete,
            onScheduleConfirm,
            formData,
            setFormData,
            execCommand,
            editorRef
        }) => {
            if (editingNoteId === item.id) {
                return (
                    <div className="bg-white p-4 rounded-2xl border-2 border-blue-500 shadow-xl animate-pop space-y-3">
                        <input 
                            autoFocus 
                            className="text-[11px] font-black uppercase text-gray-900 outline-none w-full bg-gray-50 p-2 rounded-lg" 
                            value={tempNoteText} 
                            onChange={e => onStartEdit(item.id, e.target.value, tempNoteDetails)} 
                        />
                        <div className="flex gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                            <button onClick={() => execCommand('bold')} className="p-1 hover:bg-gray-200 rounded font-bold w-6 text-[10px]">B</button>
                            <button onClick={() => execCommand('underline')} className="p-1 hover:bg-gray-200 rounded underline w-6 text-[10px]">U</button>
                            <button onClick={() => execCommand('insertUnorderedList')} className="p-1 hover:bg-gray-200 rounded text-[9px] px-2 font-bold">List</button>
                        </div>
                        <div 
                            ref={editorRef} 
                            contentEditable 
                            className="rich-editor w-full bg-gray-50 p-3 rounded-lg text-[10px] font-medium min-h-[80px] outline-none overflow-y-auto" 
                            dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                        />
                        <div className="flex gap-2">
                            <button 
                                onClick={() => onSaveEdit(item.id, tempNoteText, editorRef.current.innerHTML)} 
                                className="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                            >
                                Save
                            </button>
                            <button 
                                onClick={onCancelEdit} 
                                className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>
                );
            }
            
            if (schedulingNoteId === item.id) {
                return (
                    <div className="bg-white p-4 rounded-2xl border-2 border-blue-500 shadow-xl animate-pop space-y-3">
                        <p className="text-[9px] font-black text-blue-500 uppercase tracking-widest text-center">Schedule Win</p>
                        <h4 className="text-[10px] font-bold text-center">{item.text}</h4>
                        <InlineDatePicker 
                            value={formData.startDate} 
                            onChange={v => setFormData({...formData, startDate: v})} 
                        />
                        <button 
                            onClick={() => onScheduleConfirm(item, formData.startDate)} 
                            className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase w-full"
                        >
                            Confirm Add
                        </button>
                    </div>
                );
            }
            
            return (
                <div 
                    onDoubleClick={() => onStartEdit(item.id, item.text, item.details || "")} 
                    className={`flex items-center gap-3 p-4 bg-white rounded-2xl border border-gray-100 shadow-sm transition-all group hover:border-blue-200 cursor-pointer ${item.completed ? 'opacity-60 bg-gray-50' : ''}`}
                >
                    <input 
                        type="checkbox" 
                        checked={item.completed} 
                        onChange={(e) => { 
                            e.stopPropagation(); 
                            onToggleComplete(item.id);
                        }} 
                        className="w-4 h-4 accent-blue-500 cursor-pointer" 
                    />
                    <div className="flex-grow min-w-0">
                        <p className={`text-[11px] font-black uppercase text-gray-900 truncate ${item.completed ? 'line-through' : ''}`}>
                            {item.text}
                        </p>
                        {item.details && (
                            <div 
                                className="text-[8px] text-gray-400 italic truncate opacity-60" 
                                dangerouslySetInnerHTML={{ __html: item.details }}
                            />
                        )}
                    </div>
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100">
                        <button 
                            onClick={(e) => { 
                                e.stopPropagation(); 
                                onDelete(item.id);
                            }} 
                            className="p-1 text-gray-300 hover:text-red-500 transition-colors"
                        >
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                        {!item.completed && (
                            <button 
                                onClick={(e) => { 
                                    e.stopPropagation(); 
                                    onStartSchedule(item.id);
                                }} 
                                className="bg-blue-50 text-blue-600 px-2 py-1 rounded-md text-[8px] font-black uppercase tracking-tighter"
                            >
                                Add
                            </button>
                        )}
                    </div>
                </div>
            );
        });

        function CalendarApp() {
            const [user, setUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('disconnected');
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [navDate, setNavDate] = useState(new Date());
            const [reminders, setReminders] = useState(() => {
                if (!isFirebaseConfigured) {
                    return JSON.parse(localStorage.getItem('cal-rem')) || {};
                }
                return {};
            });
            const [scratchNotes, setScratchNotes] = useState(() => {
                if (!isFirebaseConfigured) {
                    return JSON.parse(localStorage.getItem('cal-scratch')) || [];
                }
                return [];
            });
            const [quickWins, setQuickWins] = useState(() => {
                if (!isFirebaseConfigured) {
                    return JSON.parse(localStorage.getItem('cal-wins')) || [];
                }
                return [];
            });
            const [showCompleted, setShowCompleted] = useState(true);
            const [isCreatingEvent, setIsCreatingEvent] = useState(false);
            
            const [editingNoteId, setEditingNoteId] = useState(null); 
            const [schedulingNoteId, setSchedulingNoteId] = useState(null);
            const [tempNoteText, setTempNoteText] = useState("");
            const [tempNoteDetails, setTempNoteDetails] = useState("");
            const [newWinText, setNewWinText] = useState("");
            const [formData, setFormData] = useState({ text: "", details: "", startDate: formatKey(new Date()) });

            const editorRef = useRef(null);
            const unsubscribeRef = useRef(null);

            // Firebase Authentication
            useEffect(() => {
                if (!isFirebaseConfigured) return;

                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);
                        setSyncStatus('connected');
                        console.log("ðŸ‘¤ User signed in:", firebaseUser.email || "anonymous");
                    } else {
                        auth.signInAnonymously()
                            .then(() => {
                                console.log("ðŸ‘¤ Anonymous user created");
                            })
                            .catch((error) => {
                                console.error("Auth error:", error);
                                setSyncStatus('disconnected');
                            });
                    }
                });

                return () => unsubscribe();
            }, []);

            // Firestore Real-time Sync
            useEffect(() => {
                if (!user || !db) return;

                setSyncStatus('syncing');

                const remindersUnsub = db.collection('users').doc(user.uid).collection('reminders')
                    .onSnapshot((snapshot) => {
                        if (!snapshot.empty) {
                            const data = {};
                            snapshot.forEach(doc => {
                                data[doc.id] = doc.data().events || [];
                            });
                            setReminders(data);
                        }
                        setSyncStatus('connected');
                    }, (error) => {
                        console.error("Reminders sync error:", error);
                        setSyncStatus('disconnected');
                    });

                const scratchUnsub = db.collection('users').doc(user.uid).collection('scratchNotes')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        if (!snapshot.empty) {
                            const notes = [];
                            snapshot.forEach(doc => {
                                notes.push({ id: doc.id, ...doc.data() });
                            });
                            setScratchNotes(notes);
                        }
                    }, (error) => {
                        console.error("Scratch notes sync error:", error);
                    });

                const winsUnsub = db.collection('users').doc(user.uid).collection('quickWins')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        if (!snapshot.empty) {
                            const wins = [];
                            snapshot.forEach(doc => {
                                wins.push({ id: doc.id, ...doc.data() });
                            });
                            setQuickWins(wins);
                        }
                    }, (error) => {
                        console.error("Quick wins sync error:", error);
                    });

                unsubscribeRef.current = () => {
                    remindersUnsub();
                    scratchUnsub();
                    winsUnsub();
                };

                return () => {
                    if (unsubscribeRef.current) unsubscribeRef.current();
                };
            }, [user]);

            // Fallback to localStorage if Firebase not configured
            useEffect(() => {
                if (isFirebaseConfigured) return;
                
                const timer = setTimeout(() => {
                    localStorage.setItem('cal-rem', JSON.stringify(reminders));
                }, 500);
                return () => clearTimeout(timer);
            }, [reminders]);

            useEffect(() => {
                if (isFirebaseConfigured) return;
                
                const timer = setTimeout(() => {
                    localStorage.setItem('cal-scratch', JSON.stringify(scratchNotes));
                }, 500);
                return () => clearTimeout(timer);
            }, [scratchNotes]);

            useEffect(() => {
                if (isFirebaseConfigured) return;
                
                const timer = setTimeout(() => {
                    localStorage.setItem('cal-wins', JSON.stringify(quickWins));
                }, 500);
                return () => clearTimeout(timer);
            }, [quickWins]);

            const execCommand = useCallback((cmd, val = null) => {
                document.execCommand(cmd, false, val);
                if (editorRef.current) editorRef.current.focus();
            }, []);

            const currentKey = formatKey(selectedDate);
            
            const activeWins = useMemo(() => 
                quickWins.filter(w => !w.completed), 
                [quickWins]
            );
            
            const completedWins = useMemo(() => 
                quickWins.filter(w => w.completed), 
                [quickWins]
            );
            
            const dailyAgenda = useMemo(() => 
                reminders[currentKey] || [], 
                [reminders, currentKey]
            );

            const saveToFirestore = useCallback((collection, docId, data) => {
                if (!user || !db) return;
                
                setSyncStatus('syncing');
                db.collection('users').doc(user.uid).collection(collection).doc(docId)
                    .set(data, { merge: true })
                    .then(() => setSyncStatus('connected'))
                    .catch((error) => {
                        console.error(`Error saving to ${collection}:`, error);
                        setSyncStatus('disconnected');
                    });
            }, [user]);

            const deleteFromFirestore = useCallback((collection, docId) => {
                if (!user || !db) return;
                
                setSyncStatus('syncing');
                db.collection('users').doc(user.uid).collection(collection).doc(docId)
                    .delete()
                    .then(() => setSyncStatus('connected'))
                    .catch((error) => {
                        console.error(`Error deleting from ${collection}:`, error);
                        setSyncStatus('disconnected');
                    });
            }, [user]);

            const handleWinToggle = useCallback((id) => {
                setQuickWins(prev => {
                    const updated = prev.map(w => 
                        w.id === id ? {...w, completed: !w.completed} : w
                    );
                    const item = updated.find(w => w.id === id);
                    if (item && user && db) {
                        saveToFirestore('quickWins', id, item);
                    }
                    return updated;
                });
            }, [user, saveToFirestore]);

            const handleWinDelete = useCallback((id) => {
                setQuickWins(prev => prev.filter(w => w.id !== id));
                deleteFromFirestore('quickWins', id);
            }, [deleteFromFirestore]);

            const handleWinStartEdit = useCallback((id, text, details) => {
                setEditingNoteId(id);
                setTempNoteText(text);
                setTempNoteDetails(details);
            }, []);

            const handleWinSaveEdit = useCallback((id, text, details) => {
                setQuickWins(prev => {
                    const updated = prev.map(w => 
                        w.id === id ? {...w, text, details} : w
                    );
                    const item = updated.find(w => w.id === id);
                    if (item && user && db) {
                        saveToFirestore('quickWins', id, item);
                    }
                    return updated;
                });
                setEditingNoteId(null);
            }, [user, saveToFirestore]);

            const handleWinCancelEdit = useCallback(() => {
                setEditingNoteId(null);
            }, []);

            const handleWinStartSchedule = useCallback((id) => {
                setSchedulingNoteId(id);
                setEditingNoteId(null);
            }, []);

            const handleWinScheduleConfirm = useCallback((item, targetDate) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    const list = updated[targetDate] || [];
                    const newEvent = { 
                        id: Date.now(), 
                        text: item.text, 
                        notes: item.details, 
                        startDate: targetDate, 
                        type: 'win',
                        linkedNoteId: item.id
                    };
                    list.push(newEvent);
                    updated[targetDate] = list;
                    
                    if (user && db) {
                        saveToFirestore('reminders', targetDate, { events: list });
                    }
                    return updated;
                });
                setSchedulingNoteId(null);
            }, [user, saveToFirestore]);

            const handleNoteDelete = useCallback((id) => {
                setScratchNotes(prev => prev.filter(n => n.id !== id));
                deleteFromFirestore('scratchNotes', id);
            }, [deleteFromFirestore]);

            const handleNoteStartEdit = useCallback((id, text, details) => {
                setEditingNoteId(id);
                setSchedulingNoteId(null);
                setTempNoteText(text);
                setTempNoteDetails(details);
            }, []);

            const handleNoteSaveEdit = useCallback((id, text, details) => {
                setScratchNotes(prev => {
                    const updated = prev.map(n => 
                        n.id === id ? {...n, text, details} : n
                    );
                    const item = updated.find(n => n.id === id);
                    if (item && user && db) {
                        saveToFirestore('scratchNotes', id, item);
                    }
                    return updated;
                });
                
                setReminders(prev => {
                    const updated = { ...prev };
                    let hasChanges = false;
                    
                    Object.keys(updated).forEach(dateKey => {
                        updated[dateKey] = updated[dateKey].map(event => {
                            if (event.linkedNoteId === id) {
                                hasChanges = true;
                                return { ...event, text, notes: details };
                            }
                            return event;
                        });
                        
                        if (hasChanges && user && db) {
                            saveToFirestore('reminders', dateKey, { events: updated[dateKey] });
                        }
                    });
                    
                    return updated;
                });
                
                setEditingNoteId(null);
            }, [user, saveToFirestore]);

            const handleNoteStartSchedule = useCallback((id, text, details) => {
                setEditingNoteId(null);
                setSchedulingNoteId(id);
                setFormData(prev => ({...prev, text, details}));
            }, []);

            const handleNoteScheduleConfirm = useCallback((note, targetDate) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    const list = updated[targetDate] || [];
                    const newEvent = { 
                        id: Date.now(), 
                        text: note.text, 
                        notes: note.details, 
                        startDate: targetDate, 
                        type: 'note',
                        linkedNoteId: note.id
                    };
                    list.push(newEvent);
                    updated[targetDate] = list;
                    
                    if (user && db) {
                        saveToFirestore('reminders', targetDate, { events: list });
                    }
                    return updated;
                });
                setSchedulingNoteId(null);
            }, [user, saveToFirestore]);

            const handleAgendaStartEdit = useCallback((id, text, notes) => {
                setEditingNoteId(id);
                setTempNoteText(text);
                setTempNoteDetails(notes || "");
            }, []);

            const handleAgendaSaveEdit = useCallback((id, text, notes) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    updated[currentKey] = updated[currentKey].map(item => 
                        item.id === id ? { ...item, text, notes } : item
                    );
                    
                    if (user && db) {
                        saveToFirestore('reminders', currentKey, { events: updated[currentKey] });
                    }
                    return updated;
                });
                setEditingNoteId(null);
            }, [currentKey, user, saveToFirestore]);

            const handleAgendaDelete = useCallback((id) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    updated[currentKey] = updated[currentKey].filter(item => item.id !== id);
                    
                    if (user && db) {
                        saveToFirestore('reminders', currentKey, { events: updated[currentKey] });
                    }
                    return updated;
                });
            }, [currentKey, user, saveToFirestore]);

            const handleAddWin = useCallback((text) => {
                const newWin = { 
                    id: Date.now().toString(), 
                    text, 
                    details: "", 
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                setQuickWins(prev => [newWin, ...prev]);
                
                if (user && db) {
                    saveToFirestore('quickWins', newWin.id, newWin);
                }
            }, [user, saveToFirestore]);

            const handleAddNote = useCallback((text) => {
                const newNote = {
                    text,
                    details: "",
                    id: Date.now().toString(),
                    createdAt: new Date().toISOString()
                };
                
                setScratchNotes(prev => [newNote, ...prev]);
                
                if (user && db) {
                    saveToFirestore('scratchNotes', newNote.id, newNote);
                }
            }, [user, saveToFirestore]);

            const calendarDays = useMemo(() => {
                const year = navDate.getFullYear(); 
                const month = navDate.getMonth(); 
                const firstDay = new Date(year, month, 1).getDay(); 
                const daysInMonth = new Date(year, month + 1, 0).getDate(); 
                const days = [];
                
                for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                
                for (let i = 1; i <= daysInMonth; i++) {
                    const d = new Date(year, month, i); 
                    const k = formatKey(d);
                    const hasWin = reminders[k] && reminders[k].some(r => r.type === 'win');
                    const hasNote = reminders[k] && reminders[k].some(r => r.type === 'note' || !r.type);
                    
                    days.push(
                        <div key={i} className="relative">
                            <button 
                                onClick={() => setSelectedDate(d)} 
                                onDoubleClick={() => {
                                    setSelectedDate(d);
                                    setTempNoteText("");
                                    setTempNoteDetails("");
                                    setIsCreatingEvent(true);
                                }}
                                className={`w-full aspect-square text-[9px] font-bold rounded-md flex flex-col items-center justify-center transition-all ${formatKey(selectedDate) === k ? 'bg-gray-900 text-white' : 'hover:bg-gray-50 text-gray-500'}`}
                            >
                                {i}
                                <div className="flex gap-0.5 mt-0.5">
                                    {hasWin && <div className="w-1 h-1 rounded-full bg-blue-500" />}
                                    {hasNote && <div className="w-1 h-1 rounded-full bg-pink-500" />}
                                </div>
                            </button>

                            {isCreatingEvent && formatKey(selectedDate) === k && (
                                <div className="absolute top-0 left-full ml-2 w-48 bg-white border-2 border-pink-500 shadow-2xl rounded-2xl p-3 z-[110] animate-pop text-black">
                                    <p className="text-[8px] font-black text-pink-500 uppercase mb-2">New Event: {k}</p>
                                    <input 
                                        autoFocus
                                        placeholder="Event Title"
                                        className="w-full text-[10px] font-bold p-2 bg-gray-50 rounded-lg mb-2 outline-none border border-transparent focus:border-pink-200"
                                        value={tempNoteText}
                                        onChange={e => setTempNoteText(e.target.value)}
                                    />
                                    <textarea 
                                        placeholder="Details..."
                                        className="w-full text-[9px] p-2 bg-gray-50 rounded-lg mb-3 outline-none min-h-[60px] resize-none"
                                        value={tempNoteDetails}
                                        onChange={e => setTempNoteDetails(e.target.value)}
                                    />
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => {
                                                if(!tempNoteText) return;
                                                setReminders(prev => {
                                                    const updated = { ...prev };
                                                    const list = updated[k] || [];
                                                    const newEvent = { 
                                                        id: Date.now(), 
                                                        text: tempNoteText, 
                                                        notes: tempNoteDetails, 
                                                        startDate: k, 
                                                        type: 'note' 
                                                    };
                                                    list.push(newEvent);
                                                    updated[k] = list;
                                                    
                                                    if (user && db) {
                                                        saveToFirestore('reminders', k, { events: list });
                                                    }
                                                    return updated;
                                                });
                                                setIsCreatingEvent(false);
                                                setTempNoteText("");
                                                setTempNoteDetails("");
                                            }}
                                            className="flex-grow bg-pink-500 text-white text-[8px] font-black uppercase py-1.5 rounded-lg"
                                        >
                                            Create
                                        </button>
                                        <button 
                                            onClick={() => setIsCreatingEvent(false)} 
                                            className="bg-gray-100 text-gray-400 text-[8px] font-black uppercase px-2 py-1.5 rounded-lg"
                                        >
                                            Ã—
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }
                return days;
            }, [navDate, reminders, selectedDate, isCreatingEvent, tempNoteText, tempNoteDetails, user, saveToFirestore]);

            return (
                <>
                    <div className="firebase-status">
                        <div className={`status-dot ${
                            syncStatus === 'connected' ? 'status-connected' :
                            syncStatus === 'syncing' ? 'status-syncing' :
                            'status-disconnected'
                        }`} />
                        <span className="text-gray-600">
                            {isFirebaseConfigured ? (
                                syncStatus === 'connected' ? 'Cloud Synced' :
                                syncStatus === 'syncing' ? 'Syncing...' :
                                'Offline'
                            ) : 'Local Mode'}
                        </span>
                    </div>

                    <div className="max-w-[1600px] mx-auto grid lg:grid-cols-12 gap-6">
                        {/* Quick Wins - Standalone Panel */}
                        <div className="lg:col-span-3 bg-white border-2 border-gray-100 rounded-[40px] shadow-sm p-8 flex flex-col min-h-[800px]">
                            <h3 className="text-[10px] font-black text-blue-500 uppercase tracking-[.3em] mb-4">Quick Wins</h3>
                            <input 
                                type="text" 
                                placeholder="+ Add Win" 
                                value={newWinText} 
                                onChange={e => setNewWinText(e.target.value)} 
                                onKeyDown={e => { 
                                    if(e.key === 'Enter' && newWinText.trim()){ 
                                        handleAddWin(newWinText);
                                        setNewWinText(""); 
                                    }
                                }} 
                                className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 text-[10px] font-bold outline-none mb-6 shadow-sm focus:border-blue-200 transition-all" 
                            />
                            
                            <div className="flex-grow overflow-y-auto pr-2 custom-scroll space-y-3">
                                {activeWins.map(item => (
                                    <WinItem 
                                        key={item.id} 
                                        item={item}
                                        editingNoteId={editingNoteId}
                                        schedulingNoteId={schedulingNoteId}
                                        tempNoteText={tempNoteText}
                                        tempNoteDetails={tempNoteDetails}
                                        onStartEdit={handleWinStartEdit}
                                        onStartSchedule={handleWinStartSchedule}
                                        onSaveEdit={handleWinSaveEdit}
                                        onCancelEdit={handleWinCancelEdit}
                                        onToggleComplete={handleWinToggle}
                                        onDelete={handleWinDelete}
                                        onScheduleConfirm={handleWinScheduleConfirm}
                                        formData={formData}
                                        setFormData={setFormData}
                                        execCommand={execCommand}
                                        editorRef={editorRef}
                                    />
                                ))}

                                {completedWins.length > 0 && (
                                    <div className="pt-6">
                                        <button 
                                            onClick={() => setShowCompleted(!showCompleted)} 
                                            className="flex items-center gap-2 mb-4 w-full group"
                                        >
                                            <div className="h-[1px] flex-grow bg-gray-200"></div>
                                            <span className="text-[8px] font-black uppercase text-gray-400 tracking-tighter group-hover:text-blue-400 transition-colors">
                                                Completed ({completedWins.length})
                                            </span>
                                            <div className="h-[1px] flex-grow bg-gray-200"></div>
                                        </button>
                                        
                                        {showCompleted && (
                                            <div className="space-y-3 animate-pop">
                                                {completedWins.map(item => (
                                                    <WinItem 
                                                        key={item.id} 
                                                        item={item}
                                                        editingNoteId={editingNoteId}
                                                        schedulingNoteId={schedulingNoteId}
                                                        tempNoteText={tempNoteText}
                                                        tempNoteDetails={tempNoteDetails}
                                                        onStartEdit={handleWinStartEdit}
                                                        onStartSchedule={handleWinStartSchedule}
                                                        onSaveEdit={handleWinSaveEdit}
                                                        onCancelEdit={handleWinCancelEdit}
                                                        onToggleComplete={handleWinToggle}
                                                        onDelete={handleWinDelete}
                                                        onScheduleConfirm={handleWinScheduleConfirm}
                                                        formData={formData}
                                                        setFormData={setFormData}
                                                        execCommand={execCommand}
                                                        editorRef={editorRef}
                                                    />
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* QuickNotes - Now Full Width */}
                        <div className="lg:col-span-5 bg-white border-2 border-gray-100 rounded-[40px] shadow-sm overflow-hidden min-h-[800px]">
                            <div className="p-10">
                                <h3 className="text-[10px] font-black text-pink-500 uppercase tracking-[.4em] mb-2">Workspace</h3>
                                <h2 className="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-8">QuickNotes</h2>
                                <input 
                                    type="text" 
                                    placeholder="New note..." 
                                    className="w-full bg-gray-50 border-2 border-gray-50 rounded-2xl p-6 text-lg font-bold outline-none focus:border-pink-100 mb-8" 
                                    onKeyDown={e => { 
                                        if(e.key === 'Enter' && e.target.value.trim()){ 
                                            handleAddNote(e.target.value);
                                            e.target.value=""; 
                                        }
                                    }} 
                                />
                                <div className="space-y-4">
                                    {scratchNotes.map(note => {
                                        const isScheduled = Object.values(reminders).some(dayEvents => 
                                            dayEvents.some(event => event.linkedNoteId === note.id)
                                        );
                                        const scheduledDates = Object.entries(reminders)
                                            .filter(([date, events]) => events.some(e => e.linkedNoteId === note.id))
                                            .map(([date]) => date);
                                        
                                        return (
                                            <div key={note.id}>
                                                {editingNoteId === note.id ? (
                                                    <div className="bg-white p-6 rounded-[32px] border-2 border-blue-500 shadow-xl animate-pop space-y-4">
                                                        <input 
                                                            className="text-xl font-bold text-gray-900 outline-none w-full bg-gray-50 p-4 rounded-xl" 
                                                            value={tempNoteText} 
                                                            onChange={e => setTempNoteText(e.target.value)} 
                                                        />
                                                        <div className="flex flex-wrap items-center gap-1 p-2 bg-gray-50 rounded-xl border border-gray-100">
                                                            <button onClick={() => execCommand('bold')} className="p-1.5 hover:bg-gray-200 rounded font-bold w-8 text-xs">B</button>
                                                            <button onClick={() => execCommand('underline')} className="p-1.5 hover:bg-gray-200 rounded underline w-8 text-xs">U</button>
                                                            <button onClick={() => execCommand('insertUnorderedList')} className="p-1.5 hover:bg-gray-200 rounded text-xs">Bullets</button>
                                                        </div>
                                                        <div 
                                                            ref={editorRef} 
                                                            contentEditable 
                                                            className="rich-editor w-full bg-gray-50 p-4 rounded-xl text-sm font-medium outline-none overflow-y-auto" 
                                                            dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                                                        />
                                                        <div className="flex gap-2">
                                                            <button 
                                                                onClick={() => handleNoteSaveEdit(note.id, tempNoteText, editorRef.current.innerHTML)} 
                                                                className="bg-gray-900 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
                                                            >
                                                                Save
                                                            </button>
                                                            <button 
                                                                onClick={handleWinCancelEdit} 
                                                                className="bg-gray-100 text-gray-400 px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
                                                            >
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : schedulingNoteId === note.id ? (
                                                    <div className="bg-white p-8 rounded-[32px] shadow-2xl border-pink-500 border-2 animate-pop">
                                                        <h3 className="text-xl font-bold mb-4">{note.text}</h3>
                                                        <div className="flex items-center gap-4">
                                                            <InlineDatePicker 
                                                                value={formData.startDate} 
                                                                onChange={v => setFormData({...formData, startDate: v})} 
                                                            />
                                                            <button 
                                                                onClick={() => handleNoteScheduleConfirm(note, formData.startDate)} 
                                                                className="bg-gray-900 text-white px-6 py-3 rounded-xl text-[10px] font-black uppercase ml-auto"
                                                            >
                                                                Confirm
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div 
                                                        onDoubleClick={() => handleNoteStartEdit(note.id, note.text, note.details || "")} 
                                                        className="bg-gray-50/50 p-6 rounded-3xl hover:bg-white border border-transparent hover:border-gray-100 flex justify-between items-center cursor-pointer group transition-all"
                                                    >
                                                        <div className="min-w-0 flex-grow">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-bold text-gray-700 block truncate">{note.text}</span>
                                                                {isScheduled && (
                                                                    <div className="flex items-center gap-1 bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider shrink-0">
                                                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                                                        </svg>
                                                                        <span>{scheduledDates.length}</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                            {note.details && (
                                                                <div 
                                                                    className="text-[10px] text-gray-400 mt-1 italic line-clamp-1 opacity-60" 
                                                                    dangerouslySetInnerHTML={{ __html: note.details }}
                                                                />
                                                            )}
                                                        </div>
                                                        <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                                            <button 
                                                                onClick={e => { 
                                                                    e.stopPropagation(); 
                                                                    handleNoteDelete(note.id);
                                                                }} 
                                                                className="p-2 text-gray-300 hover:text-red-500 transition-colors"
                                                            >
                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                                </svg>
                                                            </button>
                                                            <button 
                                                                onClick={e => { 
                                                                    e.stopPropagation(); 
                                                                    handleNoteStartSchedule(note.id, note.text, note.details || "");
                                                                }} 
                                                                className="bg-pink-50 text-pink-600 px-4 py-2 rounded-xl text-[9px] font-black uppercase"
                                                            >
                                                                Schedule
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-4 flex flex-col gap-4">
                            <div className="bg-white rounded-[24px] border border-gray-100 shadow-sm p-4">
                                <div className="flex justify-between items-center mb-3">
                                    <h4 className="text-[9px] font-black uppercase text-gray-400">
                                        {navDate.toLocaleString('default', { month: 'short', year: 'numeric' })}
                                    </h4>
                                    <div className="flex gap-1">
                                        <button 
                                            onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() - 1, 1))} 
                                            className="p-1 text-gray-300"
                                        >
                                            â†
                                        </button>
                                        <button 
                                            onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() + 1, 1))} 
                                            className="p-1 text-gray-300"
                                        >
                                            â†’
                                        </button>
                                    </div>
                                </div>
                                <div className="day-grid gap-1">
                                    {["S","M","T","W","T","F","S"].map(d => 
                                        <div key={d} className="text-center text-[7px] font-black text-gray-200 mb-1">{d}</div>
                                    )}
                                    {calendarDays}
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-[24px] border border-gray-100 shadow-sm flex-grow flex flex-col overflow-hidden min-h-[400px]">
                                <div className="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                                    <h3 className="text-[9px] font-black text-gray-400 uppercase tracking-widest">Daily Agenda</h3>
                                    <span className="text-[8px] font-black text-gray-400">{currentKey}</span>
                                </div>
                                <div className="p-4 space-y-2 flex-grow overflow-y-auto custom-scroll">
                                    {dailyAgenda.length === 0 && (
                                        <p className="text-[9px] text-gray-300 text-center italic py-10 uppercase tracking-widest">Free Day</p>
                                    )}
                                    {dailyAgenda.map(r => (
                                        <div key={r.id}>
                                            {editingNoteId === r.id ? (
                                                <div className={`p-4 rounded-2xl border-2 shadow-xl animate-pop space-y-3 bg-white ${r.type === 'win' ? 'border-blue-500' : 'border-pink-500'}`}>
                                                    <input 
                                                        autoFocus 
                                                        className="text-[11px] font-black uppercase text-gray-900 outline-none w-full bg-gray-50 p-2 rounded-lg" 
                                                        value={tempNoteText} 
                                                        onChange={e => setTempNoteText(e.target.value)} 
                                                    />
                                                    <div className="flex gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                                                        <button onClick={() => execCommand('bold')} className="p-1 hover:bg-gray-200 rounded font-bold w-6 text-[10px]">B</button>
                                                        <button onClick={() => execCommand('underline')} className="p-1 hover:bg-gray-200 rounded underline w-6 text-[10px]">U</button>
                                                    </div>
                                                    <div 
                                                        ref={editorRef} 
                                                        contentEditable 
                                                        className="rich-editor w-full bg-gray-50 p-3 rounded-lg text-[10px] font-medium min-h-[80px] outline-none overflow-y-auto" 
                                                        dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                                                    />
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => handleAgendaSaveEdit(r.id, tempNoteText, editorRef.current.innerHTML)} 
                                                            className="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                                                        >
                                                            Save
                                                        </button>
                                                        <button 
                                                            onClick={handleWinCancelEdit} 
                                                            className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                                                        >
                                                            Cancel
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div 
                                                    onDoubleClick={() => handleAgendaStartEdit(r.id, r.text, r.notes || "")} 
                                                    className={`p-3 rounded-xl border-l-4 cursor-pointer transition-all hover:brightness-95 ${
                                                        r.type === 'win' ? 'bg-blue-50/50 border-blue-500' : 'bg-pink-50/50 border-pink-500'
                                                    }`}
                                                >
                                                    <div className="flex justify-between items-start text-black">
                                                        <div className="flex items-center gap-1 flex-grow min-w-0">
                                                            <p className={`text-[10px] font-black uppercase mb-1 truncate ${r.type === 'win' ? 'text-blue-800' : 'text-gray-800'}`}>
                                                                {r.text}
                                                            </p>
                                                            {r.linkedNoteId && (
                                                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="shrink-0 text-pink-400">
                                                                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                                                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                                                                </svg>
                                                            )}
                                                        </div>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleAgendaDelete(r.id);
                                                            }}
                                                            className="text-gray-300 hover:text-red-500 transition-colors"
                                                        >
                                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                    <div 
                                                        className="text-[9px] text-gray-400 italic line-clamp-2" 
                                                        dangerouslySetInnerHTML={{ __html: r.notes }}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CalendarApp />);
    </script>
</body>
</html>

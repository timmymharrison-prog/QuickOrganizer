<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Jefferson - With Calendar</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; margin: 0; }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .rich-editor { min-height: 100px; outline: none; }
        .rich-editor ul { list-style-type: disc; padding-left: 1.5rem; }
        .rich-editor ol { list-style-type: decimal; padding-left: 1.5rem; }
        .rich-editor b { font-weight: bold; }
        .rich-editor u { text-decoration: underline; }
        .status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
        }
        .status-connected { background: #10b981; }
        .status-disconnected { background: #ef4444; }
        .status-syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .calendar-day { 
            aspect-ratio: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .calendar-day:hover { background: #f3f4f6; }
        .calendar-day.selected { background: #dbeafe; border: 2px solid #3b82f6; }
        .calendar-day.today { background: #fef3c7; }
        .event-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            margin: 1px;
        }
        
        /* Dark Mode Styles */
        body.dark {
            background-color: #111827;
            color: #f9fafb;
        }
        body.dark .bg-white {
            background-color: #1f2937 !important;
            color: #f9fafb;
        }
        body.dark .bg-gray-50 {
            background-color: #374151 !important;
        }
        body.dark .bg-gray-100 {
            background-color: #4b5563 !important;
        }
        body.dark .text-gray-900 {
            color: #f9fafb !important;
        }
        body.dark .text-gray-700 {
            color: #e5e7eb !important;
        }
        body.dark .text-gray-400 {
            color: #9ca3af !important;
        }
        body.dark .border-gray-100 {
            border-color: #374151 !important;
        }
        body.dark .border-gray-200 {
            border-color: #4b5563 !important;
        }
        body.dark input, body.dark select, body.dark .rich-editor {
            background-color: #374151 !important;
            color: #f9fafb !important;
            border-color: #4b5563 !important;
        }
    </style>
</head>
<body class="p-4 md:p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC21uDcMLyGso3kLqBYimTL8loUi5zzLjw",
            authDomain: "nova-quick.firebaseapp.com",
            projectId: "nova-quick",
            storageBucket: "nova-quick.firebasestorage.app",
            messagingSenderId: "914595554926",
            appId: "1:914595554926:web:e19d4fc962794d9e9aa87f",
            measurementId: "G-YLV78DYWEJ"
        };

        // Initialize Firebase
        let db = null;
        let auth = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            console.log("✅ Firebase initialized successfully");
        } catch (error) {
            console.error("❌ Firebase initialization error:", error);
        }

        const colorClasses = {
            blue: 'bg-blue-500',
            purple: 'bg-purple-500',
            pink: 'bg-pink-500',
            red: 'bg-red-500',
            orange: 'bg-orange-500',
            green: 'bg-green-500'
        };

        // Auth Screen Component
        function AuthScreen() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        if (password !== confirmPassword) {
                            setError('Passwords do not match');
                            setLoading(false);
                            return;
                        }
                        if (password.length < 6) {
                            setError('Password must be at least 6 characters');
                            setLoading(false);
                            return;
                        }
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setLoading(false);
                    switch (err.code) {
                        case 'auth/email-already-in-use':
                            setError('Email already in use');
                            break;
                        case 'auth/invalid-email':
                            setError('Invalid email address');
                            break;
                        case 'auth/user-not-found':
                            setError('No account found with this email');
                            break;
                        case 'auth/wrong-password':
                            setError('Incorrect password');
                            break;
                        default:
                            setError(err.message);
                    }
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-pink-50">
                    <div className="bg-white rounded-[40px] shadow-2xl p-12 max-w-md w-full border-2 border-gray-100">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-2">
                                Code Jefferson
                            </h1>
                            <p className="text-xs font-black uppercase tracking-widest text-gray-400">
                                {isLogin ? 'Welcome Back' : 'Create Account'}
                            </p>
                        </div>

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium"
                                    placeholder="you@example.com"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium"
                                    placeholder="••••••••"
                                    required
                                />
                            </div>

                            {!isLogin && (
                                <div>
                                    <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                        Confirm Password
                                    </label>
                                    <input
                                        type="password"
                                        value={confirmPassword}
                                        onChange={(e) => setConfirmPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium"
                                        placeholder="••••••••"
                                        required
                                    />
                                </div>
                            )}

                            {error && (
                                <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-bold">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gray-900 text-white py-4 rounded-xl font-black uppercase text-sm tracking-wider hover:bg-gray-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Please wait...' : isLogin ? 'Sign In' : 'Create Account'}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button
                                onClick={() => {
                                    setIsLogin(!isLogin);
                                    setError('');
                                    setPassword('');
                                    setConfirmPassword('');
                                }}
                                className="text-sm text-gray-600 hover:text-gray-900 font-bold transition-colors"
                            >
                                {isLogin ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const TaskItem = React.memo(({ 
            item, 
            editingId,
            tempText,
            tempDetails,
            tempFolderId,
            folders,
            onStartEdit,
            onSaveEdit,
            onCancelEdit,
            onToggleComplete,
            onDelete,
            onFolderChange,
            execCommand,
            editorRef
        }) => {
            const itemFolder = folders.find(f => f.id === item.folderId);

            if (editingId === item.id) {
                return (
                    <div className="bg-white p-4 rounded-2xl border-2 border-blue-500 shadow-xl animate-pop space-y-3">
                        <input 
                            autoFocus 
                            className="text-[11px] font-black uppercase text-gray-900 outline-none w-full bg-gray-50 p-2 rounded-lg" 
                            value={tempText} 
                            onChange={e => onStartEdit(item.id, e.target.value, tempDetails, tempFolderId)} 
                        />
                        <div className="flex gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                            <button onClick={() => execCommand('bold')} className="p-1 hover:bg-gray-200 rounded font-bold w-6 text-[10px]">B</button>
                            <button onClick={() => execCommand('underline')} className="p-1 hover:bg-gray-200 rounded underline w-6 text-[10px]">U</button>
                            <button onClick={() => execCommand('insertUnorderedList')} className="p-1 hover:bg-gray-200 rounded text-[9px] px-2 font-bold">List</button>
                        </div>
                        <div 
                            ref={editorRef} 
                            contentEditable 
                            className="rich-editor w-full bg-gray-50 p-3 rounded-lg text-[10px] font-medium min-h-[80px] outline-none overflow-y-auto" 
                            dangerouslySetInnerHTML={{ __html: tempDetails }} 
                        />
                        <div>
                            <label className="block text-[8px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                Folder
                            </label>
                            <select
                                value={tempFolderId}
                                onChange={(e) => onFolderChange(e.target.value)}
                                className="w-full text-[10px] p-2 bg-gray-50 rounded-lg border border-gray-100 outline-none"
                            >
                                <option value="">No Folder</option>
                                {folders.map(folder => (
                                    <option key={folder.id} value={folder.id}>{folder.name}</option>
                                ))}
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => onSaveEdit(item.id, tempText, editorRef.current.innerHTML, tempFolderId)} 
                                className="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                            >
                                Save
                            </button>
                            <button 
                                onClick={onCancelEdit} 
                                className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div 
                    onClick={() => onStartEdit(item.id, item.text, item.details || "", item.folderId || "")} 
                    className={`flex items-center gap-3 p-4 bg-white rounded-2xl border border-gray-100 shadow-sm transition-all group hover:border-blue-200 cursor-pointer ${item.completed ? 'opacity-60 bg-gray-50' : ''}`}
                >
                    <input 
                        type="checkbox" 
                        checked={item.completed} 
                        onChange={(e) => { 
                            e.stopPropagation(); 
                            onToggleComplete(item.id);
                        }} 
                        className="w-4 h-4 accent-blue-500 cursor-pointer" 
                    />
                    <div className="flex-grow min-w-0">
                        <p className={`text-[11px] font-black uppercase text-gray-900 ${item.completed ? 'line-through' : ''}`}>
                            {item.text}
                        </p>
                        {itemFolder && (
                            <span className={`inline-block mt-1 px-2 py-0.5 rounded-full text-[7px] font-black uppercase text-white ${colorClasses[itemFolder.color] || 'bg-gray-400'}`}>
                                {itemFolder.name}
                            </span>
                        )}
                        {item.details && (
                            <div 
                                className="text-[8px] text-gray-400 italic truncate opacity-60 mt-1" 
                                dangerouslySetInnerHTML={{ __html: item.details }}
                            />
                        )}
                    </div>
                    <button 
                        onClick={(e) => { 
                            e.stopPropagation(); 
                            onDelete(item.id);
                        }} 
                        className="opacity-0 group-hover:opacity-100 p-1 text-gray-300 hover:text-red-500 transition-colors"
                    >
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            );
        });

        function MainApp({ user, onSignOut }) {
            const [syncStatus, setSyncStatus] = useState('disconnected');
            const [scratchNotes, setScratchNotes] = useState([]);
            const [quickWins, setQuickWins] = useState([]);
            const [calendarEvents, setCalendarEvents] = useState([]);
            const [folders, setFolders] = useState([]);
            const [showCompleted, setShowCompleted] = useState(true);
            const [menuOpen, setMenuOpen] = useState(false);
            const [showFolderInput, setShowFolderInput] = useState(false);
            const [newFolderName, setNewFolderName] = useState('');
            const [newFolderColor, setNewFolderColor] = useState('blue');
            const [activePanel, setActivePanel] = useState('wins'); // 'wins', 'notes', 'calendar'
            
            // New feature states
            const [searchQuery, setSearchQuery] = useState("");
            const [darkMode, setDarkMode] = useState(false);
            const [notificationsEnabled, setNotificationsEnabled] = useState(false);
            
            const [editingNoteId, setEditingNoteId] = useState(null); 
            const [tempNoteText, setTempNoteText] = useState("");
            const [tempNoteDetails, setTempNoteDetails] = useState("");
            const [tempFolderId, setTempFolderId] = useState("");
            const [newWinText, setNewWinText] = useState("");

            // Calendar state
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(null);
            const [newEventText, setNewEventText] = useState("");
            const [newEventFolderId, setNewEventFolderId] = useState("");
            const [editingEventId, setEditingEventId] = useState(null);
            const [tempEventText, setTempEventText] = useState("");
            const [tempEventDetails, setTempEventDetails] = useState("");
            const [tempEventFolderId, setTempEventFolderId] = useState("");
            const [showNewEventFolders, setShowNewEventFolders] = useState(false);
            const [newEventRecurring, setNewEventRecurring] = useState("none"); // none, daily, weekly, monthly
            const [tempEventRecurring, setTempEventRecurring] = useState("none");
            
            const eventEditorRef = useRef(null);

            // Dark mode effect
            useEffect(() => {
                if (darkMode) {
                    document.body.classList.add('dark');
                    document.body.style.backgroundColor = '#111827';
                } else {
                    document.body.classList.remove('dark');
                    document.body.style.backgroundColor = '#f9fafb';
                }
            }, [darkMode]);

            // Request notification permission
            useEffect(() => {
                if ('Notification' in window && Notification.permission === 'granted') {
                    setNotificationsEnabled(true);
                }
            }, []);

            const requestNotificationPermission = async () => {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    setNotificationsEnabled(permission === 'granted');
                }
            };

            // Check for upcoming events and send notifications
            useEffect(() => {
                if (!notificationsEnabled) return;

                const checkNotifications = () => {
                    const now = new Date();
                    const in15Min = new Date(now.getTime() + 15 * 60000);
                    
                    calendarEvents.forEach(event => {
                        if (event.completed) return;
                        
                        const eventDate = new Date(event.date);
                        if (eventDate >= now && eventDate <= in15Min) {
                            new Notification('Upcoming Event', {
                                body: event.text,
                                icon: '/favicon.ico'
                            });
                        }
                    });
                };

                const interval = setInterval(checkNotifications, 60000); // Check every minute
                return () => clearInterval(interval);
            }, [calendarEvents, notificationsEnabled]);

            const editorRef = useRef(null);
            const menuRef = useRef(null);

            // Close menu when clicking outside
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) {
                        setMenuOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Firestore Real-time Sync
            useEffect(() => {
                if (!user || !db) return;

                setSyncStatus('syncing');

                const scratchUnsub = db.collection('users').doc(user.uid).collection('scratchNotes')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const notes = [];
                        snapshot.forEach(doc => {
                            notes.push({ id: doc.id, ...doc.data() });
                        });
                        setScratchNotes(notes);
                        setSyncStatus('connected');
                    }, (error) => {
                        console.error("Scratch notes sync error:", error);
                        setSyncStatus('disconnected');
                    });

                const winsUnsub = db.collection('users').doc(user.uid).collection('quickWins')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const wins = [];
                        snapshot.forEach(doc => {
                            wins.push({ id: doc.id, ...doc.data() });
                        });
                        setQuickWins(wins);
                    }, (error) => {
                        console.error("Quick wins sync error:", error);
                    });

                const eventsUnsub = db.collection('users').doc(user.uid).collection('calendarEvents')
                    .onSnapshot((snapshot) => {
                        const events = [];
                        snapshot.forEach(doc => {
                            events.push({ id: doc.id, ...doc.data() });
                        });
                        setCalendarEvents(events);
                    }, (error) => {
                        console.error("Calendar events sync error:", error);
                    });

                const foldersUnsub = db.collection('users').doc(user.uid).collection('folders')
                    .onSnapshot((snapshot) => {
                        const folderList = [];
                        snapshot.forEach(doc => {
                            folderList.push({ id: doc.id, ...doc.data() });
                        });
                        setFolders(folderList);
                    }, (error) => {
                        console.error("Folders sync error:", error);
                    });

                return () => {
                    scratchUnsub();
                    winsUnsub();
                    eventsUnsub();
                    foldersUnsub();
                };
            }, [user]);

            const execCommand = useCallback((cmd, val = null) => {
                document.execCommand(cmd, false, val);
                if (editorRef.current) editorRef.current.focus();
            }, []);
            
            const activeWins = useMemo(() => 
                quickWins.filter(w => !w.completed), 
                [quickWins]
            );
            
            const completedWins = useMemo(() => 
                quickWins.filter(w => w.completed), 
                [quickWins]
            );

            // Search filtering
            const filterBySearch = useCallback((items) => {
                if (!searchQuery.trim()) return items;
                const query = searchQuery.toLowerCase();
                return items.filter(item => 
                    item.text?.toLowerCase().includes(query) || 
                    item.details?.toLowerCase().includes(query)
                );
            }, [searchQuery]);

            const filteredActiveWins = useMemo(() => 
                filterBySearch(activeWins), 
                [activeWins, filterBySearch]
            );
            
            const filteredCompletedWins = useMemo(() => 
                filterBySearch(completedWins), 
                [completedWins, filterBySearch]
            );

            const filteredNotes = useMemo(() => 
                filterBySearch(scratchNotes), 
                [scratchNotes, filterBySearch]
            );

            // Calendar helper - must be defined before filteredEvents
            const getEventsForDate = useCallback((date) => {
                if (!date) return [];
                const dateStr = date.toISOString().split('T')[0];
                const targetDate = new Date(dateStr);
                
                return calendarEvents.filter(e => {
                    const eventDate = new Date(e.date);
                    
                    // Exact date match
                    if (e.date === dateStr) return true;
                    
                    // Recurring events
                    if (e.recurring === 'daily' && eventDate <= targetDate) return true;
                    
                    if (e.recurring === 'weekly') {
                        const daysDiff = Math.floor((targetDate - eventDate) / (1000 * 60 * 60 * 24));
                        if (daysDiff >= 0 && daysDiff % 7 === 0) return true;
                    }
                    
                    if (e.recurring === 'monthly') {
                        if (eventDate.getDate() === targetDate.getDate() && eventDate <= targetDate) return true;
                    }
                    
                    return false;
                });
            }, [calendarEvents]);

            const filteredEvents = useMemo(() => {
                if (!selectedDate) return [];
                const events = getEventsForDate(selectedDate);
                return filterBySearch(events);
            }, [selectedDate, getEventsForDate, filterBySearch]);

            const saveToFirestore = useCallback((collection, docId, data) => {
                if (!user || !db) {
                    console.warn('⚠️ Firebase not configured');
                    return;
                }
                
                setSyncStatus('syncing');
                db.collection('users').doc(user.uid).collection(collection).doc(docId)
                    .set(data, { merge: true })
                    .then(() => {
                        console.log(`✓ Saved ${collection}/${docId}`);
                        setSyncStatus('connected');
                    })
                    .catch((error) => {
                        console.error(`Error saving to ${collection}:`, error);
                        setSyncStatus('disconnected');
                    });
            }, [user]);

            const deleteFromFirestore = useCallback((collection, docId) => {
                if (!user || !db) return;
                
                setSyncStatus('syncing');
                db.collection('users').doc(user.uid).collection(collection).doc(docId)
                    .delete()
                    .then(() => setSyncStatus('connected'))
                    .catch((error) => {
                        console.error(`Error deleting from ${collection}:`, error);
                        setSyncStatus('disconnected');
                    });
            }, [user]);

            // Calendar helpers
            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();
                
                return { daysInMonth, startingDayOfWeek, year, month };
            };

            const handleDateClick = (day) => {
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth();
                const date = new Date(year, month, day);
                setSelectedDate(date);
                // Auto-switch to calendar panel on mobile
                setActivePanel('calendar');
            };

            const handleAddEvent = () => {
                if (!newEventText.trim() || !selectedDate) return;

                const dateStr = selectedDate.toISOString().split('T')[0];
                const newEvent = {
                    id: Date.now().toString(),
                    text: newEventText,
                    details: "",
                    date: dateStr,
                    folderId: newEventFolderId,
                    recurring: newEventRecurring,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                setCalendarEvents(prev => [...prev, newEvent]);
                saveToFirestore('calendarEvents', newEvent.id, newEvent);
                setNewEventText('');
                setNewEventFolderId('');
                setNewEventRecurring('none');
                setShowNewEventFolders(false);
            };

            const handleDeleteEvent = (id) => {
                setCalendarEvents(prev => prev.filter(e => e.id !== id));
                deleteFromFirestore('calendarEvents', id);
            };

            const handleToggleEventComplete = (id) => {
                setCalendarEvents(prev => {
                    const updated = prev.map(e => 
                        e.id === id ? {...e, completed: !e.completed} : e
                    );
                    const item = updated.find(e => e.id === id);
                    if (item) {
                        saveToFirestore('calendarEvents', id, item);
                    }
                    return updated;
                });
            };

            const handleEventStartEdit = (id, text, details, folderId, recurring) => {
                setEditingEventId(id);
                setTempEventText(text);
                setTempEventDetails(details);
                setTempEventFolderId(folderId || "");
                setTempEventRecurring(recurring || "none");
            };

            const handleEventSaveEdit = (id, text, details, folderId, recurring) => {
                setCalendarEvents(prev => {
                    const updated = prev.map(e => 
                        e.id === id ? {...e, text, details, folderId, recurring} : e
                    );
                    const item = updated.find(e => e.id === id);
                    if (item) {
                        saveToFirestore('calendarEvents', id, item);
                    }
                    return updated;
                });
                setEditingEventId(null);
            };

            const handleEventCancelEdit = () => {
                setEditingEventId(null);
                setTempEventFolderId("");
            };

            // Folder handlers
            const handleAddFolder = useCallback(() => {
                if (!newFolderName.trim()) return;

                const newFolder = {
                    id: Date.now().toString(),
                    name: newFolderName,
                    color: newFolderColor,
                    createdAt: new Date().toISOString()
                };

                setFolders(prev => [...prev, newFolder]);
                saveToFirestore('folders', newFolder.id, newFolder);
                setNewFolderName('');
                setShowFolderInput(false);
            }, [newFolderName, newFolderColor, saveToFirestore]);

            const handleDeleteFolder = useCallback((id) => {
                setFolders(prev => prev.filter(f => f.id !== id));
                deleteFromFirestore('folders', id);
            }, [deleteFromFirestore]);

            const handleWinToggle = useCallback((id) => {
                setQuickWins(prev => {
                    const updated = prev.map(w => 
                        w.id === id ? {...w, completed: !w.completed} : w
                    );
                    const item = updated.find(w => w.id === id);
                    if (item) {
                        saveToFirestore('quickWins', id, item);
                    }
                    return updated;
                });
            }, [saveToFirestore]);

            const handleWinDelete = useCallback((id) => {
                setQuickWins(prev => prev.filter(w => w.id !== id));
                deleteFromFirestore('quickWins', id);
            }, [deleteFromFirestore]);

            const handleWinStartEdit = useCallback((id, text, details, folderId) => {
                setEditingNoteId(id);
                setTempNoteText(text);
                setTempNoteDetails(details);
                setTempFolderId(folderId || "");
            }, []);

            const handleWinSaveEdit = useCallback((id, text, details, folderId) => {
                setQuickWins(prev => {
                    const updated = prev.map(w => 
                        w.id === id ? {...w, text, details, folderId} : w
                    );
                    const item = updated.find(w => w.id === id);
                    if (item) {
                        saveToFirestore('quickWins', id, item);
                    }
                    return updated;
                });
                setEditingNoteId(null);
            }, [saveToFirestore]);

            const handleWinCancelEdit = useCallback(() => {
                setEditingNoteId(null);
                setTempFolderId("");
            }, []);

            const handleAddWin = useCallback((text) => {
                const newWin = { 
                    id: Date.now().toString(), 
                    text, 
                    details: "", 
                    folderId: "",
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                setQuickWins(prev => [newWin, ...prev]);
                saveToFirestore('quickWins', newWin.id, newWin);
            }, [saveToFirestore]);

            const handleNoteDelete = useCallback((id) => {
                setScratchNotes(prev => prev.filter(n => n.id !== id));
                deleteFromFirestore('scratchNotes', id);
            }, [deleteFromFirestore]);

            const handleNoteStartEdit = useCallback((id, text, details, folderId) => {
                setEditingNoteId(id);
                setTempNoteText(text);
                setTempNoteDetails(details);
                setTempFolderId(folderId || "");
            }, []);

            const handleNoteSaveEdit = useCallback((id, text, details, folderId) => {
                setScratchNotes(prev => {
                    const updated = prev.map(n => 
                        n.id === id ? {...n, text, details, folderId} : n
                    );
                    const item = updated.find(n => n.id === id);
                    if (item) {
                        saveToFirestore('scratchNotes', id, item);
                    }
                    return updated;
                });
                setEditingNoteId(null);
            }, [saveToFirestore]);

            const handleAddNote = useCallback((text) => {
                const newNote = {
                    text,
                    details: "",
                    folderId: "",
                    id: Date.now().toString(),
                    createdAt: new Date().toISOString()
                };
                
                setScratchNotes(prev => [newNote, ...prev]);
                saveToFirestore('scratchNotes', newNote.id, newNote);
            }, [saveToFirestore]);

            // Render calendar grid
            const renderCalendar = () => {
                const { daysInMonth, startingDayOfWeek, year, month } = getDaysInMonth(currentMonth);
                const days = [];
                const today = new Date();
                const isToday = (day) => {
                    return today.getDate() === day && 
                           today.getMonth() === month && 
                           today.getFullYear() === year;
                };

                // Add empty cells for days before month starts
                for (let i = 0; i < startingDayOfWeek; i++) {
                    days.push(<div key={`empty-${i}`} className="calendar-day"></div>);
                }

                // Add days of the month
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const events = getEventsForDate(date);
                    const isSelected = selectedDate && 
                                      selectedDate.getDate() === day && 
                                      selectedDate.getMonth() === month && 
                                      selectedDate.getFullYear() === year;

                    days.push(
                        <div
                            key={day}
                            onClick={() => handleDateClick(day)}
                            className={`calendar-day rounded-lg ${isToday(day) ? 'today' : ''} ${isSelected ? 'selected' : ''}`}
                        >
                            <span className="text-[10px] font-black text-gray-700">{day}</span>
                            <div className="flex gap-0.5 mt-1 flex-wrap justify-center">
                                {events.slice(0, 3).map(event => {
                                    const folder = folders.find(f => f.id === event.folderId);
                                    const colorClass = folder ? colorClasses[folder.color] : 'bg-gray-400';
                                    return (
                                        <div key={event.id} className={`event-dot ${colorClass}`} />
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                return days;
            };

            return (
                <>
                    {/* Hamburger Menu with Status */}
                    <div className="fixed top-20 left-4 z-[2000]" ref={menuRef}>
                        <button
                            onClick={() => setMenuOpen(!menuOpen)}
                            className="p-3 bg-white rounded-xl shadow-lg hover:shadow-xl transition-all relative"
                        >
                            <div className={`absolute -top-1 -right-1 status-dot ${
                                syncStatus === 'connected' ? 'status-connected' :
                                syncStatus === 'syncing' ? 'status-syncing' :
                                'status-disconnected'
                            }`} />
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>

                        {menuOpen && (
                            <div className="absolute top-16 left-0 w-72 bg-white rounded-2xl shadow-2xl border border-gray-100 p-4 animate-pop">
                                {/* Search Bar */}
                                <div className="mb-4">
                                    <input
                                        type="text"
                                        placeholder="Search everything..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-500"
                                    />
                                    {searchQuery && (
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            className="mt-1 text-xs text-gray-400 hover:text-gray-600"
                                        >
                                            Clear search
                                        </button>
                                    )}
                                </div>

                                {/* Dark Mode Toggle */}
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="w-full p-2 mb-2 border-2 border-gray-200 rounded-lg text-xs font-black uppercase text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-all flex items-center justify-center gap-2"
                                >
                                    {darkMode ? (
                                        <>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <circle cx="12" cy="12" r="5"></circle>
                                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                                            </svg>
                                            Light Mode
                                        </>
                                    ) : (
                                        <>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                            </svg>
                                            Dark Mode
                                        </>
                                    )}
                                </button>

                                {/* Notifications Toggle */}
                                {!notificationsEnabled && (
                                    <button
                                        onClick={requestNotificationPermission}
                                        className="w-full p-2 mb-3 border-2 border-gray-200 rounded-lg text-xs font-black uppercase text-gray-600 hover:border-green-300 hover:text-green-600 transition-all flex items-center justify-center gap-2"
                                    >
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                        </svg>
                                        Enable Notifications
                                    </button>
                                )}

                                {/* Status Display */}
                                <div className="flex items-center gap-2 mb-4 p-2 bg-gray-50 rounded-lg">
                                    <div className={`status-dot ${
                                        syncStatus === 'connected' ? 'status-connected' :
                                        syncStatus === 'syncing' ? 'status-syncing' :
                                        'status-disconnected'
                                    }`} />
                                    <span className="text-[10px] font-black uppercase text-gray-600 tracking-wider">
                                        {syncStatus === 'connected' ? 'Cloud Synced' :
                                        syncStatus === 'syncing' ? 'Syncing...' :
                                        'Offline'}
                                    </span>
                                </div>

                                <h3 className="text-xs font-black uppercase text-gray-400 mb-4">Folders</h3>
                                
                                <div className="space-y-2 mb-4 max-h-60 overflow-y-auto custom-scroll">
                                    {folders.map(folder => (
                                        <div key={folder.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-lg hover:bg-gray-100 group">
                                            <div className="flex items-center gap-2">
                                                <div className={`w-6 h-6 rounded-lg ${colorClasses[folder.color] || 'bg-gray-400'}`}></div>
                                                <span className="text-sm font-bold text-gray-700">{folder.name}</span>
                                            </div>
                                            <button
                                                onClick={() => handleDeleteFolder(folder.id)}
                                                className="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-all"
                                            >
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                </svg>
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                {showFolderInput ? (
                                    <div className="space-y-2 border-t pt-3">
                                        <input
                                            autoFocus
                                            placeholder="Folder name"
                                            value={newFolderName}
                                            onChange={(e) => setNewFolderName(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') handleAddFolder();
                                            }}
                                            className="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-500"
                                        />
                                        <div className="flex gap-2">
                                            {['blue', 'purple', 'pink', 'red', 'orange', 'green'].map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setNewFolderColor(color)}
                                                    className={`w-6 h-6 rounded-lg ${colorClasses[color]} ${
                                                        newFolderColor === color ? 'ring-2 ring-offset-1 ring-gray-900' : ''
                                                    }`}
                                                />
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={handleAddFolder}
                                                className="flex-1 bg-blue-600 text-white py-2 rounded-lg text-xs font-black uppercase"
                                            >
                                                Add
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setShowFolderInput(false);
                                                    setNewFolderName('');
                                                }}
                                                className="flex-1 bg-gray-200 text-gray-600 py-2 rounded-lg text-xs font-black uppercase"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <button
                                        onClick={() => setShowFolderInput(true)}
                                        className="w-full p-2 border-2 border-dashed border-gray-200 rounded-lg text-xs font-black uppercase text-gray-400 hover:border-blue-300 hover:text-blue-600 transition-all mb-3"
                                    >
                                        + New Folder
                                    </button>
                                )}

                                {/* Logout Button */}
                                <button
                                    onClick={() => {
                                        setMenuOpen(false);
                                        onSignOut();
                                    }}
                                    className="w-full p-2 border-2 border-gray-200 rounded-lg text-xs font-black uppercase text-gray-600 hover:border-red-300 hover:text-red-600 transition-all flex items-center justify-center gap-2"
                                >
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                        <polyline points="16 17 21 12 16 7"></polyline>
                                        <line x1="21" y1="12" x2="9" y2="12"></line>
                                    </svg>
                                    Sign Out
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Mobile Panel Switcher */}
                    <div className="lg:hidden mb-6 bg-white rounded-2xl shadow-sm border-2 border-gray-100 p-2 flex gap-2">
                        <button
                            onClick={() => setActivePanel('wins')}
                            className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${
                                activePanel === 'wins'
                                    ? 'bg-blue-500 text-white'
                                    : 'bg-gray-50 text-gray-400 hover:bg-gray-100'
                            }`}
                        >
                            Quick Wins
                        </button>
                        <button
                            onClick={() => setActivePanel('notes')}
                            className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${
                                activePanel === 'notes'
                                    ? 'bg-pink-500 text-white'
                                    : 'bg-gray-50 text-gray-400 hover:bg-gray-100'
                            }`}
                        >
                            Notes
                        </button>
                        <button
                            onClick={() => setActivePanel('calendar')}
                            className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${
                                activePanel === 'calendar'
                                    ? 'bg-purple-500 text-white'
                                    : 'bg-gray-50 text-gray-400 hover:bg-gray-100'
                            }`}
                        >
                            Calendar
                        </button>
                    </div>

                    <div className="max-w-[2000px] mx-auto grid lg:grid-cols-3 gap-6">
                        {/* Quick Wins */}
                        <div className={`bg-white border-2 border-gray-100 rounded-[40px] shadow-sm p-8 flex flex-col min-h-[800px] ${
                            activePanel === 'wins' ? 'block' : 'hidden lg:block'
                        }`}>
                            <h3 className="text-[10px] font-black text-blue-500 uppercase tracking-[.3em] mb-4">Quick Wins</h3>
                            <input 
                                type="text" 
                                placeholder="+ Add Win" 
                                value={newWinText} 
                                onChange={e => setNewWinText(e.target.value)} 
                                onKeyDown={e => { 
                                    if(e.key === 'Enter' && newWinText.trim()){ 
                                        handleAddWin(newWinText);
                                        setNewWinText(""); 
                                    }
                                }} 
                                className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 text-[10px] font-bold outline-none mb-6 shadow-sm focus:border-blue-200 transition-all" 
                            />
                            
                            <div className="flex-grow overflow-y-auto pr-2 custom-scroll space-y-3">
                                {filteredActiveWins.map(item => (
                                    <TaskItem 
                                        key={item.id} 
                                        item={item}
                                        editingId={editingNoteId}
                                        tempText={tempNoteText}
                                        tempDetails={tempNoteDetails}
                                        tempFolderId={tempFolderId}
                                        folders={folders}
                                        onStartEdit={handleWinStartEdit}
                                        onSaveEdit={handleWinSaveEdit}
                                        onCancelEdit={handleWinCancelEdit}
                                        onToggleComplete={handleWinToggle}
                                        onDelete={handleWinDelete}
                                        onFolderChange={setTempFolderId}
                                        execCommand={execCommand}
                                        editorRef={editorRef}
                                    />
                                ))}

                                {completedWins.length > 0 && (
                                    <div className="pt-6">
                                        <button 
                                            onClick={() => setShowCompleted(!showCompleted)} 
                                            className="flex items-center gap-2 mb-4 w-full"
                                        >
                                            <div className="h-[1px] flex-1 bg-gray-200"></div>
                                            <span className="text-[8px] font-black uppercase text-gray-400 tracking-tighter hover:text-blue-400 transition-colors px-2">
                                                Completed ({filteredCompletedWins.length})
                                            </span>
                                            <div className="h-[1px] flex-1 bg-gray-200"></div>
                                        </button>
                                        
                                        {showCompleted && (
                                            <div className="space-y-3 animate-pop">
                                                {filteredCompletedWins.map(item => (
                                                    <TaskItem 
                                                        key={item.id} 
                                                        item={item}
                                                        editingId={editingNoteId}
                                                        tempText={tempNoteText}
                                                        tempDetails={tempNoteDetails}
                                                        tempFolderId={tempFolderId}
                                                        folders={folders}
                                                        onStartEdit={handleWinStartEdit}
                                                        onSaveEdit={handleWinSaveEdit}
                                                        onCancelEdit={handleWinCancelEdit}
                                                        onToggleComplete={handleWinToggle}
                                                        onDelete={handleWinDelete}
                                                        onFolderChange={setTempFolderId}
                                                        execCommand={execCommand}
                                                        editorRef={editorRef}
                                                    />
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* QuickNotes */}
                        <div className={`bg-white border-2 border-gray-100 rounded-[40px] shadow-sm overflow-hidden min-h-[800px] ${
                            activePanel === 'notes' ? 'block' : 'hidden lg:block'
                        }`}>
                            <div className="p-10">
                                <h3 className="text-[10px] font-black text-pink-500 uppercase tracking-[.4em] mb-2">Workspace</h3>
                                <h2 className="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-8">QuickNotes</h2>
                                <input 
                                    type="text" 
                                    placeholder="New note..." 
                                    className="w-full bg-gray-50 border-2 border-gray-50 rounded-2xl p-6 text-lg font-bold outline-none focus:border-pink-100 mb-8" 
                                    onKeyDown={e => { 
                                        if(e.key === 'Enter' && e.target.value.trim()){ 
                                            handleAddNote(e.target.value);
                                            e.target.value=""; 
                                        }
                                    }} 
                                />
                                <div className="space-y-4">
                                    {filteredNotes.map(note => {
                                        const noteFolder = folders.find(f => f.id === note.folderId);

                                        return (
                                            <div key={note.id}>
                                                {editingNoteId === note.id ? (
                                                    <div className="bg-white p-6 rounded-[32px] border-2 border-blue-500 shadow-xl animate-pop space-y-4">
                                                        <input 
                                                            className="text-xl font-bold text-gray-900 outline-none w-full bg-gray-50 p-4 rounded-xl" 
                                                            value={tempNoteText} 
                                                            onChange={e => setTempNoteText(e.target.value)} 
                                                        />
                                                        <div className="flex flex-wrap items-center gap-1 p-2 bg-gray-50 rounded-xl border border-gray-100">
                                                            <button onClick={() => execCommand('bold')} className="p-1.5 hover:bg-gray-200 rounded font-bold w-8 text-xs">B</button>
                                                            <button onClick={() => execCommand('underline')} className="p-1.5 hover:bg-gray-200 rounded underline w-8 text-xs">U</button>
                                                            <button onClick={() => execCommand('insertUnorderedList')} className="p-1.5 hover:bg-gray-200 rounded text-xs">Bullets</button>
                                                        </div>
                                                        <div 
                                                            ref={editorRef} 
                                                            contentEditable 
                                                            className="rich-editor w-full bg-gray-50 p-4 rounded-xl text-sm font-medium outline-none overflow-y-auto" 
                                                            dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                                                        />
                                                        <div>
                                                            <label className="block text-[8px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                                                Folder
                                                            </label>
                                                            <select
                                                                value={tempFolderId}
                                                                onChange={(e) => setTempFolderId(e.target.value)}
                                                                className="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-100 outline-none"
                                                            >
                                                                <option value="">No Folder</option>
                                                                {folders.map(folder => (
                                                                    <option key={folder.id} value={folder.id}>{folder.name}</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button 
                                                                onClick={() => handleNoteSaveEdit(note.id, tempNoteText, editorRef.current.innerHTML, tempFolderId)} 
                                                                className="bg-gray-900 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
                                                            >
                                                                Save
                                                            </button>
                                                            <button 
                                                                onClick={handleWinCancelEdit} 
                                                                className="bg-gray-100 text-gray-400 px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
                                                            >
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div 
                                                        onClick={() => handleNoteStartEdit(note.id, note.text, note.details || "", note.folderId || "")} 
                                                        className="bg-gray-50/50 p-6 rounded-3xl hover:bg-white border border-transparent hover:border-gray-100 flex justify-between items-center cursor-pointer group transition-all"
                                                    >
                                                        <div className="min-w-0 flex-grow">
                                                            <span className="font-bold text-gray-700 block">{note.text}</span>
                                                            {noteFolder && (
                                                                <span className={`inline-block mt-1 px-2 py-0.5 rounded-full text-[7px] font-black uppercase text-white ${colorClasses[noteFolder.color] || 'bg-gray-400'}`}>
                                                                    {noteFolder.name}
                                                                </span>
                                                            )}
                                                            {note.details && (
                                                                <div 
                                                                    className="text-[10px] text-gray-400 mt-1 italic line-clamp-1 opacity-60" 
                                                                    dangerouslySetInnerHTML={{ __html: note.details }}
                                                                />
                                                            )}
                                                        </div>
                                                        <button 
                                                            onClick={e => { 
                                                                e.stopPropagation(); 
                                                                handleNoteDelete(note.id);
                                                            }} 
                                                            className="opacity-0 group-hover:opacity-100 p-2 text-gray-300 hover:text-red-500 transition-colors"
                                                        >
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* Calendar Panel */}
                        <div className={`bg-white border-2 border-gray-100 rounded-[40px] shadow-sm p-8 flex flex-col min-h-[800px] ${
                            activePanel === 'calendar' ? 'block' : 'hidden lg:block'
                        }`}>
                            <h3 className="text-[10px] font-black text-purple-500 uppercase tracking-[.3em] mb-4">Calendar</h3>
                            
                            {/* Month Navigation */}
                            <div className="flex items-center justify-between mb-6">
                                <button
                                    onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))}
                                    className="p-2 hover:bg-gray-50 rounded-lg transition-all"
                                >
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <polyline points="15 18 9 12 15 6"></polyline>
                                    </svg>
                                </button>
                                <h2 className="text-xl font-black text-gray-900">
                                    {currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                                </h2>
                                <button
                                    onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))}
                                    className="p-2 hover:bg-gray-50 rounded-lg transition-all"
                                >
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                            </div>

                            {/* Day Headers */}
                            <div className="grid grid-cols-7 gap-1 mb-2">
                                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                    <div key={day} className="text-center text-[8px] font-black uppercase text-gray-400 tracking-wider py-2">
                                        {day}
                                    </div>
                                ))}
                            </div>

                            {/* Calendar Grid */}
                            <div className="grid grid-cols-7 gap-1 flex-grow mb-6">
                                {renderCalendar()}
                            </div>

                            {/* Selected Date Events */}
                            {selectedDate && (
                                <div className="border-t pt-4">
                                    <h4 className="text-xs font-black uppercase text-gray-600 mb-3">
                                        {selectedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                                    </h4>
                                    
                                    <input
                                        type="text"
                                        placeholder="+ Add event"
                                        value={newEventText}
                                        onChange={(e) => setNewEventText(e.target.value)}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter' && newEventText.trim()) {
                                                handleAddEvent();
                                            }
                                        }}
                                        className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 text-[10px] font-bold outline-none mb-2 shadow-sm focus:border-purple-200 transition-all"
                                    />

                                    {/* Collapsible Folder Section */}
                                    <button
                                        onClick={() => setShowNewEventFolders(!showNewEventFolders)}
                                        className="w-full text-left text-[9px] font-black uppercase text-gray-400 hover:text-purple-500 transition-colors mb-2 flex items-center gap-1"
                                    >
                                        <svg 
                                            width="10" 
                                            height="10" 
                                            viewBox="0 0 24 24" 
                                            fill="none" 
                                            stroke="currentColor" 
                                            strokeWidth="2"
                                            className={`transition-transform ${showNewEventFolders ? 'rotate-90' : ''}`}
                                        >
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                        {newEventFolderId ? folders.find(f => f.id === newEventFolderId)?.name || 'Add to folder' : 'Add to folder'}
                                    </button>

                                    {showNewEventFolders && (
                                        <div className="mb-4 animate-pop">
                                            <div className="grid grid-cols-2 gap-2">
                                                <button
                                                    onClick={() => {
                                                        setNewEventFolderId('');
                                                        setShowNewEventFolders(false);
                                                    }}
                                                    className={`p-2 rounded-lg text-[9px] font-bold transition-all ${
                                                        !newEventFolderId 
                                                            ? 'bg-gray-900 text-white' 
                                                            : 'bg-gray-100 text-gray-400 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    No Folder
                                                </button>
                                                {folders.map(folder => (
                                                    <button
                                                        key={folder.id}
                                                        onClick={() => {
                                                            setNewEventFolderId(folder.id);

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Jefferson v4.3.5 - Dashboard & Rich QuickNotes</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; margin: 0; }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        /* Rich Text Styles */
        .rich-editor { min-height: 150px; outline: none; }
        .rich-editor ul { list-style-type: disc; padding-left: 1.5rem; }
        .rich-editor ol { list-style-type: decimal; padding-left: 1.5rem; }
        .rich-editor b { font-weight: bold; }
        .rich-editor u { text-decoration: underline; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatKey = (d) => {
            const dateObj = d instanceof Date ? d : new Date(d);
            return `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}/${dateObj.getFullYear()}`;
        };

        function InlineDatePicker({ value, onChange }) {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const ref = useRef(null);
            useEffect(() => {
                const clickOut = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", clickOut);
                return () => document.removeEventListener("mousedown", clickOut);
            }, []);
            const renderDays = () => {
                const year = viewDate.getFullYear(); const month = viewDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(<button key={i} type="button" onClick={() => { onChange(formatKey(new Date(year, month, i))); setIsOpen(false); }} className="text-[9px] p-1.5 hover:bg-gray-800 hover:text-white rounded-md font-bold">{i}</button>);
                }
                return days;
            };
            return (
                <div className="relative w-full" ref={ref}>
                    <button type="button" onClick={() => setIsOpen(!isOpen)} className="text-[9px] font-black px-2 py-1.5 rounded-lg uppercase tracking-wider w-full text-center bg-gray-100 text-gray-900 hover:bg-gray-200 transition-all">{value}</button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-2 bg-white border border-gray-100 shadow-2xl rounded-2xl p-3 z-[100] w-56 text-black animate-pop">
                            <div className="flex justify-between items-center mb-2">
                                <button type="button" onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} className="p-1 hover:bg-gray-100 rounded-lg">←</button>
                                <span className="text-[9px] font-black uppercase">{viewDate.toLocaleString('default', { month: 'short' })} {viewDate.getFullYear()}</span>
                                <button type="button" onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} className="p-1 hover:bg-gray-100 rounded-lg">→</button>
                            </div>
                            <div className="day-grid gap-1">{["S","M","T","W","T","F","S"].map(d => <div key={d} className="text-center text-[7px] font-black text-gray-300">{d}</div>)}{renderDays()}</div>
                        </div>
                    )}
                </div>
            );
        }

        function CalendarApp() {
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [navDate, setNavDate] = useState(new Date());
            const [reminders, setReminders] = useState(() => JSON.parse(localStorage.getItem('cal-rem')) || {});
            const [scratchNotes, setScratchNotes] = useState(() => JSON.parse(localStorage.getItem('cal-scratch')) || []);
            const [quickWins, setQuickWins] = useState(() => JSON.parse(localStorage.getItem('cal-wins')) || []);
            
            const [editingNoteId, setEditingNoteId] = useState(null); 
            const [schedulingNoteId, setSchedulingNoteId] = useState(null);
            const [tempNoteText, setTempNoteText] = useState("");
            const [tempNoteDetails, setTempNoteDetails] = useState("");
            const [newWinText, setNewWinText] = useState("");
            const [formData, setFormData] = useState({ text: "", details: "", startDate: formatKey(new Date()) });

            const editorRef = useRef(null);

            useEffect(() => { localStorage.setItem('cal-rem', JSON.stringify(reminders)); }, [reminders]);
            useEffect(() => { localStorage.setItem('cal-scratch', JSON.stringify(scratchNotes)); }, [scratchNotes]);
            useEffect(() => { localStorage.setItem('cal-wins', JSON.stringify(quickWins)); }, [quickWins]);

            const execCommand = (cmd, val = null) => {
                document.execCommand(cmd, false, val);
                editorRef.current.focus();
            };

            const saveNote = () => {
                const updated = scratchNotes.map(n => n.id === editingNoteId ? {...n, text: tempNoteText, details: editorRef.current.innerHTML} : n);
                setScratchNotes(updated);
                setEditingNoteId(null);
            };

            const saveEvent = (noteId = null) => {
                const event = { id: Date.now(), text: formData.text, notes: formData.details, startDate: formData.startDate };
                const updated = { ...reminders };
                const list = updated[formData.startDate] || [];
                list.push(event);
                updated[formData.startDate] = list;
                if (noteId) setScratchNotes(scratchNotes.filter(n => n.id !== noteId));
                setReminders(updated);
                setSchedulingNoteId(null);
            };

            const currentKey = formatKey(selectedDate);
            const dailyAgenda = reminders[currentKey] || [];

            return (
                <div className="max-w-[1600px] mx-auto grid lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-8 grid md:grid-cols-12 bg-white border-2 border-gray-100 rounded-[40px] shadow-sm overflow-hidden min-h-[800px]">
                        
                        {/* QUICK WINS */}
                        <div className="md:col-span-4 border-r border-gray-100 bg-gray-50/30 p-8 flex flex-col h-full">
                            <h3 className="text-[10px] font-black text-blue-500 uppercase tracking-[.3em] mb-4">Quick Wins</h3>
                            <input type="text" placeholder="+ Add Win" value={newWinText} onChange={e => setNewWinText(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && newWinText.trim()){ setQuickWins([{ id: Date.now(), text: newWinText, completed: false }, ...quickWins]); setNewWinText(""); }}} className="w-full bg-white border border-gray-100 rounded-xl p-3 text-[10px] font-bold outline-none mb-6 shadow-sm" />
                            <div className="flex-grow overflow-y-auto pr-2 custom-scroll space-y-3">
                                {quickWins.filter(w => !w.completed).map(item => (
                                    <div key={item.id} className="flex items-start gap-3 p-4 bg-white rounded-2xl border border-gray-100 shadow-sm">
                                        <input type="checkbox" checked={item.completed} onChange={() => setQuickWins(quickWins.map(w => w.id === item.id ? {...w, completed: !w.completed} : w))} className="w-4 h-4 accent-blue-500 mt-0.5" />
                                        <p className="text-[11px] font-black uppercase text-gray-900 leading-tight">{item.text}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* WORKSPACE */}
                        <div className="md:col-span-8 p-10">
                            <h3 className="text-[10px] font-black text-pink-500 uppercase tracking-[.4em] mb-2">Workspace</h3>
                            <h2 className="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-8">QuickNotes</h2>
                            <input type="text" placeholder="New note..." className="w-full bg-gray-50 border-2 border-gray-50 rounded-2xl p-6 text-lg font-bold outline-none focus:border-pink-100 mb-8" onKeyDown={e => { if(e.key === 'Enter' && e.target.value.trim()){ setScratchNotes([{text: e.target.value, details: "", id: Date.now()}, ...scratchNotes]); e.target.value=""; }}} />
                            
                            <div className="space-y-4">
                                {scratchNotes.map(note => (
                                    <div key={note.id}>
                                        {editingNoteId === note.id ? (
                                            <div className="bg-white p-6 rounded-[32px] border-2 border-blue-500 shadow-xl animate-pop space-y-4">
                                                <input className="text-xl font-bold text-gray-900 outline-none w-full bg-gray-50 p-4 rounded-xl" value={tempNoteText} onChange={e => setTempNoteText(e.target.value)} />
                                                
                                                {/* FORMATTING RIBBON */}
                                                <div className="flex flex-wrap items-center gap-1 p-2 bg-gray-50 rounded-xl border border-gray-100">
                                                    <select onChange={(e) => execCommand('fontSize', e.target.value)} className="text-[10px] font-bold bg-white border border-gray-200 rounded px-2 py-1 outline-none mr-2">
                                                        <option value="3">Size</option>
                                                        <option value="2">Small</option>
                                                        <option value="3">Normal</option>
                                                        <option value="5">Large</option>
                                                        <option value="7">XL</option>
                                                    </select>
                                                    <button onClick={() => execCommand('bold')} className="p-1.5 hover:bg-gray-200 rounded font-bold w-8 text-xs">B</button>
                                                    <button onClick={() => execCommand('underline')} className="p-1.5 hover:bg-gray-200 rounded underline w-8 text-xs">U</button>
                                                    <div className="w-[1px] h-4 bg-gray-300 mx-1"></div>
                                                    <button onClick={() => execCommand('insertUnorderedList')} className="p-1.5 hover:bg-gray-200 rounded text-xs">Bullets</button>
                                                    <button onClick={() => execCommand('insertOrderedList')} className="p-1.5 hover:bg-gray-200 rounded text-xs">Numbers</button>
                                                </div>

                                                <div 
                                                    ref={editorRef}
                                                    contentEditable 
                                                    className="rich-editor w-full bg-gray-50 p-4 rounded-xl text-sm font-medium border border-transparent focus:bg-white focus:border-blue-100 transition-all custom-scroll overflow-y-auto"
                                                    dangerouslySetInnerHTML={{ __html: tempNoteDetails }}
                                                />
                                                
                                                <div className="flex gap-2 pt-2">
                                                    <button onClick={saveNote} className="bg-gray-900 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Save</button>
                                                    <button onClick={() => setEditingNoteId(null)} className="bg-gray-100 text-gray-400 px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Cancel</button>
                                                </div>
                                            </div>
                                        ) : schedulingNoteId === note.id ? (
                                            <div className="bg-white p-8 rounded-[32px] shadow-2xl border-pink-500 border-2 animate-pop">
                                                <h3 className="text-xl font-bold mb-4">{note.text}</h3>
                                                <div className="flex items-center gap-4 border-t border-gray-100 pt-4">
                                                    <InlineDatePicker value={formData.startDate} onChange={v => setFormData({...formData, startDate: v})} />
                                                    <button onClick={() => saveEvent(note.id)} className="bg-gray-900 text-white px-6 py-3 rounded-xl text-[10px] font-black uppercase ml-auto">Confirm</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div onDoubleClick={() => { setSchedulingNoteId(null); setEditingNoteId(note.id); setTempNoteText(note.text); setTempNoteDetails(note.details || ""); }} className="bg-gray-50/50 p-6 rounded-3xl hover:bg-white border border-transparent hover:border-gray-100 flex justify-between items-center cursor-pointer transition-all group">
                                                <div>
                                                    <span className="font-bold text-gray-700 block">{note.text}</span>
                                                    {note.details && <div className="text-[10px] text-gray-400 mt-1 italic line-clamp-1 opacity-60" dangerouslySetInnerHTML={{ __html: note.details }}></div>}
                                                </div>
                                                <div className="flex gap-2 items-center opacity-0 group-hover:opacity-100 transition-all">
                                                    <button onClick={e => { e.stopPropagation(); setScratchNotes(scratchNotes.filter(n => n.id !== note.id)); }} className="p-2 text-gray-300 hover:text-red-500">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                    </button>
                                                    <button onClick={e => { e.stopPropagation(); setEditingNoteId(null); setSchedulingNoteId(note.id); setFormData({...formData, text: note.text, details: note.details || ""}); }} className="bg-pink-50 text-pink-600 px-4 py-2 rounded-xl text-[9px] font-black uppercase">Schedule</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* RIGHT SIDE CALENDAR */}
                    <div className="lg:col-span-4 flex flex-col gap-4">
                        <div className="bg-white rounded-[24px] border border-gray-100 shadow-sm p-4">
                            <div className="flex justify-between items-center mb-3">
                                <h4 className="text-[9px] font-black uppercase text-gray-400">{navDate.toLocaleString('default', { month: 'short', year: 'numeric' })}</h4>
                                <div className="flex gap-1">
                                    <button onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() - 1, 1))} className="p-1 text-gray-300">←</button>
                                    <button onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() + 1, 1))} className="p-1 text-gray-300">→</button>
                                </div>
                            </div>
                            <div className="day-grid gap-1">
                                {["S","M","T","W","T","F","S"].map(d => <div key={d} className="text-center text-[7px] font-black text-gray-200 mb-1">{d}</div>)}
                                {(() => {
                                    const year = navDate.getFullYear(); const month = navDate.getMonth(); const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate(); const days = [];
                                    for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                                    for (let i = 1; i <= daysInMonth; i++) {
                                        const d = new Date(year, month, i); const k = formatKey(d);
                                        days.push(<button key={i} onClick={() => setSelectedDate(d)} className={`aspect-square text-[9px] font-bold rounded-md flex flex-col items-center justify-center ${formatKey(selectedDate) === k ? 'bg-gray-900 text-white' : 'hover:bg-gray-50 text-gray-500'}`}>{i}{reminders[k] && <div className="w-1 h-1 rounded-full bg-pink-500 mt-0.5" />}</button>);
                                    }
                                    return days;
                                })()}
                            </div>
                        </div>
                        <div className="bg-white rounded-[24px] border border-gray-100 shadow-sm flex-grow flex flex-col overflow-hidden min-h-[400px]">
                            <div className="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                                <h3 className="text-[9px] font-black text-gray-400 uppercase tracking-widest">Daily Agenda</h3>
                                <span className="text-[8px] font-black text-gray-400">{currentKey}</span>
                            </div>
                            <div className="p-4 space-y-2 flex-grow overflow-y-auto custom-scroll">
                                {dailyAgenda.length === 0 && <p className="text-[9px] text-gray-300 text-center italic py-10 uppercase tracking-widest">Free Day</p>}
                                {dailyAgenda.map(r => (
                                    <div key={r.id} className="p-3 rounded-xl border-l-4 bg-pink-50/50 border-pink-500">
                                        <p className="text-[10px] font-black text-gray-800 uppercase mb-1">{r.text}</p>
                                        <div className="text-[9px] text-gray-400 italic" dangerouslySetInnerHTML={{ __html: r.notes }}></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CalendarApp />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Jefferson v4.3.9 - Rebuilt Elite</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; height: 100vh; overflow: hidden; }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .rich-editor { min-height: 100px; outline: none; }
        .rich-editor ul { list-style-type: disc; padding-left: 1.5rem; }
    </style>
</head>
<body class="p-4">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatKey = (d) => {
            const dateObj = d instanceof Date ? d : new Date(d);
            return `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}/${dateObj.getFullYear()}`;
        };

        const toDateTimeLocal = (date) => {
            const offset = date.getTimezoneOffset();
            const adjustedDate = new Date(date.getTime() - (offset * 60 * 1000));
            return adjustedDate.toISOString().slice(0, 16);
        };

        function CalendarApp() {
            // --- DATA PERSISTENCE ---
            const [reminders, setReminders] = useState(() => JSON.parse(localStorage.getItem('jeff-rem')) || {});
            const [scratchNotes, setScratchNotes] = useState(() => JSON.parse(localStorage.getItem('jeff-scratch')) || []);
            const [quickWins, setQuickWins] = useState(() => JSON.parse(localStorage.getItem('jeff-wins')) || []);
            
            // --- UI STATE ---
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [navDate, setNavDate] = useState(new Date());
            const [isCreatingEvent, setIsCreatingEvent] = useState(false);
            const [editingId, setEditingId] = useState(null);
            
            // --- FORM STATE ---
            const [tempTitle, setTempTitle] = useState("");
            const [tempNotes, setTempNotes] = useState("");
            const [startTime, setStartTime] = useState("");
            const [endTime, setEndTime] = useState("");
            const [newWinText, setNewWinText] = useState("");

            const editorRef = useRef(null);

            useEffect(() => { localStorage.setItem('jeff-rem', JSON.stringify(reminders)); }, [reminders]);
            useEffect(() => { localStorage.setItem('jeff-scratch', JSON.stringify(scratchNotes)); }, [scratchNotes]);
            useEffect(() => { localStorage.setItem('jeff-wins', JSON.stringify(quickWins)); }, [quickWins]);

            const execCommand = (cmd) => { document.execCommand(cmd, false, null); if (editorRef.current) editorRef.current.focus(); };

            // --- CALENDAR LOGIC ---
            const handleDayDoubleClick = (date) => {
                const start = new Date(date);
                start.setHours(new Date().getHours(), 0, 0, 0);
                const end = new Date(start);
                end.setHours(start.getHours() + 1);

                setSelectedDate(date);
                setStartTime(toDateTimeLocal(start));
                setEndTime(toDateTimeLocal(end));
                setTempTitle("");
                setTempNotes("");
                setIsCreatingEvent(true);
            };

            const saveCalendarEvent = () => {
                if (!tempTitle) return;
                const dateKey = formatKey(new Date(startTime));
                const newEntry = {
                    id: Date.now(),
                    text: tempTitle,
                    notes: tempNotes,
                    start: startTime,
                    end: endTime,
                    type: 'note'
                };
                const updated = { ...reminders };
                updated[dateKey] = [...(updated[dateKey] || []), newEntry];
                updated[dateKey].sort((a, b) => new Date(a.start) - new Date(b.start));
                setReminders(updated);
                setIsCreatingEvent(false);
            };

            const currentKey = formatKey(selectedDate);
            const dailyAgenda = reminders[currentKey] || [];

            return (
                <div class="grid grid-cols-12 gap-6 h-[95vh]">
                    
                    {/* LEFT PANEL: QUICK WINS */}
                   <div className="col-span-12 lg:col-span-3 bg-white rounded-[32px] border border-gray-100 shadow-sm flex flex-col overflow-hidden">
    <div className="p-6 border-b border-gray-50 bg-gray-50/50">
        <h3 className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4">Quick Wins</h3>
        <input 
            value={newWinText}
            onChange={e => setNewWinText(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && newWinText.trim() && (setQuickWins([{id: Date.now(), text: newWinText, done: false, details: ""}, ...quickWins]), setNewWinText(""))}
            placeholder="+ Rapid Task"
            className="w-full bg-white border border-gray-100 rounded-xl p-3 text-xs font-bold outline-none focus:ring-2 ring-blue-100 transition-all"
        />
    </div>
    <div className="flex-grow overflow-y-auto p-4 space-y-2 custom-scroll">
        {quickWins.map(win => (
            <div 
                key={win.id} 
                onDoubleClick={() => { setEditingWinId(win.id); setTempDetails(win.details || ""); }}
                className={`flex flex-col gap-2 p-3 rounded-xl group transition-all cursor-pointer ${editingWinId === win.id ? 'bg-blue-50 ring-1 ring-blue-200' : 'bg-gray-50'}`}
            >
                <div className="flex items-center gap-3">
                    <input type="checkbox" checked={win.done} onChange={() => setQuickWins(quickWins.map(w => w.id === win.id ? {...w, done: !w.done} : w))} className="rounded-full text-blue-500" />
                    <span className={`text-[11px] font-bold text-gray-600 flex-grow ${win.done ? 'line-through opacity-40' : ''}`}>{win.text}</span>
                    <button onClick={() => setQuickWins(quickWins.filter(w => w.id !== win.id))} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">×</button>
                </div>
                {editingWinId === win.id ? (
                    <div className="mt-2 space-y-2 animate-pop">
                        <textarea autoFocus value={tempDetails} onChange={e => setTempDetails(e.target.value)} placeholder="Add notes..." className="w-full text-[10px] p-2 rounded-lg border border-blue-100 outline-none resize-none h-16" />
                        <button onClick={() => { setQuickWins(quickWins.map(w => w.id === win.id ? { ...w, details: tempDetails } : w)); setEditingWinId(null); }} className="bg-blue-500 text-white text-[8px] font-black uppercase px-3 py-1 rounded-md">Save Note</button>
                    </div>
                ) : (
                    win.details && <p className="text-[9px] text-gray-400 italic ml-7 truncate">{win.details}</p>
                )}
            </div>
        ))}
    </div>
</div>

                    {/* CENTER PANEL: QUICKNOTES (GREEN) */}
                    <div class="col-span-12 lg:col-span-6 bg-white rounded-[40px] border border-gray-100 shadow-sm flex flex-col overflow-hidden">
                        <div class="p-8 pb-4">
                            <h3 class="text-[10px] font-black text-green-600 uppercase tracking-[.4em] mb-2">Workspace</h3>
                            <h2 class="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-6">QuickNotes</h2>
                            <input 
                                onKeyDown={e => e.key === 'Enter' && e.target.value.trim() && (setScratchNotes([{id: Date.now(), text: e.target.value, details: ""}, ...scratchNotes]), e.target.value = "")}
                                placeholder="New workspace entry..."
                                class="w-full bg-green-50 border-2 border-green-50 rounded-2xl p-5 text-lg font-bold outline-none focus:border-green-200 transition-all text-green-900 placeholder-green-300"
                            />
                        </div>
                        
                        <div class="flex-grow overflow-y-auto p-8 pt-2 space-y-4 custom-scroll">
                            {scratchNotes.map(note => (
                                <div key={note.id} class="bg-gray-50/50 rounded-3xl p-6 border border-transparent hover:border-green-100 transition-all group">
                                    <div class="flex justify-between items-start mb-2">
                                        <p class="text-lg font-bold text-gray-800">{note.text}</p>
                                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                            <button onClick={() => setScratchNotes(scratchNotes.filter(n => n.id !== note.id))} class="text-gray-300 hover:text-red-500">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onClick={() => {
                                            const key = formatKey(new Date());
                                            const updated = {...reminders};
                                            updated[key] = [...(updated[key] || []), {id: Date.now(), text: note.text, notes: note.details, start: toDateTimeLocal(new Date()), end: toDateTimeLocal(new Date()), type: 'note'}];
                                            setReminders(updated);
                                            setScratchNotes(scratchNotes.filter(n => n.id !== note.id));
                                        }} class="bg-green-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-green-100">Schedule</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* RIGHT PANEL: CALENDAR & AGENDA */}
                    <div class="col-span-12 lg:col-span-3 flex flex-col gap-6 overflow-hidden">
                        
                        {/* CALENDAR MODULE */}
                        <div class="bg-white rounded-[32px] border border-gray-100 shadow-sm p-5 relative overflow-hidden">
                            <div class="flex justify-between items-center mb-4">
                                <h4 class="text-[10px] font-black uppercase text-gray-400">{navDate.toLocaleString('default', { month: 'short', year: 'numeric' })}</h4>
                                <div class="flex gap-1">
                                    <button onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() - 1, 1))} class="p-1 text-gray-300 hover:text-gray-600">â†</button>
                                    <button onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() + 1, 1))} class="p-1 text-gray-300 hover:text-gray-600">â†’</button>
                                </div>
                            </div>
                            <div class="day-grid gap-1">
                                {["S","M","T","W","T","F","S"].map(d => <div key={d} class="text-center text-[8px] font-black text-gray-200 mb-2">{d}</div>)}
                                {(() => {
                                    const year = navDate.getFullYear(), month = navDate.getMonth();
                                    const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
                                    const days = [];
                                    for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                                    for (let i = 1; i <= daysInMonth; i++) {
                                        const d = new Date(year, month, i), k = formatKey(d);
                                        const isActive = formatKey(selectedDate) === k;
                                        const hasItems = reminders[k]?.length > 0;
                                        days.push(
                                            <button 
                                                key={i}
                                                onClick={() => setSelectedDate(d)}
                                                onDoubleClick={() => handleDayDoubleClick(d)}
                                                class={`aspect-square text-[10px] font-bold rounded-lg flex flex-col items-center justify-center transition-all ${isActive ? 'bg-gray-900 text-white' : 'hover:bg-gray-50 text-gray-500'}`}
                                            >
                                                {i}
                                                {hasItems && <div class={`w-1 h-1 rounded-full mt-0.5 ${isActive ? 'bg-green-400' : 'bg-green-500'}`} />}
                                            </button>
                                        );
                                    }
                                    return days;
                                })()}
                            </div>

                            {/* DOUBLE-CLICK EVENT MODAL */}
                            {isCreatingEvent && (
                                <div class="absolute inset-0 bg-white/98 z-50 p-5 flex flex-col animate-pop border-2 border-green-500 rounded-[32px]">
                                    <div class="flex justify-between items-center mb-4">
                                        <h3 class="text-[10px] font-black text-green-600 uppercase tracking-widest">New Timed Event</h3>
                                        <button onClick={() => setIsCreatingEvent(false)} class="text-gray-400 hover:text-black text-xl">Ã—</button>
                                    </div>
                                    <div class="space-y-4 flex-grow overflow-y-auto pr-1 custom-scroll">
                                        <input autoFocus placeholder="Event Title" value={tempTitle} onChange={e => setTempTitle(e.target.value)} class="w-full text-sm font-bold p-3 bg-gray-50 rounded-xl outline-none border border-transparent focus:border-green-200" />
                                        
                                        <div class="space-y-3">
                                            <div class="grid grid-cols-1">
                                                <label class="text-[8px] font-black text-gray-400 uppercase ml-1 mb-1">Start Day & Time</label>
                                                <input type="datetime-local" value={startTime} onChange={e => setStartTime(e.target.value)} class="w-full text-[10px] p-2 bg-gray-50 rounded-lg outline-none" />
                                            </div>
                                            <div class="grid grid-cols-1">
                                                <label class="text-[8px] font-black text-gray-400 uppercase ml-1 mb-1">End Day & Time</label>
                                                <input type="datetime-local" value={endTime} onChange={e => setEndTime(e.target.value)} class="w-full text-[10px] p-2 bg-gray-50 rounded-lg outline-none" />
                                            </div>
                                        </div>

                                        <textarea placeholder="Notes..." value={tempNotes} onChange={e => setTempNotes(e.target.value)} class="w-full text-[10px] p-3 bg-gray-50 rounded-xl outline-none min-h-[60px] resize-none" />
                                    </div>
                                    <button onClick={saveCalendarEvent} class="w-full bg-gray-900 text-white text-[10px] font-black uppercase py-4 rounded-2xl mt-4 hover:bg-green-600 transition-colors">Confirm Schedule</button>
                                </div>
                            )}
                        </div>

                        {/* AGENDA MODULE */}
                        <div class="bg-white rounded-[32px] border border-gray-100 shadow-sm flex-grow flex flex-col overflow-hidden">
                            <div class="p-5 border-b border-gray-50 bg-gray-50/50 flex justify-between items-center">
                                <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Daily Agenda</h3>
                                <span class="text-[9px] font-bold text-gray-400">{currentKey}</span>
                            </div>
                            <div class="flex-grow overflow-y-auto p-4 space-y-3 custom-scroll">
                                {dailyAgenda.length === 0 ? (
                                    <div class="h-full flex flex-col items-center justify-center opacity-20">
                                        <p class="text-[9px] font-black uppercase tracking-widest italic text-center">No Events Scheduled</p>
                                    </div>
                                ) : (
                                    dailyAgenda.map(event => (
                                        <div key={event.id} class="p-4 rounded-2xl bg-gray-50 border border-transparent hover:border-green-100 transition-all group">
                                            <div class="flex justify-between items-start mb-2">
                                                <p class="text-[11px] font-black uppercase text-gray-800 leading-tight">{event.text}</p>
                                                <button onClick={() => {
                                                    const updated = {...reminders};
                                                    updated[currentKey] = updated[currentKey].filter(e => e.id !== event.id);
                                                    setReminders(updated);
                                                }} class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100">Ã—</button>
                                            </div>
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-[8px] font-black text-green-600 uppercase">From</span>
                                                    <span class="text-[9px] font-bold text-gray-500">{new Date(event.start).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
                                                </div>
                                                <div class="flex items-center gap-2">
                                                    <span class="text-[8px] font-black text-gray-400 uppercase">To</span>
                                                    <span class="text-[9px] font-bold text-gray-500">{new Date(event.end).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CalendarApp />);
    </script>
</body>
</html>

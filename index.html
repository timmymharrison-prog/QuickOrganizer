                                                                    className="p-1.5 text-gray-400 hover:text-red-500 transition-all"
                                                                    title="Delete folder"
                                                                >
                                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                                    </svg>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                        
                                        {folders.length === 0 && !showFolderInput && (
                                            <p className="text-xs text-gray-400 text-center py-6 italic">No folders yet</p>
                                        )}
                                    </div>
                                </div>

                                {/* Sign Out Button */}
                                <div className="p-4 border-t border-gray-100">
                                    <button
                                        onClick={() => {
                                            setMenuOpen(false);
                                            onSignOut();
                                        }}
                                        className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-gray-900 text-white rounded-xl font-black uppercase text-xs tracking-wider hover:bg-gray-800 transition-all"
                                    >
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                            <polyline points="16 17 21 12 16 7"></polyline>
                                            <line x1="21" y1="12" x2="9" y2="12"></line>
                                        </svg>
                                        Sign Out
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Search Modal */}
                    {showSearch && (
                        <div className="fixed inset-0 bg-black/50 flex items-start justify-center z-[2000] p-4 pt-20">
                            <div className="bg-white rounded-[40px] shadow-2xl max-w-3xl w-full max-h-[80vh] overflow-hidden flex flex-col animate-pop">
                                {/* Search Header */}
                                <div className="p-6 border-b border-gray-100">
                                    <div className="flex items-center gap-3">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-gray-400">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <path d="m21 21-4.35-4.35"></path>
                                        </svg>
                                        <input
                                            type="text"
                                            placeholder="Search notes and tasks..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            autoFocus
                                            className="flex-grow text-xl font-bold outline-none"
                                        />
                                        <button
                                            onClick={() => {
                                                setShowSearch(false);
                                                setSearchQuery('');
                                            }}
                                            className="p-2 hover:bg-gray-100 rounded-xl transition-all"
                                        >
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                {/* Search Results */}
                                <div className="flex-grow overflow-y-auto p-6 space-y-3 custom-scroll">
                                    {searchQuery.trim() === '' ? (
                                        <div className="text-center py-20">
                                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="mx-auto text-gray-300 mb-4">
                                                <circle cx="11" cy="11" r="8"></circle>
                                                <path d="m21 21-4.35-4.35"></path>
                                            </svg>
                                            <p className="text-gray-400 text-sm">Type to search notes and tasks</p>
                                        </div>
                                    ) : searchResults.length === 0 ? (
                                        <div className="text-center py-20">
                                            <p className="text-gray-400 text-sm">No results found for "{searchQuery}"</p>
                                        </div>
                                    ) : (
                                        <>
                                            <p className="text-xs font-black uppercase tracking-wider text-gray-400 mb-4">
                                                {searchResults.length} result{searchResults.length === 1 ? '' : 's'}
                                            </p>
                                            {searchResults.map(item => {
                                                const folder = item.folderId ? folders.find(f => f.id === item.folderId) : null;
                                                const isScheduled = Object.values(reminders).some(dayEvents => 
                                                    dayEvents.some(event => event.linkedNoteId === item.id)
                                                );
                                                
                                                return (
                                                    <div
                                                        key={item.id}
                                                        onClick={() => {
                                                            setShowSearch(false);
                                                            setSearchQuery('');
                                                            if (item.type === 'note') {
                                                                handleNoteStartEdit(item.id, item.text, item.details || "");
                                                            } else {
                                                                handleWinStartEdit(item.id, item.text, item.details || "");
                                                            }
                                                        }}
                                                        className="p-4 bg-gray-50 rounded-2xl hover:bg-gray-100 cursor-pointer transition-all group no-select"
                                                    >
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div className="flex-grow min-w-0">
                                                                <div className="flex items-center gap-2 mb-1">
                                                                    <div className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 ${
                                                                        item.type === 'win' ? 'bg-blue-100' : 'bg-pink-100'
                                                                    }`}>
                                                                        {item.type === 'win' ? (
                                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-blue-600">
                                                                                <polyline points="9 11 12 14 22 4"></polyline>
                                                                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                                                                            </svg>
                                                                        ) : (
                                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-pink-600">
                                                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                                                <polyline points="14 2 14 8 20 8"></polyline>
                                                                            </svg>
                                                                        )}
                                                                    </div>
                                                                    <span className="font-bold text-gray-900">{item.text}</span>
                                                                </div>
                                                                {item.details && (
                                                                    <div 
                                                                        className="text-xs text-gray-500 line-clamp-2 ml-8" 
                                                                        dangerouslySetInnerHTML={{ __html: item.details }}
                                                                    />
                                                                )}
                                                                <div className="flex items-center gap-2 mt-2 ml-8">
                                                                    {folder && (
                                                                        <span className="text-[10px] px-2 py-0.5 bg-gray-200 text-gray-600 rounded-full font-bold">
                                                                            ðŸ“ {folder.name}
                                                                        </span>
                                                                    )}
                                                                    {isScheduled && (
                                                                        <span className="text-[10px] px-2 py-0.5 bg-pink-100 text-pink-600 rounded-full font-bold">
                                                                            ðŸ“… Scheduled
                                                                        </span>
                                                                    )}
                                                                    {item.completed && (
                                                                        <span className="text-[10px] px-2 py-0.5 bg-green-100 text-green-600 rounded-full font-bold">
                                                                            âœ“ Complete
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Folder View Modal */}
                    {selectedFolder && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[2000] p-4">
                            <div className="bg-white rounded-[40px] shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col animate-pop">
                                {/* Header */}
                                <div className={`p-6 border-b border-gray-100 ${
                                    selectedFolder.type === 'blue' ? 'bg-blue-50' :
                                    selectedFolder.type === 'purple' ? 'bg-purple-50' :
                                    selectedFolder.type === 'pink' ? 'bg-pink-50' :
                                    selectedFolder.type === 'red' ? 'bg-red-50' :
                                    selectedFolder.type === 'orange' ? 'bg-orange-50' :
                                    selectedFolder.type === 'green' ? 'bg-green-50' :
                                    'bg-gray-50'
                                }`}>
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-3 flex-grow">
                                            {editingFolderId === selectedFolder.id ? (
                                                // Edit Mode in Modal
                                                <div className="flex items-center gap-3 flex-grow">
                                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${
                                                        editFolderColor === 'blue' ? 'bg-blue-500' :
                                                        editFolderColor === 'purple' ? 'bg-purple-500' :
                                                        editFolderColor === 'pink' ? 'bg-pink-500' :
                                                        editFolderColor === 'red' ? 'bg-red-500' :
                                                        editFolderColor === 'orange' ? 'bg-orange-500' :
                                                        editFolderColor === 'green' ? 'bg-green-500' :
                                                        'bg-gray-500'
                                                    }`}>
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                                        </svg>
                                                    </div>
                                                    <div className="flex-grow space-y-2">
                                                        <input
                                                            type="text"
                                                            value={editFolderName}
                                                            onChange={(e) => setEditFolderName(e.target.value)}
                                                            className="w-full px-3 py-2 text-lg font-bold border-2 border-gray-300 rounded-xl outline-none focus:border-blue-500"
                                                            autoFocus
                                                        />
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-black uppercase text-gray-500">Color:</span>
                                                            {['blue', 'purple', 'pink', 'red', 'orange', 'green'].map(color => (
                                                                <button
                                                                    key={color}
                                                                    onClick={() => setEditFolderColor(color)}
                                                                    className={`w-6 h-6 rounded-lg transition-all ${
                                                                        editFolderColor === color ? 'ring-2 ring-offset-2 ring-gray-900' : ''
                                                                    } ${
                                                                        color === 'blue' ? 'bg-blue-500' :
                                                                        color === 'purple' ? 'bg-purple-500' :
                                                                        color === 'pink' ? 'bg-pink-500' :
                                                                        color === 'red' ? 'bg-red-500' :
                                                                        color === 'orange' ? 'bg-orange-500' :
                                                                        'bg-green-500'
                                                                    }`}
                                                                />
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                // View Mode
                                                <>
                                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${
                                                        selectedFolder.type === 'blue' ? 'bg-blue-500' :
                                                        selectedFolder.type === 'purple' ? 'bg-purple-500' :
                                                        selectedFolder.type === 'pink' ? 'bg-pink-500' :
                                                        selectedFolder.type === 'red' ? 'bg-red-500' :
                                                        selectedFolder.type === 'orange' ? 'bg-orange-500' :
                                                        selectedFolder.type === 'green' ? 'bg-green-500' :
                                                        'bg-gray-500'
                                                    }`}>
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                                        </svg>
                                                    </div>
                                                    <div>
                                                        <h2 className="text-2xl font-black text-gray-900">{selectedFolder.name}</h2>
                                                        <p className="text-sm text-gray-500 uppercase font-bold">{folderNotes.length} items</p>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                        <div className="flex gap-2">
                                            {editingFolderId === selectedFolder.id ? (
                                                // Edit mode buttons
                                                <>
                                                    <button
                                                        onClick={handleSaveEditFolder}
                                                        className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-black uppercase hover:bg-blue-700 transition-all"
                                                    >
                                                        Save
                                                    </button>
                                                    <button
                                                        onClick={handleCancelEditFolder}
                                                        className="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl text-sm font-black uppercase hover:bg-gray-300 transition-all"
                                                    >
                                                        Cancel
                                                    </button>
                                                </>
                                            ) : (
                                                // View mode buttons
                                                <>
                                                    <button
                                                        onClick={() => handleStartEditFolder(selectedFolder)}
                                                        className="p-2 hover:bg-white/50 rounded-xl transition-all"
                                                        title="Edit folder"
                                                    >
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                        </svg>
                                                    </button>
                                                    <button
                                                        onClick={handleCloseFolder}
                                                        className="p-2 hover:bg-white/50 rounded-xl transition-all"
                                                        title="Close"
                                                    >
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                                        </svg>
                                                    </button>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Notes List */}
                                <div className="flex-grow overflow-y-auto p-6 space-y-4 custom-scroll">
                                    {folderNotes.length === 0 ? (
                                        <div className="text-center py-20">
                                            <p className="text-gray-400 text-sm italic">No items in this folder yet</p>
                                            <p className="text-gray-400 text-xs mt-2">Double-click notes or tasks and assign them to this folder</p>
                                        </div>
                                    ) : (
                                        folderNotes.map(item => {
                                            const isScheduled = Object.values(reminders).some(dayEvents => 
                                                dayEvents.some(event => event.linkedNoteId === item.id)
                                            );
                                            const scheduledDates = Object.entries(reminders)
                                                .filter(([date, events]) => events.some(e => e.linkedNoteId === item.id))
                                                .map(([date]) => date);
                                            
                                            return (
                                                <div
                                                    key={item.id}
                                                    className="bg-gray-50 p-6 rounded-3xl hover:bg-white border border-transparent hover:border-gray-200 group transition-all no-select relative"
                                                >
                                                    <div className="flex items-start gap-3">
                                                        {/* Checkbox for tasks */}
                                                        {item.type === 'win' && (
                                                            <input 
                                                                type="checkbox" 
                                                                checked={item.completed || false}
                                                                onChange={(e) => {
                                                                    e.stopPropagation();
                                                                    handleWinToggle(item.id);
                                                                }}
                                                                className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer shrink-0 mt-1"
                                                            />
                                                        )}
                                                        
                                                        <div className="flex-grow min-w-0">
                                                            <div 
                                                                onDoubleClick={() => {
                                                                    handleCloseFolder();
                                                                    if (item.type === 'note') {
                                                                        handleNoteStartEdit(item.id, item.text, item.details || "");
                                                                    } else {
                                                                        handleWinStartEdit(item.id, item.text, item.details || "");
                                                                    }
                                                                }}
                                                                className="cursor-pointer"
                                                            >
                                                                <div className="flex items-center gap-2 mb-2">
                                                                    <div className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 ${
                                                                        item.type === 'win' ? 'bg-blue-100' : 'bg-pink-100'
                                                                    }`}>
                                                                        {item.type === 'win' ? (
                                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-blue-600">
                                                                                <polyline points="9 11 12 14 22 4"></polyline>
                                                                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                                                                            </svg>
                                                                        ) : (
                                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-pink-600">
                                                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                                                <polyline points="14 2 14 8 20 8"></polyline>
                                                                            </svg>
                                                                        )}
                                                                    </div>
                                                                    <span className={`font-bold text-gray-900 text-lg ${item.completed ? 'line-through opacity-60' : ''}`}>{item.text}</span>
                                                                    {isScheduled && (
                                                                        <div className="flex items-center gap-1 bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider">
                                                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                                                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                                                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                                                                <line x1="3" y1="10" x2="21" y2="10"></line>
                                                                            </svg>
                                                                            <span>{scheduledDates.length}</span>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                                {item.details && (
                                                                    <div 
                                                                        className="text-sm text-gray-600 line-clamp-2 ml-8" 
                                                                        dangerouslySetInnerHTML={{ __html: item.details }}
                                                                    />
                                                                )}
                                                                <p className="text-xs text-gray-400 mt-3 opacity-0 group-hover:opacity-100 transition-opacity ml-8">
                                                                    Double-click to edit
                                                                </p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-[1600px] mx-auto grid lg:grid-cols-12 gap-6">
                        {/* QuickTasks - Standalone Panel */}
                        <div className="order-2 lg:order-1 lg:col-span-3 bg-white border-2 border-gray-100 rounded-[40px] shadow-sm p-8 flex flex-col min-h-[800px]">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-[10px] font-black text-blue-500 uppercase tracking-[.3em]">QuickTasks</h3>
                                <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
                                    <button
                                        onClick={() => setWinFilter('all')}
                                        className={`px-2 py-1 text-[8px] font-black uppercase rounded transition-all ${
                                            winFilter === 'all' ? 'bg-blue-500 text-white' : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                        title="All"
                                    >
                                        All
                                    </button>
                                    <button
                                        onClick={() => setWinFilter('priority')}
                                        className={`px-2 py-1 text-[8px] font-black uppercase rounded transition-all ${
                                            winFilter === 'priority' ? 'bg-blue-500 text-white' : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                        title="Sort by Priority"
                                    >
                                        Priority
                                    </button>
                                    <button
                                        onClick={() => setWinFilter('date')}
                                        className={`px-2 py-1 text-[8px] font-black uppercase rounded transition-all ${
                                            winFilter === 'date' ? 'bg-blue-500 text-white' : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                        title="Sort by Date"
                                    >
                                        Date
                                    </button>
                                    <button
                                        onClick={() => setWinFilter('folder')}
                                        className={`px-2 py-1 text-[8px] font-black uppercase rounded transition-all ${
                                            winFilter === 'folder' ? 'bg-blue-500 text-white' : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                        title="Sort by Folder"
                                    >
                                        Folder
                                    </button>
                                </div>
                            </div>
                            <input 
                                type="text" 
                                placeholder="+ Add Win" 
                                value={newWinText} 
                                onChange={e => setNewWinText(e.target.value)} 
                                onKeyDown={e => { 
                                    if(e.key === 'Enter' && newWinText.trim()){ 
                                        handleAddWin(newWinText);
                                        setNewWinText(""); 
                                    }
                                }} 
                                className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 text-[10px] font-bold outline-none mb-6 shadow-sm focus:border-blue-200 transition-all" 
                            />
                            
                            <div className="flex-grow overflow-y-auto pr-2 custom-scroll space-y-3">
                                {winFilter === 'folder' && groupedByFolder ? (
                                    // Grouped by folder view
                                    groupedByFolder.map(group => (
                                        <div key={group.folder.id} className="space-y-3">
                                            <h4 className="text-[9px] font-black uppercase tracking-wider text-gray-400 px-2 pt-2">
                                                {group.folder.name}
                                            </h4>
                                            {group.wins.map(item => (
                                                <WinItem 
                                                    key={item.id} 
                                                    item={item}
                                                    editingNoteId={editingNoteId}
                                                    schedulingNoteId={schedulingNoteId}
                                                    tempNoteText={tempNoteText}
                                                    tempNoteDetails={tempNoteDetails}
                                                    onStartEdit={handleWinStartEdit}
                                                    onStartSchedule={handleWinStartSchedule}
                                                    onSaveEdit={handleWinSaveEdit}
                                                    onCancelEdit={handleWinCancelEdit}
                                                    onToggleComplete={handleWinToggle}
                                                    onDelete={handleWinDelete}
                                                    onScheduleConfirm={handleWinScheduleConfirm}
                                                    formData={formData}
                                                    setFormData={setFormData}
                                                    execCommand={execCommand}
                                                    editorRef={editorRef}
                                                    folders={folders}
                                                    reminders={reminders}
                                                />
                                            ))}
                                        </div>
                                    ))
                                ) : (
                                    // Normal list view
                                    activeWins.map(item => (
                                        <WinItem 
                                            key={item.id} 
                                            item={item}
                                            editingNoteId={editingNoteId}
                                            schedulingNoteId={schedulingNoteId}
                                            tempNoteText={tempNoteText}
                                            tempNoteDetails={tempNoteDetails}
                                            onStartEdit={handleWinStartEdit}
                                            onStartSchedule={handleWinStartSchedule}
                                            onSaveEdit={handleWinSaveEdit}
                                            onCancelEdit={handleWinCancelEdit}
                                            onToggleComplete={handleWinToggle}
                                            onDelete={handleWinDelete}
                                            onScheduleConfirm={handleWinScheduleConfirm}
                                            formData={formData}
                                            setFormData={setFormData}
                                            execCommand={execCommand}
                                            editorRef={editorRef}
                                            folders={folders}
                                            reminders={reminders}
                                        />
                                    ))
                                )}

                                {completedWins.length > 0 && (
                                    <div className="pt-6">
                                        <button 
                                            onClick={() => setShowCompleted(!showCompleted)} 
                                            className="flex items-center gap-2 mb-4 w-full group"
                                        >
                                            <div className="h-[1px] flex-grow bg-gray-200"></div>
                                            <span className="text-[8px] font-black uppercase text-gray-400 tracking-tighter group-hover:text-blue-400 transition-colors">
                                                Completed ({completedWins.length})
                                            </span>
                                            <div className="h-[1px] flex-grow bg-gray-200"></div>
                                        </button>
                                        
                                        {showCompleted && (
                                            <div className="space-y-3 animate-pop">
                                                {completedWins.map(item => (
                                                    <WinItem 
                                                        key={item.id} 
                                                        item={item}
                                                        editingNoteId={editingNoteId}
                                                        schedulingNoteId={schedulingNoteId}
                                                        tempNoteText={tempNoteText}
                                                        tempNoteDetails={tempNoteDetails}
                                                        onStartEdit={handleWinStartEdit}
                                                        onStartSchedule={handleWinStartSchedule}
                                                        onSaveEdit={handleWinSaveEdit}
                                                        onCancelEdit={handleWinCancelEdit}
                                                        onToggleComplete={handleWinToggle}
                                                        onDelete={handleWinDelete}
                                                        onScheduleConfirm={handleWinScheduleConfirm}
                                                        formData={formData}
                                                        setFormData={setFormData}
                                                        execCommand={execCommand}
                                                        editorRef={editorRef}
                                                        folders={folders}
                                                        reminders={reminders}
                                                    />
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* QuickNotes - Now Full Width */}
                        <div className="order-1 lg:order-2 lg:col-span-5 bg-white border-2 border-gray-100 rounded-[40px] shadow-sm overflow-hidden min-h-[800px]">
                            <div className="p-10">
                                <h3 className="text-[10px] font-black text-pink-500 uppercase tracking-[.4em] mb-2">Workspace</h3>
                                <h2 className="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-8">QuickNotes</h2>
                                <input 
                                    type="text" 
                                    placeholder="New note..." 
                                    className="w-full bg-gray-50 border-2 border-gray-50 rounded-2xl p-6 text-lg font-bold outline-none focus:border-pink-100 mb-8" 
                                    onKeyDown={e => { 
                                        if(e.key === 'Enter' && e.target.value.trim()){ 
                                            handleAddNote(e.target.value);
                                            e.target.value=""; 
                                        }
                                    }} 
                                />
                                <div className="space-y-4">
                                    {scratchNotes.map(note => {
                                        const isScheduled = Object.values(reminders).some(dayEvents => 
                                            dayEvents.some(event => event.linkedNoteId === note.id)
                                        );
                                        const scheduledDates = Object.entries(reminders)
                                            .filter(([date, events]) => events.some(e => e.linkedNoteId === note.id))
                                            .map(([date]) => date);
                                        
                                        return (
                                            <div key={note.id}>
                                                {editingNoteId === note.id ? (
                                                    <div className="bg-white p-6 rounded-[32px] border-2 border-blue-500 shadow-xl animate-pop space-y-4">
                                                        <input 
                                                            className="text-xl font-bold text-gray-900 outline-none w-full bg-gray-50 p-4 rounded-xl" 
                                                            value={tempNoteText} 
                                                            onChange={e => setTempNoteText(e.target.value)} 
                                                        />
                                                        
                                                        {/* Folder Dropdown */}
                                                        <div>
                                                            <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                                                Add to Folder
                                                            </label>
                                                            <select
                                                                value={formData.folderId || ''}
                                                                onChange={e => setFormData({...formData, folderId: e.target.value})}
                                                                className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium text-sm"
                                                            >
                                                                <option value="">No folder</option>
                                                                {folders.map(folder => (
                                                                    <option key={folder.id} value={folder.id}>
                                                                        {folder.name}
                                                                    </option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                        
                                                        <div className="flex flex-wrap items-center gap-1 p-2 bg-gray-50 rounded-xl border border-gray-100">
                                                            <button onClick={() => execCommand('bold')} className="p-1.5 hover:bg-gray-200 rounded font-bold w-8 text-xs">B</button>
                                                            <button onClick={() => execCommand('underline')} className="p-1.5 hover:bg-gray-200 rounded underline w-8 text-xs">U</button>
                                                            <button onClick={() => execCommand('insertUnorderedList')} className="p-1.5 hover:bg-gray-200 rounded text-xs">Bullets</button>
                                                        </div>
                                                        <div 
                                                            ref={editorRef} 
                                                            contentEditable 
                                                            className="rich-editor w-full bg-gray-50 p-4 rounded-xl text-sm font-medium outline-none overflow-y-auto" 
                                                            dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                                                        />
                                                        <div className="flex gap-2">
                                                            <button 
                                                                onClick={() => handleNoteSaveEdit(note.id, tempNoteText, editorRef.current.innerHTML)} 
                                                                className="bg-gray-900 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
                                                            >
                                                                Save
                                                            </button>
                                                            <button 
                                                                onClick={handleWinCancelEdit} 
                                                                className="bg-gray-100 text-gray-400 px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest"
                                                            >
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : schedulingNoteId === note.id ? (
                                                    <div className="bg-white p-8 rounded-[32px] shadow-2xl border-pink-500 border-2 animate-pop">
                                                        <h3 className="text-xl font-bold mb-4">{note.text}</h3>
                                                        <div className="flex items-center gap-4">
                                                            <InlineDatePicker 
                                                                value={formData.startDate} 
                                                                onChange={v => setFormData({...formData, startDate: v})} 
                                                            />
                                                            <button 
                                                                onClick={() => handleNoteScheduleConfirm(note, formData.startDate)} 
                                                                className="bg-gray-900 text-white px-6 py-3 rounded-xl text-[10px] font-black uppercase ml-auto"
                                                            >
                                                                Confirm
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div 
                                                        onDoubleClick={() => handleNoteStartEdit(note.id, note.text, note.details || "")} 
                                                        className="bg-gray-50/50 p-6 rounded-3xl hover:bg-white border border-transparent hover:border-gray-100 flex justify-between items-center cursor-pointer group transition-all no-select"
                                                    >
                                                        <div className="min-w-0 flex-grow">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-bold text-gray-700 block truncate">{note.text}</span>
                                                                {isScheduled && (
                                                                    <div className="flex items-center gap-1 bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider shrink-0">
                                                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                                                        </svg>
                                                                    </div>
                                                                )}
                                                            </div>
                                                            {note.details && (
                                                                <div 
                                                                    className="text-[10px] text-gray-400 mt-1 italic line-clamp-1 opacity-60" 
                                                                    dangerouslySetInnerHTML={{ __html: note.details }}
                                                                />
                                                            )}
                                                        </div>
                                                        <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                                            <button 
                                                                onClick={e => { 
                                                                    e.stopPropagation(); 
                                                                    handleNoteDelete(note.id);
                                                                }} 
                                                                className="p-2 text-gray-300 hover:text-red-500 transition-colors"
                                                            >
                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                                </svg>
                                                            </button>
                                                            <button 
                                                                onClick={e => { 
                                                                    e.stopPropagation(); 
                                                                    handleNoteStartSchedule(note.id, note.text, note.details || "");
                                                                }} 
                                                                className="bg-pink-50 text-pink-600 px-4 py-2 rounded-xl text-[9px] font-black uppercase"
                                                            >
                                                                Schedule
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="order-3 lg:col-span-4 flex flex-col gap-4">
                            <div className="bg-white rounded-[24px] border border-gray-100 shadow-sm p-4">
                                <div className="flex justify-between items-center mb-3">
                                    <h4 className="text-[9px] font-black uppercase text-gray-400">
                                        {navDate.toLocaleString('default', { month: 'short', year: 'numeric' })}
                                    </h4>
                                    <div className="flex gap-1">
                                        <button 
                                            onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() - 1, 1))} 
                                            className="p-1 text-gray-300"
                                        >
                                            â†
                                        </button>
                                        <button 
                                            onClick={() => setNavDate(new Date(navDate.getFullYear(), navDate.getMonth() + 1, 1))} 
                                            className="p-1 text-gray-300"
                                        >
                                            â†’
                                        </button>
                                    </div>
                                </div>
                                <div className="day-grid gap-1">
                                    {["S","M","T","W","T","F","S"].map(d => 
                                        <div key={d} className="text-center text-[7px] font-black text-gray-200 mb-1">{d}</div>
                                    )}
                                    {calendarDays}
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-[24px] border border-gray-100 shadow-sm flex-grow flex flex-col overflow-hidden min-h-[400px]">
                                <div className="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                                    <h3 className="text-[9px] font-black text-gray-400 uppercase tracking-widest">Daily Agenda</h3>
                                    <span className="text-[8px] font-black text-gray-400">{currentKey}</span>
                                </div>
                                <div className="p-4 space-y-2 flex-grow overflow-y-auto custom-scroll">
                                    {dailyAgenda.length === 0 && (
                                        <p className="text-[9px] text-gray-300 text-center italic py-10 uppercase tracking-widest">Free Day</p>
                                    )}
                                    {dailyAgenda.map(r => (
                                        <div key={r.id}>
                                            {editingNoteId === r.id ? (
                                                <div className={`p-4 rounded-2xl border-2 shadow-xl animate-pop space-y-3 bg-white ${r.type === 'win' ? 'border-blue-500' : 'border-pink-500'}`}>
                                                    <input 
                                                        autoFocus 
                                                        className="text-[11px] font-black uppercase text-gray-900 outline-none w-full bg-gray-50 p-2 rounded-lg" 
                                                        value={tempNoteText} 
                                                        onChange={e => setTempNoteText(e.target.value)} 
                                                    />
                                                    <div className="flex gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                                                        <button onClick={() => execCommand('bold')} className="p-1 hover:bg-gray-200 rounded font-bold w-6 text-[10px]">B</button>
                                                        <button onClick={() => execCommand('underline')} className="p-1 hover:bg-gray-200 rounded underline w-6 text-[10px]">U</button>
                                                    </div>
                                                    <div 
                                                        ref={editorRef} 
                                                        contentEditable 
                                                        className="rich-editor w-full bg-gray-50 p-3 rounded-lg text-[10px] font-medium min-h-[80px] outline-none overflow-y-auto" 
                                                        dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                                                    />
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => handleAgendaSaveEdit(r.id, tempNoteText, editorRef.current.innerHTML)} 
                                                            className="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                                                        >
                                                            Save
                                                        </button>
                                                        <button 
                                                            onClick={handleWinCancelEdit} 
                                                            className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                                                        >
                                                            Cancel
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div 
                                                    onDoubleClick={() => handleAgendaStartEdit(r.id, r.text, r.notes || "")} 
                                                    className={`p-3 rounded-xl border-l-4 cursor-pointer transition-all hover:brightness-95 no-select ${
                                                        r.type === 'win' ? 'bg-blue-50/50 border-blue-500' : 'bg-pink-50/50 border-pink-500'
                                                    }`}
                                                >
                                                    <div className="flex justify-between items-start text-black">
                                                        <div className="flex items-center gap-1 flex-grow min-w-0">
                                                            <p className={`text-[10px] font-black uppercase mb-1 truncate ${r.type === 'win' ? 'text-blue-800' : 'text-gray-800'}`}>
                                                                {r.text}
                                                            </p>
                                                            {r.linkedNoteId && (
                                                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="shrink-0 text-pink-400">
                                                                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                                                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                                                                </svg>
                                                            )}
                                                        </div>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleAgendaDelete(r.id);
                                                            }}
                                                            className="text-gray-300 hover:text-red-500 transition-colors"
                                                        >
                                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                    <div 
                                                        className="text-[9px] text-gray-400 italic line-clamp-2" 
                                                        dangerouslySetInnerHTML={{ __html: r.notes }}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!auth) {
                    setLoading(false);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    setUser(firebaseUser);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = () => {
                auth.signOut();
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-pink-50">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-sm font-black uppercase tracking-widest text-gray-400">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <AuthScreen />;
            }

            return <CalendarApp user={user} onSignOut={handleSignOut} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

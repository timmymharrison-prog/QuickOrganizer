<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fff5f0;
            --bg-secondary: #ffffff;
            --bg-tertiary: #ffe8dd;
            --text-primary: #2d1810;
            --text-secondary: #5a4a42;
            --text-tertiary: #9a8a82;
            --accent-primary: #ff6b35;
            --accent-secondary: #ff8c61;
            --accent-light: #fff0e8;
            --border-color: #ffd4c4;
            --shadow-sm: 0 1px 3px rgba(255, 107, 53, 0.08);
            --shadow-md: 0 4px 12px rgba(255, 107, 53, 0.12);
            --shadow-lg: 0 8px 24px rgba(255, 107, 53, 0.16);
            --gradient-sunset: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ffd166 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hamburger Menu */
        .hamburger-menu {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1001;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            width: 40px;
            height: 40px;
            justify-content: center;
            align-items: center;
        }

        .hamburger-menu:hover {
            background: var(--accent-light);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        .hamburger-bar {
            width: 24px;
            height: 3px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger-menu:hover .hamburger-bar {
            background: var(--accent-primary);
        }

        /* Settings Menu Dropdown */
        .settings-dropdown {
            position: fixed;
            top: 5rem;
            left: 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            min-width: 200px;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .settings-dropdown.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .settings-menu-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .settings-menu-item:last-child {
            border-bottom: none;
        }

        .settings-menu-item:hover {
            background: var(--accent-light);
            color: var(--accent-primary);
        }

        .settings-menu-item.danger:hover {
            background: #fee;
            color: #c00;
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 22, 20, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1002;
            animation: fadeIn 0.3s ease;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-modal-content {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }

        .settings-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--bg-tertiary);
        }

        .settings-modal-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .settings-section {
            margin-bottom: 1.5rem;
        }

        .settings-section-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .settings-section-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .danger-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            width: 100%;
        }

        .danger-button:hover {
            background: #b91c1c;
        }

        /* Note Detail Modal */
        .note-detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 22, 20, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .note-detail-modal.active {
            display: flex;
        }

        .note-detail-content {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }

        .note-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--bg-tertiary);
        }

        .note-detail-timestamp {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .note-detail-text {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border-left: 4px solid var(--accent-primary);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-detail-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .note-action-btn {
            flex: 1;
            min-width: 150px;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .btn-note-to-calendar {
            background: var(--accent-primary);
            color: white;
        }

        .btn-note-to-calendar:hover {
            background: var(--accent-secondary);
        }

        .btn-note-to-task {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid var(--accent-primary);
        }

        .btn-note-to-task:hover {
            background: var(--accent-light);
        }

        .btn-delete-note {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-delete-note:hover {
            background: #fee;
            border-color: #c00;
            color: #c00;
        }

        .header {
            margin-bottom: 3rem;
            animation: slideDown 0.7s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: var(--gradient-sunset);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .header .date-display {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .panel:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--bg-tertiary);
        }

        .panel-header h2 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .add-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .add-btn:hover {
            background: var(--accent-secondary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        /* Tasks Section */
        .task-input-area {
            margin-bottom: 1.5rem;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .task-input-area.active {
            opacity: 1;
            max-height: 200px;
            margin-bottom: 1.5rem;
        }

        .task-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background: var(--bg-tertiary);
        }

        .task-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            transition: all 0.2s ease;
            animation: taskSlide 0.3s ease;
        }

        @keyframes taskSlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .task-item:hover {
            background: var(--accent-light);
            transform: translateX(4px);
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        .task-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-tertiary);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem 0.5rem;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            color: var(--accent-primary);
            transform: scale(1.1);
        }

        /* Notes Section */
        .notes-area {
            margin-bottom: 1.5rem;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .notes-area.active {
            opacity: 1;
            max-height: 300px;
        }

        .note-input {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s ease;
            background: var(--bg-tertiary);
        }

        .note-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .save-note-btn {
            margin-top: 0.75rem;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .save-note-btn:hover {
            background: var(--accent-secondary);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 450px;
            overflow-y: auto;
        }

        .note-item {
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            border-left: 4px solid var(--accent-primary);
            transition: all 0.2s ease;
            animation: noteSlide 0.3s ease;
        }

        @keyframes noteSlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .note-item:hover {
            background: var(--accent-light);
            transform: translateX(4px);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .note-time {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .note-text {
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Calendar Section */
        .calendar {
            position: relative;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .calendar-month {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .nav-btns {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.2rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent-primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            padding: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
        }

        .calendar-day:hover {
            background: var(--accent-light);
            border-color: var(--accent-secondary);
            transform: scale(1.05);
        }

        .calendar-day.other-month {
            color: var(--text-tertiary);
            background: transparent;
        }

        .calendar-day.today {
            background: var(--gradient-sunset);
            color: white;
            font-weight: 700;
            border: none;
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
        }

        .calendar-day.today.has-event::after {
            background: white;
        }

        .calendar-day.selected {
            background: var(--accent-secondary);
            color: white;
            border-color: var(--accent-primary);
        }

        .calendar-day.in-range {
            background: var(--accent-light);
            border-color: var(--accent-secondary);
            color: var(--text-primary);
        }

        /* Agenda View */
        .agenda-view {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--bg-tertiary);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .agenda-view.active {
            max-height: 600px;
            opacity: 1;
        }

        .agenda-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .agenda-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .clear-selection-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .clear-selection-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .agenda-content {
            max-height: 450px;
            overflow-y: auto;
        }

        .agenda-day-section {
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.3s ease;
        }

        .agenda-day-header {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent-primary);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .agenda-event {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            border-left: 3px solid var(--accent-primary);
            transition: all 0.2s ease;
        }

        .agenda-event:hover {
            background: var(--accent-light);
            transform: translateX(4px);
        }

        .agenda-event-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .agenda-event-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .agenda-event-duration {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--accent-primary);
            background: var(--accent-light);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            font-weight: 600;
        }

        .agenda-condensed {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .agenda-summary {
            padding: 1rem;
            background: var(--accent-light);
            border-radius: 8px;
            border-left: 4px solid var(--accent-primary);
            margin-bottom: 1rem;
        }

        .agenda-summary-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .agenda-summary-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .event-input-area {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .event-input-area.active {
            opacity: 1;
            max-height: 400px;
            margin-bottom: 1.5rem;
        }

        .event-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        .event-form input,
        .event-form textarea {
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .event-form input:focus,
        .event-form textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .event-form-btns {
            display: flex;
            gap: 0.5rem;
        }

        .event-form-btns button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .save-event-btn {
            background: var(--accent-primary);
            color: white;
        }

        .save-event-btn:hover {
            background: var(--accent-secondary);
        }

        .cancel-event-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .cancel-event-btn:hover {
            background: var(--bg-tertiary);
        }

        .events-list {
            max-height: 300px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .events-list.hidden {
            display: none;
        }

        .event-item {
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--accent-primary);
            transition: all 0.2s ease;
            animation: eventSlide 0.3s ease;
        }

        @keyframes eventSlide {

                        </div>
                        <div class="ribbon-group">
                            <button class="ribbon-btn" onclick="clearNoteFormatting()" title="Clear Formatting">Clear</button>
                        </div>
                    </div>
                    <div class="task-notes-editor" 
                         id="noteDetailsEditor" 
                         contenteditable="true" 
                         data-placeholder="Add additional details...">
                    </div>
                </div>

                <!-- Event Scheduling Section for Notes -->
                <div class="event-scheduling-section" id="noteEventSchedulingSection" style="display: none;">
                    <label class="notes-section-label">Schedule Event</label>
                    <div class="event-form">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                            <div>
                                <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">Start Date</label>
                                <input type="date" id="noteEventStartDate">
                            </div>
                            <div>
                                <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">End Date</label>
                                <input type="date" id="noteEventEndDate">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                            <input type="time" id="noteEventStartTime" placeholder="Start time" step="300">
                            <input type="time" id="noteEventEndTime" placeholder="End time" step="300">
                        </div>
                    </div>
                </div>

                <div class="note-detail-actions">
                    <button class="note-action-btn btn-note-to-calendar" id="noteAddToCalendarBtn" onclick="toggleNoteEventScheduling()">Add to Calendar</button>
                    <button class="note-action-btn btn-note-to-calendar" id="noteSaveEventBtn" onclick="saveNoteAsEvent()" style="display: none;">Schedule Event</button>
                    <button class="note-action-btn btn-note-to-task" onclick="addNoteToTask()">Add to Tasks</button>
                    <button class="note-action-btn btn-delete-note" onclick="deleteNoteFromModal()">Delete Note</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        let currentMonth = new Date();
        let tasks = [];
        let notes = [];
        let events = [];
        let meetings = [];
        let selectedDate = null;
        let selectedDates = [];
        let isDragging = false;
        let dragStartDate = null;
        let hasDragged = false;

        // Firebase Sync System
        let firebaseInitialized = false;
        let syncEnabled = false;

        // Wait for Firebase to be ready
        function waitForFirebase() {
            if (window.firebaseReady) {
                initializeFirebaseSync();
            } else {
                setTimeout(waitForFirebase, 100);
            }
        }

        // Initialize Firebase sync
        async function initializeFirebaseSync() {
            try {
                firebaseInitialized = true;
                console.log('ðŸ”„ Initializing Firebase sync...');
                
                await loadFromFirebase();
                setupRealtimeListeners();
                
                syncEnabled = true;
                console.log('âœ… Firebase sync enabled!');
                showSyncStatus('Connected to Nova Quick â˜ï¸', '#10b981');
            } catch (error) {
                console.error('âŒ Firebase sync failed:', error);
                loadFromLocalStorage();
                showSyncStatus('Offline mode', '#f59e0b');
            }
        }

        // Load data from Firebase
        async function loadFromFirebase() {
            const { collection, getDocs } = window.firestoreModules;
            
            try {
                const tasksSnapshot = await getDocs(collection(window.db, 'tasks'));
                tasks = tasksSnapshot.docs.map(doc => ({ ...doc.data() }));
                
                const notesSnapshot = await getDocs(collection(window.db, 'notes'));
                notes = notesSnapshot.docs.map(doc => ({ ...doc.data() }));
                
                const eventsSnapshot = await getDocs(collection(window.db, 'events'));
                events = eventsSnapshot.docs.map(doc => ({ ...doc.data() }));
                
                const meetingsSnapshot = await getDocs(collection(window.db, 'meetings'));
                meetings = meetingsSnapshot.docs.map(doc => ({ ...doc.data() }));
                
                console.log('ðŸ“¥ Loaded from Firebase:', { tasks: tasks.length, notes: notes.length, events: events.length, meetings: meetings.length });
            } catch (error) {
                console.error('Error loading from Firebase:', error);
                throw error;
            }
        }

        // Fallback: Load from localStorage
        function loadFromLocalStorage() {
            tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            notes = JSON.parse(localStorage.getItem('notes')) || [];
            events = JSON.parse(localStorage.getItem('events')) || [];
            meetings = JSON.parse(localStorage.getItem('meetings')) || [];
            console.log('ðŸ“¥ Loaded from localStorage');
        }

        // Save to Firebase
        async function saveToFirebase(collectionName, data) {
            // Always save to localStorage as backup
            localStorage.setItem(collectionName, JSON.stringify(data));
            
            if (!syncEnabled) return;

            const { collection, doc, setDoc } = window.firestoreModules;
            
            try {
                const batch = [];
                for (const item of data) {
                    batch.push(setDoc(doc(window.db, collectionName, String(item.id)), item));
                }
                await Promise.all(batch);
                
                showSyncStatus('Synced â˜ï¸', '#10b981');
                console.log(`ðŸ’¾ Saved ${data.length} items to ${collectionName}`);
            } catch (error) {
                console.error(`Error saving ${collectionName}:`, error);
                showSyncStatus('Sync failed', '#ef4444');
            }
        }

        // Real-time sync listeners
        function setupRealtimeListeners() {
            const { collection, onSnapshot } = window.firestoreModules;
            
            onSnapshot(collection(window.db, 'tasks'), (snapshot) => {
                const remoteChanges = snapshot.docChanges().filter(change => change.type !== 'removed');
                if (remoteChanges.length > 0) {
                    tasks = snapshot.docs.map(doc => ({ ...doc.data() }));
                    renderTasks();
                }
            });
            
            onSnapshot(collection(window.db, 'notes'), (snapshot) => {
                const remoteChanges = snapshot.docChanges().filter(change => change.type !== 'removed');
                if (remoteChanges.length > 0) {
                    notes = snapshot.docs.map(doc => ({ ...doc.data() }));
                    renderNotes();
                }
            });
            
            onSnapshot(collection(window.db, 'events'), (snapshot) => {
                const remoteChanges = snapshot.docChanges().filter(change => change.type !== 'removed');
                if (remoteChanges.length > 0) {
                    events = snapshot.docs.map(doc => ({ ...doc.data() }));
                    renderEvents();
                    renderCalendar();
                }
            });
            
            onSnapshot(collection(window.db, 'meetings'), (snapshot) => {
                const remoteChanges = snapshot.docChanges().filter(change => change.type !== 'removed');
                if (remoteChanges.length > 0) {
                    meetings = snapshot.docs.map(doc => ({ ...doc.data() }));
                    renderCalendar();
                }
            });
            
            console.log('ðŸ‘‚ Real-time listeners active');
        }

        // Show sync status
        function showSyncStatus(message, color = '#10b981') {
            const statusEl = document.getElementById('syncStatus');
            if (statusEl) {
                statusEl.textContent = message;
                statusEl.style.background = color;
                statusEl.style.opacity = '1';
                setTimeout(() => {
                    statusEl.style.opacity = '0';
                }, 2000);
            }
        }

        // Initialize app
        function init() {
            updateCurrentDate();
            renderCalendar();
            renderTasks();
            renderNotes();
            renderEvents();
            
            // Start Firebase sync
            waitForFirebase();
        }

        // Date display
        function updateCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);
        }

        // Tasks functionality
        function toggleTaskInput() {
            const area = document.getElementById('taskInputArea');
            const input = document.getElementById('taskInput');
            area.classList.toggle('active');
            if (area.classList.contains('active')) {
                setTimeout(() => input.focus(), 300);
            }
        }

        function handleTaskKeypress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (text) {
                tasks.push({
                    id: Date.now(),
                    text: text,
                    completed: false,
                    notes: '',
                    createdAt: new Date().toISOString()
                });
                
                saveToFirebase('tasks', tasks);
                input.value = '';
                renderTasks();
                toggleTaskInput();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveToFirebase('tasks', tasks);
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveToFirebase('tasks', tasks);
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state">No tasks yet. Add your first task!</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}" ondblclick="openTaskDetail(${task.id})">
                    <input type="checkbox" class="task-checkbox" 
                           ${task.completed ? 'checked' : ''} 
                           onchange="toggleTask(${task.id})"
                           onclick="event.stopPropagation()">
                    <span class="task-text">${task.text}</span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})">&times;</button>
                </div>
            `).join('');
        }

        // Notes functionality
        function toggleNotesInput() {
            const area = document.getElementById('notesArea');
            const input = document.getElementById('noteInput');
            area.classList.toggle('active');
            if (area.classList.contains('active')) {
                setTimeout(() => input.focus(), 300);
            }
        }

        function saveNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            
            if (text) {
                notes.unshift({
                    id: Date.now(),
                    text: text,
                    detailedNotes: '',
                    createdAt: new Date().toISOString()
                });
                
                saveToFirebase('notes', notes);
                input.value = '';
                renderNotes();
                toggleNotesInput();
            }
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveToFirebase('notes', notes);
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notesList');
            
            if (notes.length === 0) {
                container.innerHTML = '<div class="empty-state">No notes yet. Capture your ideas!</div>';
                return;
            }

            container.innerHTML = notes.map(note => {
                const date = new Date(note.createdAt);
                const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                
                return `
                    <div class="note-item" ondblclick="openNoteDetail(${note.id})">
                        <div class="note-header">
                            <span class="note-time">${timeStr}</span>
                            <button class="delete-btn" onclick="event.stopPropagation(); deleteNote(${note.id})">&times;</button>
                        </div>
                        <div class="note-text">${note.text}</div>
                    </div>
                `;
            }).join('');
        }

        // Calendar functionality
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            
            // Update month display
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                              'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('calendarMonth').textContent = `${monthNames[month]} ${year}`;
            
            // Calculate calendar grid
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            const container = document.getElementById('calendarDays');
            let html = '';
            
            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month">${daysInPrevMonth - i}</div>`;
            }
            
            // Current month days
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dateStr = date.toISOString().split('T')[0];
                const isToday = date.toDateString() === today.toDateString();
                
                // Check if any event includes this date (for multi-day events)
                const hasEvent = events.some(e => {
                    const eventStart = new Date(e.startDate);
                    const eventEnd = new Date(e.endDate || e.startDate);
                    const currentDate = new Date(dateStr);
                    return currentDate >= eventStart && currentDate <= eventEnd;
                });
                
                const isSelected = selectedDates.includes(dateStr);
                const isInRange = selectedDates.length > 1 && isDateInRange(dateStr);
                
                html += `<div class="calendar-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''} ${isSelected ? 'selected' : ''} ${isInRange ? 'in-range' : ''}" 
                         data-date="${dateStr}"
                         ondblclick="openDayView('${dateStr}')"
                         onmousedown="startDateSelection('${dateStr}')"
                         onmouseenter="continueDateSelection('${dateStr}')"
                         onmouseup="endDateSelection()">${day}</div>`;
            }
            
            // Next month days
            const remainingDays = 42 - (firstDay + daysInMonth);
            for (let day = 1; day <= remainingDays; day++) {
                html += `<div class="calendar-day other-month">${day}</div>`;
            }
            
            container.innerHTML = html;
            renderEvents();
        }

        function previousMonth() {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar();
        }

        function toggleEventInput() {
            const area = document.getElementById('eventInputArea');
            area.classList.toggle('active');
            
            if (!area.classList.contains('active')) {
                // Clear form
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventStartDate').value = '';
                document.getElementById('eventEndDate').value = '';
                document.getElementById('eventStartTime').value = '';
                document.getElementById('eventEndTime').value = '';
                document.getElementById('eventDescription').value = '';
            }
        }

        function saveEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const startDate = document.getElementById('eventStartDate').value;
            const endDate = document.getElementById('eventEndDate').value;
            const startTime = document.getElementById('eventStartTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const description = document.getElementById('eventDescription').value.trim();
            
            if (title && startDate) {
                events.push({
                    id: Date.now(),
                    title: title,
                    startDate: startDate,
                    endDate: endDate || startDate, // Default to start date if no end date
                    startTime: startTime,
                    endTime: endTime,
                    description: description
                });
                
                // Sort by start date and time
                events.sort((a, b) => {
                    const dateTimeA = new Date(a.startDate + ' ' + (a.startTime || '00:00'));
                    const dateTimeB = new Date(b.startDate + ' ' + (b.startTime || '00:00'));
                    return dateTimeA - dateTimeB;
                });
                
                saveToFirebase('events', events);
                toggleEventInput();
                renderCalendar();
                renderEvents();
            }
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveToFirebase('events', events);
            renderCalendar();
            renderEvents();
            renderAgenda();
        }

        // Date Selection & Agenda Functions
        function startDateSelection(dateStr) {
            isDragging = true;
            hasDragged = false;
            dragStartDate = dateStr;
            selectedDates = [dateStr];
            renderCalendar();
        }

        function continueDateSelection(dateStr) {
            if (!isDragging) return;
            
            // If we moved to a different date, mark that we've dragged
            if (dateStr !== dragStartDate) {
                hasDragged = true;
            }
            
            // Build range from drag start to current
            const start = new Date(dragStartDate);
            const current = new Date(dateStr);
            
            const minDate = start < current ? start : current;
            const maxDate = start < current ? current : start;
            
            selectedDates = [];
            for (let d = new Date(minDate); d <= maxDate; d.setDate(d.getDate() + 1)) {
                selectedDates.push(d.toISOString().split('T')[0]);
            }
            
            renderCalendar();
        }

        function endDateSelection() {
            if (isDragging) {
                isDragging = false;
                
                // Only render agenda if we actually dragged
                // If we didn't drag (just clicked), keep the single date selection
                if (!hasDragged) {
                    // This was a simple click, keep just the one date
                    selectedDates = [dragStartDate];
                }
                
                renderAgenda();
                hasDragged = false;
            }
        }

        function isDateInRange(dateStr) {
            if (selectedDates.length < 2) return false;
            const sortedDates = [...selectedDates].sort();
            return dateStr >= sortedDates[0] && dateStr <= sortedDates[sortedDates.length - 1];
        }

        function clearDateSelection() {
            selectedDates = [];
            dragStartDate = null;
            isDragging = false;
            hasDragged = false;
            renderCalendar();
            document.getElementById('agendaView').classList.remove('active');
            document.getElementById('eventsList').classList.remove('hidden');
        }

        function renderAgenda() {
            const agendaView = document.getElementById('agendaView');
            const agendaTitle = document.getElementById('agendaTitle');
            const agendaContent = document.getElementById('agendaContent');
            const eventsList = document.getElementById('eventsList');
            
            if (selectedDates.length === 0) {
                agendaView.classList.remove('active');
                eventsList.classList.remove('hidden');
                return;
            }
            
            agendaView.classList.add('active');
            eventsList.classList.add('hidden');
            
            if (selectedDates.length === 0) {
                agendaView.classList.remove('active');
                return;
            }
            
            agendaView.classList.add('active');
            
            // Sort selected dates
            const sortedDates = [...selectedDates].sort();
            
            if (selectedDates.length === 1) {
                // Single date - detailed view
                const date = new Date(sortedDates[0]);
                agendaTitle.textContent = date.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    month: 'long', 
                    day: 'numeric' 
                });
                
                const dayEvents = events.filter(e => {
                    const eventStart = new Date(e.startDate);
                    const eventEnd = new Date(e.endDate || e.startDate);
                    const currentDate = new Date(sortedDates[0]);
                    return currentDate >= eventStart && currentDate <= eventEnd;
                }).sort((a, b) => {
                    const timeA = a.startTime || '00:00';
                    const timeB = b.startTime || '00:00';
                    return timeA.localeCompare(timeB);
                });
                
                // Deduplicate events by ID
                const uniqueEvents = [];
                const seenIds = new Set();
                dayEvents.forEach(event => {
                    if (!seenIds.has(event.id)) {
                        seenIds.add(event.id);
                        uniqueEvents.push(event);
                    }
                });
                
                if (uniqueEvents.length === 0) {
                    agendaContent.innerHTML = '<div class="empty-state">No events scheduled</div>';
                } else {
                    agendaContent.innerHTML = uniqueEvents.map(event => {
                        const startDate = new Date(event.startDate);
                        const endDate = new Date(event.endDate || event.startDate);
                        
                        let dateRangeStr = '';
                        if (event.startDate !== event.endDate && event.endDate) {
                            const startStr = startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                            const endStr = endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                            dateRangeStr = `${startStr} - ${endStr}`;
                        }
                        
                        let timeStr = '';
                        let durationStr = '';
                        
                        if (event.startTime) {
                            const startFormatted = new Date('2000-01-01 ' + event.startTime).toLocaleTimeString('en-US', { 
                                hour: 'numeric', 
                                minute: '2-digit' 
                            });
                            
                            if (event.endTime) {
                                const endFormatted = new Date('2000-01-01 ' + event.endTime).toLocaleTimeString('en-US', { 
                                    hour: 'numeric', 
                                    minute: '2-digit' 
                                });
                                timeStr = `${startFormatted} - ${endFormatted}`;
                                durationStr = calculateDuration(event.startDate, event.startTime, event.endDate || event.startDate, event.endTime);
                            } else {
                                timeStr = startFormatted;
                            }
                        }
                        
                        return `
                            <div class="agenda-event">
                                <div class="agenda-event-title">${event.title}</div>
                                ${dateRangeStr ? `<div class="agenda-event-time" style="color: var(--accent-primary); font-weight: 600; margin-bottom: 0.25rem;">${dateRangeStr}</div>` : ''}
                                ${timeStr ? `<div class="agenda-event-time">
                                    ${timeStr}
                                    ${durationStr ? `<span class="agenda-event-duration">${durationStr}</span>` : ''}
                                </div>` : ''}
                            </div>
                        `;
                    }).join('');
                }
            } else {
                // Multi-date range - condensed view
                const startDate = new Date(sortedDates[0]);
                const endDate = new Date(sortedDates[sortedDates.length - 1]);
                
                agendaTitle.textContent = `${startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
                
                // Get all events in the range
                const rangeEvents = events.filter(e => {
                    const eventStart = new Date(e.startDate);
                    const eventEnd = new Date(e.endDate || e.startDate);
                    return eventEnd >= startDate && eventStart <= endDate;
                }).sort((a, b) => {
                    const dateTimeA = new Date(a.startDate + ' ' + (a.startTime || '00:00'));
                    const dateTimeB = new Date(b.startDate + ' ' + (b.startTime || '00:00'));
                    return dateTimeA - dateTimeB;
                });
                
                // Deduplicate events by ID
                const uniqueRangeEvents = [];
                const seenRangeIds = new Set();
                rangeEvents.forEach(event => {
                    if (!seenRangeIds.has(event.id)) {
                        seenRangeIds.add(event.id);
                        uniqueRangeEvents.push(event);
                    }
                });
                
                if (uniqueRangeEvents.length === 0) {
                    agendaContent.innerHTML = '<div class="empty-state">No events in this date range</div>';
                } else {
                    // Summary
                    const totalEvents = uniqueRangeEvents.length;
                    const totalDays = selectedDates.length;
                    
                    let summaryHTML = `
                        <div class="agenda-summary">
                            <div class="agenda-summary-title">${totalEvents} event${totalEvents !== 1 ? 's' : ''} over ${totalDays} day${totalDays !== 1 ? 's' : ''}</div>
                        </div>
                    `;
                    
                    // Separate multi-day spanning events from single-day events
                    const spanningEvents = [];
                    const daySpecificEvents = {};
                    
                    uniqueRangeEvents.forEach(event => {
                        const eventStart = new Date(event.startDate);
                        const eventEnd = new Date(event.endDate || event.startDate);
                        const eventSpansDays = event.endDate && event.startDate !== event.endDate;
                        
                        if (eventSpansDays) {
                            // This is a multi-day event
                            spanningEvents.push(event);
                        } else {
                            // Single day event - add to specific day
                            if (!daySpecificEvents[event.startDate]) {
                                daySpecificEvents[event.startDate] = [];
                            }
                            daySpecificEvents[event.startDate].push(event);
                        }
                    });
                    
                    let eventsHTML = '';
                    
                    // Show spanning events first (only once each)
                    if (spanningEvents.length > 0) {
                        eventsHTML += `<div class="agenda-day-section">`;
                        eventsHTML += `<div class="agenda-day-header">Multi-Day Events</div>`;
                        
                        spanningEvents.forEach(event => {
                            const eventStart = new Date(event.startDate);
                            const eventEnd = new Date(event.endDate);
                            const dateRangeStr = `${eventStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${eventEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
                            
                            let timeStr = '';
                            if (event.startTime && event.endTime) {
                                const durationStr = calculateDuration(event.startDate, event.startTime, event.endDate, event.endTime);
                                timeStr = `<span class="agenda-event-duration">${durationStr}</span>`;
                            }
                            
                            eventsHTML += `
                                <div class="agenda-event">
                                    <div class="agenda-event-title">${event.title}</div>
                                    <div class="agenda-event-time">
                                        ${dateRangeStr}
                                        ${timeStr}
                                    </div>
                                </div>
                            `;
                        });
                        
                        eventsHTML += `</div>`;
                    }
                    
                    // Then show single-day events grouped by date
                    sortedDates.forEach(dateStr => {
                        if (daySpecificEvents[dateStr] && daySpecificEvents[dateStr].length > 0) {
                            const date = new Date(dateStr);
                            const dayHeader = date.toLocaleDateString('en-US', { 
                                weekday: 'short', 
                                month: 'short', 
                                day: 'numeric' 
                            });
                            
                            eventsHTML += `<div class="agenda-day-section">`;
                            eventsHTML += `<div class="agenda-day-header">${dayHeader}</div>`;
                            
                            daySpecificEvents[dateStr].forEach(event => {
                                let timeStr = '';
                                if (event.startTime) {
                                    const startFormatted = new Date('2000-01-01 ' + event.startTime).toLocaleTimeString('en-US', { 
                                        hour: 'numeric', 
                                        minute: '2-digit' 
                                    });
                                    timeStr = startFormatted;
                                    
                                    if (event.endTime) {
                                        const durationStr = calculateDuration(event.startDate, event.startTime, event.endDate || event.startDate, event.endTime);
                                        timeStr += ` <span class="agenda-event-duration">${durationStr}</span>`;
                                    }
                                }
                                
                                eventsHTML += `
                                    <div class="agenda-event">
                                        <div class="agenda-event-title">${event.title}</div>
                                        ${timeStr ? `<div class="agenda-event-time">${timeStr}</div>` : ''}
                                    </div>
                                `;
                            });
                            
                            eventsHTML += `</div>`;
                        }
                    });
                    
                    agendaContent.innerHTML = summaryHTML + eventsHTML;
                }
            }
        }

        function calculateDuration(startDate, startTime, endDate, endTime) {
            if (!startDate || !startTime || !endDate || !endTime) return null;
            
            const start = new Date(startDate + ' ' + startTime);
            const end = new Date(endDate + ' ' + endTime);
            const diffMs = end - start;
            
            if (diffMs <= 0) return null;
            
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);
            
            if (diffDays > 0) {
                const remainingHours = diffHours % 24;
                const remainingMins = diffMins % 60;
                
                let result = `${diffDays}d`;
                if (remainingHours > 0) result += ` ${remainingHours}h`;
                if (remainingMins > 0) result += ` ${remainingMins}m`;
                return result;
            } else if (diffHours > 0) {
                const remainingMins = diffMins % 60;
                return remainingMins > 0 ? `${diffHours}h ${remainingMins}m` : `${diffHours}h`;
            } else {
                return `${diffMins}m`;
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventsList');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Filter for upcoming or ongoing events
            const upcoming = events.filter(e => {
                const eventEnd = new Date(e.endDate || e.startDate);
                eventEnd.setHours(23, 59, 59, 999);
                return eventEnd >= today;
            });
            
            if (upcoming.length === 0) {
                container.innerHTML = '<div class="empty-state">No upcoming events</div>';
                return;
            }

            container.innerHTML = upcoming.slice(0, 5).map(event => {
                const startDate = new Date(event.startDate);
                const endDate = new Date(event.endDate || event.startDate);
                
                let dateStr = '';
                if (event.startDate === event.endDate || !event.endDate) {
                    dateStr = startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                } else {
                    const startStr = startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    const endStr = endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    dateStr = `${startStr} - ${endStr}`;
                }
                
                let timeStr = '';
                let durationStr = '';
                
                if (event.startTime) {
                    const startFormatted = new Date('2000-01-01 ' + event.startTime).toLocaleTimeString('en-US', { 
                        hour: 'numeric', 
                        minute: '2-digit' 
                    });
                    
                    if (event.endTime) {
                        const endFormatted = new Date('2000-01-01 ' + event.endTime).toLocaleTimeString('en-US', { 
                            hour: 'numeric', 
                            minute: '2-digit' 
                        });
                        timeStr = `${startFormatted} - ${endFormatted}`;
                        durationStr = calculateDuration(event.startDate, event.startTime, event.endDate || event.startDate, event.endTime);
                    } else {
                        timeStr = startFormatted;
                    }
                }
                
                return `
                    <div class="event-item">
                        <div class="note-header">
                            <div class="event-date">${dateStr}</div>
                            <button class="delete-btn" onclick="deleteEvent(${event.id})">&times;</button>
                        </div>
                        <div class="event-title">${event.title}</div>
                        ${timeStr ? `<div class="event-time">${timeStr}</div>` : ''}
                        ${durationStr ? `<div class="event-duration">Duration: ${durationStr}</div>` : ''}
                        ${event.description ? `<div class="note-text" style="margin-top: 0.5rem; font-size: 0.85rem;">${event.description}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

            renderAgenda();

            // Close the modal and reset scheduling section
            document.getElementById('noteEventSchedulingSection').style.display = 'none';
            document.getElementById('noteAddToCalendarBtn').style.display = 'block';
            document.getElementById('noteSaveEventBtn').style.display = 'none';
            closeNoteDetail();
            
            if (moveNote) {
                alert('Note moved to calendar!');
            } else {
                alert('Calendar event created! Note kept in notes.');
            }
        }

        function addNoteToTask() {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            // Save detailed notes first
            const editor = document.getElementById('noteDetailsEditor');
            note.detailedNotes = editor.innerHTML;
            saveToFirebase('notes', notes);

            // Create a new task with both the original note and detailed notes
            tasks.push({
                id: Date.now(),
                text: note.text.substring(0, 100) + (note.text.length > 100 ? '...' : ''),
                completed: false,
                notes: (note.text.length > 100 ? note.text : '') + (note.detailedNotes || ''), // Combine original text (if truncated) and detailed notes
                createdAt: new Date().toISOString()
            });
            
            saveToFirebase('tasks', tasks);
            renderTasks();

            // Close modal
            closeNoteDetail();
            
            alert('Note added to tasks!');
        }

        function deleteNoteFromModal() {
            if (currentNoteId && confirm('Are you sure you want to delete this note?')) {
                deleteNote(currentNoteId);
                closeNoteDetail();
            }
        }

        function clearAllData() {
            const confirmText = 'Are you sure you want to clear all tasks, notes, and events? This action cannot be undone.';
            
            if (confirm(confirmText)) {
                // Clear all data from localStorage
                localStorage.removeItem('tasks');
                localStorage.removeItem('notes');
                localStorage.removeItem('events');
                
                // Reset in-memory state
                tasks = [];
                notes = [];
                events = [];
                selectedDates = [];
                dragStartDate = null;
                isDragging = false;
                hasDragged = false;
                
                // Re-render all components
                renderTasks();
                renderNotes();
                renderCalendar();
                renderEvents();
                
                // Hide agenda if shown
                document.getElementById('agendaView').classList.remove('active');
                document.getElementById('eventsList').classList.remove('hidden');
                
                // Close the settings modal
                closeSettingsModal();
                
                alert('All data has been cleared successfully.');
            }
        }

    </script>
</body>
</html>

                                                            setShowNewEventFolders(false);
                                                        }}
                                                        className={`p-2 rounded-lg text-[9px] font-bold flex items-center gap-2 transition-all ${
                                                            newEventFolderId === folder.id
                                                                ? 'bg-gray-900 text-white'
                                                                : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                        }`}
                                                    >
                                                        <div className={`w-3 h-3 rounded ${colorClasses[folder.color]}`}></div>
                                                        {folder.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Recurring Event Selector */}
                                    <div className="mb-4">
                                        <label className="block text-[8px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                            Repeat
                                        </label>
                                        <select
                                            value={newEventRecurring}
                                            onChange={(e) => setNewEventRecurring(e.target.value)}
                                            className="w-full text-[10px] p-2 bg-gray-50 rounded-lg border border-gray-100 outline-none"
                                        >
                                            <option value="none">Does not repeat</option>
                                            <option value="daily">Daily</option>
                                            <option value="weekly">Weekly</option>
                                            <option value="monthly">Monthly</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2 max-h-64 overflow-y-auto custom-scroll">
                                        {filteredEvents.map(event => {
                                            const eventFolder = folders.find(f => f.id === event.folderId);
                                            
                                            if (editingEventId === event.id) {
                                                return (
                                                    <div key={event.id} className="bg-white p-3 rounded-xl border-2 border-purple-500 shadow-xl animate-pop space-y-2">
                                                        <input 
                                                            autoFocus 
                                                            className="text-[10px] font-black uppercase text-gray-900 outline-none w-full bg-gray-50 p-2 rounded-lg" 
                                                            value={tempEventText} 
                                                            onChange={e => setTempEventText(e.target.value)} 
                                                        />
                                                        <div className="flex gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                                                            <button onClick={() => {
                                                                document.execCommand('bold', false, null);
                                                                if (eventEditorRef.current) eventEditorRef.current.focus();
                                                            }} className="p-1 hover:bg-gray-200 rounded font-bold w-6 text-[10px]">B</button>
                                                            <button onClick={() => {
                                                                document.execCommand('underline', false, null);
                                                                if (eventEditorRef.current) eventEditorRef.current.focus();
                                                            }} className="p-1 hover:bg-gray-200 rounded underline w-6 text-[10px]">U</button>
                                                            <button onClick={() => {
                                                                document.execCommand('insertUnorderedList', false, null);
                                                                if (eventEditorRef.current) eventEditorRef.current.focus();
                                                            }} className="p-1 hover:bg-gray-200 rounded text-[9px] px-2 font-bold">List</button>
                                                        </div>
                                                        <div 
                                                            ref={eventEditorRef} 
                                                            contentEditable 
                                                            className="rich-editor w-full bg-gray-50 p-2 rounded-lg text-[10px] font-medium min-h-[60px] outline-none overflow-y-auto" 
                                                            dangerouslySetInnerHTML={{ __html: tempEventDetails }} 
                                                        />
                                                        <div>
                                                            <label className="block text-[8px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                                                Folder
                                                            </label>
                                                            <select
                                                                value={tempEventFolderId}
                                                                onChange={(e) => setTempEventFolderId(e.target.value)}
                                                                className="w-full text-[10px] p-2 bg-gray-50 rounded-lg border border-gray-100 outline-none"
                                                            >
                                                                <option value="">No Folder</option>
                                                                {folders.map(folder => (
                                                                    <option key={folder.id} value={folder.id}>{folder.name}</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-[8px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                                                Repeat
                                                            </label>
                                                            <select
                                                                value={tempEventRecurring}
                                                                onChange={(e) => setTempEventRecurring(e.target.value)}
                                                                className="w-full text-[10px] p-2 bg-gray-50 rounded-lg border border-gray-100 outline-none"
                                                            >
                                                                <option value="none">Does not repeat</option>
                                                                <option value="daily">Daily</option>
                                                                <option value="weekly">Weekly</option>
                                                                <option value="monthly">Monthly</option>
                                                            </select>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button 
                                                                onClick={() => handleEventSaveEdit(event.id, tempEventText, eventEditorRef.current.innerHTML, tempEventFolderId, tempEventRecurring)} 
                                                                className="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                                                            >
                                                                Save
                                                            </button>
                                                            <button 
                                                                onClick={handleEventCancelEdit} 
                                                                className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                                                            >
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            
                                            return (
                                                <div
                                                    key={event.id}
                                                    onClick={() => handleEventStartEdit(event.id, event.text, event.details || "", event.folderId || "", event.recurring || "none")}
                                                    className="flex items-start gap-3 p-3 bg-gray-50 rounded-xl hover:bg-white border border-transparent hover:border-gray-100 transition-all group cursor-pointer"
                                                >
                                                    <div className="flex-grow min-w-0">
                                                        <p className="text-[10px] font-bold text-gray-700">
                                                            {event.text}
                                                        </p>
                                                        {eventFolder && (
                                                            <span className={`inline-block mt-1 mr-1 px-1.5 py-0.5 rounded-full text-[7px] font-black uppercase text-white ${colorClasses[eventFolder.color] || 'bg-gray-400'}`}>
                                                                {eventFolder.name}
                                                            </span>
                                                        )}
                                                        {event.recurring && event.recurring !== 'none' && (
                                                            <span className="inline-block mt-1 px-1.5 py-0.5 rounded-full text-[7px] font-black uppercase bg-purple-500 text-white">
                                                                🔄 {event.recurring}
                                                            </span>
                                                        )}
                                                        {event.details && (
                                                            <div 
                                                                className="text-[8px] text-gray-400 italic mt-1 opacity-60 line-clamp-2" 
                                                                dangerouslySetInnerHTML={{ __html: event.details }}
                                                            />
                                                        )}
                                                    </div>
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleDeleteEvent(event.id);
                                                        }}
                                                        className="opacity-0 group-hover:opacity-100 p-1 text-gray-300 hover:text-red-500 transition-colors"
                                                    >
                                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                        </svg>
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!auth) {
                    setLoading(false);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    setUser(firebaseUser);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = () => {
                auth.signOut();
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-pink-50">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-sm font-black uppercase tracking-widest text-gray-400">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <AuthScreen />;
            }

            return <MainApp user={user} onSignOut={handleSignOut} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

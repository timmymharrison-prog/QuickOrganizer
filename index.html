<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Jefferson v5.2.0 - Cloud Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; margin: 0; }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .rich-editor { min-height: 100px; outline: none; }
        .rich-editor ul { list-style-type: disc; padding-left: 1.5rem; }
        .rich-editor ol { list-style-type: decimal; padding-left: 1.5rem; }
        .rich-editor b { font-weight: bold; }
        .rich-editor u { text-decoration: underline; }
        .firebase-status { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
        }
        .status-connected { background: #10b981; }
        .status-disconnected { background: #ef4444; }
        .status-syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Prevent text selection on double-click */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body class="p-4 md:p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC21uDcMLyGso3kLqBYimTL8loUi5zzLjw",
            authDomain: "nova-quick.firebaseapp.com",
            projectId: "nova-quick",
            storageBucket: "nova-quick.firebasestorage.app",
            messagingSenderId: "914595554926",
            appId: "1:914595554926:web:e19d4fc962794d9e9aa87f",
            measurementId: "G-YLV78DYWEJ"
        };

        // Initialize Firebase
        let db = null;
        let auth = null;
        let isFirebaseConfigured = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            isFirebaseConfigured = true;
            console.log("âœ… Firebase initialized successfully");
        } catch (error) {
            console.error("âŒ Firebase initialization error:", error);
            isFirebaseConfigured = false;
        }

        const formatKey = (d) => {
            const dateObj = d instanceof Date ? d : new Date(d);
            return `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}/${dateObj.getFullYear()}`;
        };

        // Auth Screen Component
        function AuthScreen() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [resetMode, setResetMode] = useState(false);
            const [resetSent, setResetSent] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (resetMode) {
                        await auth.sendPasswordResetEmail(email);
                        setResetSent(true);
                        setLoading(false);
                        return;
                    }

                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        if (password !== confirmPassword) {
                            setError('Passwords do not match');
                            setLoading(false);
                            return;
                        }
                        if (password.length < 6) {
                            setError('Password must be at least 6 characters');
                            setLoading(false);
                            return;
                        }
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setLoading(false);
                    switch (err.code) {
                        case 'auth/email-already-in-use':
                            setError('Email already in use');
                            break;
                        case 'auth/invalid-email':
                            setError('Invalid email address');
                            break;
                        case 'auth/user-not-found':
                            setError('No account found with this email');
                            break;
                        case 'auth/wrong-password':
                            setError('Incorrect password');
                            break;
                        case 'auth/weak-password':
                            setError('Password should be at least 6 characters');
                            break;
                        default:
                            setError(err.message);
                    }
                }
            };

            if (resetMode && resetSent) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-pink-50">
                        <div className="bg-white rounded-[40px] shadow-2xl p-12 max-w-md w-full border-2 border-gray-100">
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                    </svg>
                                </div>
                                <h2 className="text-2xl font-black text-gray-900 mb-2">Check Your Email</h2>
                                <p className="text-sm text-gray-500">We sent a password reset link to <strong>{email}</strong></p>
                            </div>
                            <button
                                onClick={() => {
                                    setResetMode(false);
                                    setResetSent(false);
                                    setEmail('');
                                }}
                                className="w-full bg-gray-900 text-white py-3 rounded-xl font-black uppercase text-sm tracking-wider hover:bg-gray-800 transition-all"
                            >
                                Back to Login
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-pink-50">
                    <div className="bg-white rounded-[40px] shadow-2xl p-12 max-w-md w-full border-2 border-gray-100">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black italic uppercase tracking-tighter text-gray-900 mb-2">
                                Code Jefferson
                            </h1>
                            <p className="text-xs font-black uppercase tracking-widest text-gray-400">
                                {resetMode ? 'Reset Password' : isLogin ? 'Welcome Back' : 'Create Account'}
                            </p>
                        </div>

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium"
                                    placeholder="you@example.com"
                                    required
                                />
                            </div>

                            {!resetMode && (
                                <div>
                                    <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                        Password
                                    </label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium"
                                        placeholder="Enter your password"
                                        required
                                    />
                                </div>
                            )}

                            {!isLogin && !resetMode && (
                                <div>
                                    <label className="block text-xs font-black uppercase tracking-wider text-gray-600 mb-2">
                                        Confirm Password
                                    </label>
                                    <input
                                        type="password"
                                        value={confirmPassword}
                                        onChange={(e) => setConfirmPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none transition-all font-medium"
                                        placeholder="Confirm your password"
                                        required
                                    />
                                </div>
                            )}

                            {error && (
                                <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-bold">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gray-900 text-white py-4 rounded-xl font-black uppercase text-sm tracking-wider hover:bg-gray-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Please wait...' : resetMode ? 'Send Reset Link' : isLogin ? 'Sign In' : 'Create Account'}
                            </button>
                        </form>

                        <div className="mt-6 text-center space-y-3">
                            {!resetMode && (
                                <>
                                    <button
                                        onClick={() => {
                                            setIsLogin(!isLogin);
                                            setError('');
                                            setPassword('');
                                            setConfirmPassword('');
                                        }}
                                        className="text-sm text-gray-600 hover:text-gray-900 font-bold transition-colors"
                                    >
                                        {isLogin ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                                    </button>
                                    
                                    {isLogin && (
                                        <div>
                                            <button
                                                onClick={() => {
                                                    setResetMode(true);
                                                    setError('');
                                                }}
                                                className="text-sm text-blue-600 hover:text-blue-700 font-bold transition-colors"
                                            >
                                                Forgot password?
                                            </button>
                                        </div>
                                    )}
                                </>
                            )}

                            {resetMode && (
                                <button
                                    onClick={() => {
                                        setResetMode(false);
                                        setError('');
                                        setEmail('');
                                    }}
                                    className="text-sm text-gray-600 hover:text-gray-900 font-bold transition-colors"
                                >
                                    Back to login
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function InlineDatePicker({ value, onChange }) {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const ref = useRef(null);
            
            useEffect(() => {
                const clickOut = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", clickOut);
                return () => document.removeEventListener("mousedown", clickOut);
            }, []);
            
            const renderDays = useMemo(() => {
                const year = viewDate.getFullYear(); 
                const month = viewDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];
                
                for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(
                        <button 
                            key={i} 
                            type="button" 
                            onClick={() => { 
                                onChange(formatKey(new Date(year, month, i))); 
                                setIsOpen(false); 
                            }} 
                            className="text-[9px] p-1.5 hover:bg-gray-800 hover:text-white rounded-md font-bold"
                        >
                            {i}
                        </button>
                    );
                }
                return days;
            }, [viewDate, onChange]);
            
            return (
                <div className="relative w-full" ref={ref}>
                    <button 
                        type="button" 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="text-[9px] font-black px-2 py-1.5 rounded-lg uppercase tracking-wider w-full text-center bg-gray-100 text-gray-900 hover:bg-gray-200 transition-all"
                    >
                        {value}
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-2 bg-white border border-gray-100 shadow-2xl rounded-2xl p-3 z-[100] w-56 text-black animate-pop">
                            <div className="flex justify-between items-center mb-2">
                                <button 
                                    type="button" 
                                    onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} 
                                    className="p-1 hover:bg-gray-100 rounded-lg"
                                >
                                    â†
                                </button>
                                <span className="text-[9px] font-black uppercase">
                                    {viewDate.toLocaleString('default', { month: 'short' })} {viewDate.getFullYear()}
                                </span>
                                <button 
                                    type="button" 
                                    onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} 
                                    className="p-1 hover:bg-gray-100 rounded-lg"
                                >
                                    â†’
                                </button>
                            </div>
                            <div className="day-grid gap-1">
                                {["S","M","T","W","T","F","S"].map(d => 
                                    <div key={d} className="text-center text-[7px] font-black text-gray-300">{d}</div>
                                )}
                                {renderDays}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const WinItem = React.memo(({ 
            item, 
            editingNoteId, 
            schedulingNoteId,
            tempNoteText,
            tempNoteDetails,
            onStartEdit,
            onStartSchedule,
            onSaveEdit,
            onCancelEdit,
            onToggleComplete,
            onDelete,
            onScheduleConfirm,
            formData,
            setFormData,
            execCommand,
            editorRef,
            folders,
            reminders
        }) => {
            if (editingNoteId === item.id) {
                return (
                    <div className="bg-white p-4 rounded-2xl border-2 border-blue-500 shadow-xl animate-pop space-y-3">
                        <input 
                            autoFocus 
                            className="text-[11px] font-black uppercase text-gray-900 outline-none w-full bg-gray-50 p-2 rounded-lg" 
                            value={tempNoteText} 
                            onChange={e => onStartEdit(item.id, e.target.value, tempNoteDetails)} 
                        />
                        
                        {/* Folder Dropdown */}
                        <div>
                            <label className="block text-[9px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                Add to Folder
                            </label>
                            <select
                                value={formData.folderId || ''}
                                onChange={e => setFormData({...formData, folderId: e.target.value})}
                                className="w-full px-3 py-2 rounded-lg border border-gray-100 focus:border-blue-500 outline-none transition-all text-[10px] font-medium"
                            >
                                <option value="">No folder</option>
                                {folders.map(folder => (
                                    <option key={folder.id} value={folder.id}>
                                        {folder.name}
                                    </option>
                                ))}
                            </select>
                        </div>

                        {/* Priority Dropdown */}
                        <div>
                            <label className="block text-[9px] font-black uppercase tracking-wider text-gray-600 mb-1">
                                Priority
                            </label>
                            <select
                                value={formData.priority || '3'}
                                onChange={e => setFormData({...formData, priority: e.target.value})}
                                className="w-full px-3 py-2 rounded-lg border border-gray-100 focus:border-blue-500 outline-none transition-all text-[10px] font-medium"
                            >
                                <option value="1">ðŸ”´ Priority 1 - Urgent</option>
                                <option value="2">ðŸŸ  Priority 2 - High</option>
                                <option value="3">ðŸŸ¡ Priority 3 - Medium</option>
                                <option value="4">ðŸŸ¢ Priority 4 - Low</option>
                                <option value="5">âšª Priority 5 - Lowest</option>
                            </select>
                        </div>
                        
                        <div className="flex gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                            <button onClick={() => execCommand('bold')} className="p-1 hover:bg-gray-200 rounded font-bold w-6 text-[10px]">B</button>
                            <button onClick={() => execCommand('underline')} className="p-1 hover:bg-gray-200 rounded underline w-6 text-[10px]">U</button>
                            <button onClick={() => execCommand('insertUnorderedList')} className="p-1 hover:bg-gray-200 rounded text-[9px] px-2 font-bold">List</button>
                        </div>
                        <div 
                            ref={editorRef} 
                            contentEditable 
                            className="rich-editor w-full bg-gray-50 p-3 rounded-lg text-[10px] font-medium min-h-[80px] outline-none overflow-y-auto" 
                            dangerouslySetInnerHTML={{ __html: tempNoteDetails }} 
                        />
                        <div className="flex gap-2">
                            <button 
                                onClick={() => onSaveEdit(item.id, tempNoteText, editorRef.current.innerHTML)} 
                                className="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                            >
                                Save
                            </button>
                            <button 
                                onClick={onCancelEdit} 
                                className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>
                );
            }
            
            if (schedulingNoteId === item.id) {
                return (
                    <div className="bg-white p-4 rounded-2xl border-2 border-blue-500 shadow-xl animate-pop space-y-3">
                        <p className="text-[9px] font-black text-blue-500 uppercase tracking-widest text-center">Schedule Win</p>
                        <h4 className="text-[10px] font-bold text-center">{item.text}</h4>
                        <InlineDatePicker 
                            value={formData.startDate} 
                            onChange={v => setFormData({...formData, startDate: v})} 
                        />
                        <button 
                            onClick={() => onScheduleConfirm(item, formData.startDate)} 
                            className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase w-full"
                        >
                            Confirm Add
                        </button>
                    </div>
                );
            }
            
            return (
                <div 
                    onDoubleClick={() => onStartEdit(item.id, item.text, item.details || "")} 
                    className={`flex items-center gap-3 p-4 bg-white rounded-2xl border border-gray-100 shadow-sm transition-all group hover:border-blue-200 cursor-pointer no-select relative overflow-hidden ${item.completed ? 'opacity-60 bg-gray-50' : ''}`}
                >
                    {/* Priority Color Bar - Left Side */}
                    {item.priority && item.priority !== '3' && (
                        <div className={`absolute left-0 top-0 bottom-0 w-1 ${
                            item.priority === '1' ? 'bg-red-500' :
                            item.priority === '2' ? 'bg-orange-500' :
                            item.priority === '4' ? 'bg-green-500' :
                            'bg-gray-300'
                        }`} />
                    )}
                    
                    <input 
                        type="checkbox" 
                        checked={item.completed} 
                        onChange={(e) => { 
                            e.stopPropagation(); 
                            onToggleComplete(item.id);
                        }} 
                        className="w-4 h-4 accent-blue-500 cursor-pointer" 
                    />
                    <div className="flex-grow min-w-0">
                        <div className="flex items-center gap-2">
                            <p className={`text-[11px] font-black uppercase text-gray-900 truncate ${item.completed ? 'line-through' : ''}`}>
                                {item.text}
                            </p>
                            {/* Scheduled Calendar Icon - Always Visible */}
                            {(() => {
                                const isScheduled = Object.values(reminders).some(dayEvents => 
                                    dayEvents.some(event => event.linkedNoteId === item.id)
                                );
                                return isScheduled ? (
                                    <div className="flex items-center gap-1 bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider shrink-0">
                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                        </svg>
                                    </div>
                                ) : null;
                            })()}
                        </div>
                        {item.details && (
                            <div 
                                className="text-[8px] text-gray-400 italic truncate opacity-60" 
                                dangerouslySetInnerHTML={{ __html: item.details }}
                            />
                        )}
                    </div>
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 items-center">
                        <button 
                            onClick={(e) => { 
                                e.stopPropagation(); 
                                onDelete(item.id);
                            }} 
                            className="p-1 text-gray-300 hover:text-red-500 transition-colors"
                        >
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                        {!item.completed && (
                            <button 
                                onClick={(e) => { 
                                    e.stopPropagation(); 
                                    onStartSchedule(item.id);
                                }} 
                                className="bg-blue-50 text-blue-600 px-2 py-1 rounded-md text-[8px] font-black uppercase tracking-tighter"
                            >
                                Add
                            </button>
                        )}
                    </div>
                </div>
            );
        });

        function CalendarApp({ user, onSignOut }) {
            const [syncStatus, setSyncStatus] = useState('disconnected');
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [navDate, setNavDate] = useState(new Date());
            const [reminders, setReminders] = useState({});
            const [scratchNotes, setScratchNotes] = useState([]);
            const [quickWins, setQuickWins] = useState([]);
            const [showCompleted, setShowCompleted] = useState(true);
            const [isCreatingEvent, setIsCreatingEvent] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);
            const [selectedFolder, setSelectedFolder] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [showSearch, setShowSearch] = useState(false);
            const [winFilter, setWinFilter] = useState('all'); // all, folder, priority, date
            const [folders, setFolders] = useState([]);
            const [showFolderInput, setShowFolderInput] = useState(false);
            const [newFolderName, setNewFolderName] = useState('');
            const [newFolderType, setNewFolderType] = useState('blue');
            const [editingFolderId, setEditingFolderId] = useState(null);
            const [editFolderName, setEditFolderName] = useState('');
            const [editFolderColor, setEditFolderColor] = useState('blue');
            
            const [editingNoteId, setEditingNoteId] = useState(null); 
            const [schedulingNoteId, setSchedulingNoteId] = useState(null);
            const [tempNoteText, setTempNoteText] = useState("");
            const [tempNoteDetails, setTempNoteDetails] = useState("");
            const [newWinText, setNewWinText] = useState("");
            const [formData, setFormData] = useState({ text: "", details: "", startDate: formatKey(new Date()) });

            const editorRef = useRef(null);
            const unsubscribeRef = useRef(null);
            const menuRef = useRef(null);

            // Close menu when clicking outside
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) {
                        setMenuOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleAddFolder = () => {
                if (newFolderName.trim()) {
                    const newFolder = {
                        id: Date.now().toString(),
                        name: newFolderName,
                        type: newFolderType,
                        createdAt: new Date().toISOString()
                    };
                    setFolders(prev => [...prev, newFolder]);
                    if (user && db) {
                        saveToFirestore('folders', newFolder.id, newFolder);
                    }
                    setNewFolderName('');
                    setShowFolderInput(false);
                }
            };

            const handleDeleteFolder = (id) => {
                setFolders(prev => prev.filter(f => f.id !== id));
                if (user && db) {
                    deleteFromFirestore('folders', id);
                }
            };

            const handleStartEditFolder = (folder) => {
                setEditingFolderId(folder.id);
                setEditFolderName(folder.name);
                setEditFolderColor(folder.type);
            };

            const handleSaveEditFolder = () => {
                if (editFolderName.trim()) {
                    setFolders(prev => prev.map(f => 
                        f.id === editingFolderId 
                            ? {...f, name: editFolderName, type: editFolderColor}
                            : f
                    ));
                    if (user && db) {
                        const updatedFolder = folders.find(f => f.id === editingFolderId);
                        if (updatedFolder) {
                            saveToFirestore('folders', editingFolderId, {
                                ...updatedFolder,
                                name: editFolderName,
                                type: editFolderColor
                            });
                        }
                    }
                    setEditingFolderId(null);
                }
            };

            const handleCancelEditFolder = () => {
                setEditingFolderId(null);
                setEditFolderName('');
                setEditFolderColor('blue');
            };

            const handleOpenFolder = (folder) => {
                setSelectedFolder(folder);
                setMenuOpen(false);
            };

            const handleCloseFolder = () => {
                setSelectedFolder(null);
            };

            // Get notes for selected folder (includes both quick wins and scratch notes)
            const folderNotes = useMemo(() => {
                if (!selectedFolder) return [];
                const notes = scratchNotes.filter(note => note.folderId === selectedFolder.id)
                    .map(n => ({...n, type: 'note'}));
                const wins = quickWins.filter(win => win.folderId === selectedFolder.id)
                    .map(w => ({...w, type: 'win'}));
                return [...notes, ...wins].sort((a, b) => 
                    new Date(b.createdAt || 0) - new Date(a.createdAt || 0)
                );
            }, [selectedFolder, scratchNotes, quickWins]);

            // Search results
            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                const query = searchQuery.toLowerCase();
                
                const matchingNotes = scratchNotes
                    .filter(note => 
                        note.text.toLowerCase().includes(query) || 
                        (note.details && note.details.toLowerCase().includes(query))
                    )
                    .map(n => ({...n, type: 'note'}));
                
                const matchingWins = quickWins
                    .filter(win => 
                        win.text.toLowerCase().includes(query) || 
                        (win.details && win.details.toLowerCase().includes(query))
                    )
                    .map(w => ({...w, type: 'win'}));
                
                return [...matchingNotes, ...matchingWins];
            }, [searchQuery, scratchNotes, quickWins]);

            // Firestore Real-time Sync
            useEffect(() => {
                if (!user || !db) {
                    setSyncStatus('disconnected');
                    return;
                }

                setSyncStatus('syncing');

                const remindersUnsub = db.collection('users').doc(user.uid).collection('reminders')
                    .onSnapshot((snapshot) => {
                        const data = {};
                        snapshot.forEach(doc => {
                            data[doc.id] = doc.data().events || [];
                        });
                        setReminders(data);
                        setSyncStatus('connected');
                    }, (error) => {
                        console.error("Reminders sync error:", error);
                        setSyncStatus('disconnected');
                    });

                const scratchUnsub = db.collection('users').doc(user.uid).collection('scratchNotes')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const notes = [];
                        snapshot.forEach(doc => {
                            notes.push({ id: doc.id, ...doc.data() });
                        });
                        setScratchNotes(notes);
                    }, (error) => {
                        console.error("Scratch notes sync error:", error);
                    });

                const winsUnsub = db.collection('users').doc(user.uid).collection('quickWins')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const wins = [];
                        snapshot.forEach(doc => {
                            wins.push({ id: doc.id, ...doc.data() });
                        });
                        setQuickWins(wins);
                    }, (error) => {
                        console.error("Quick wins sync error:", error);
                    });

                const foldersUnsub = db.collection('users').doc(user.uid).collection('folders')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const folderList = [];
                        snapshot.forEach(doc => {
                            folderList.push({ id: doc.id, ...doc.data() });
                        });
                        setFolders(folderList);
                    }, (error) => {
                        console.error("Folders sync error:", error);
                    });

                unsubscribeRef.current = () => {
                    remindersUnsub();
                    scratchUnsub();
                    winsUnsub();
                    foldersUnsub();
                };

                return () => {
                    if (unsubscribeRef.current) unsubscribeRef.current();
                };
            }, [user]);

            const execCommand = useCallback((cmd, val = null) => {
                document.execCommand(cmd, false, val);
                if (editorRef.current) editorRef.current.focus();
            }, []);

            const currentKey = formatKey(selectedDate);
            
            const activeWins = useMemo(() => {
                let filtered = quickWins.filter(w => !w.completed);
                
                // Apply sorting based on filter
                if (winFilter === 'priority') {
                    filtered.sort((a, b) => (a.priority || '3').localeCompare(b.priority || '3'));
                } else if (winFilter === 'date') {
                    // Check if task is scheduled
                    const getEarliestDate = (winId) => {
                        const dates = Object.entries(reminders)
                            .filter(([date, events]) => events.some(e => e.linkedNoteId === winId))
                            .map(([date]) => new Date(date));
                        return dates.length > 0 ? Math.min(...dates) : Infinity;
                    };
                    filtered.sort((a, b) => getEarliestDate(a.id) - getEarliestDate(b.id));
                } else if (winFilter === 'folder') {
                    filtered.sort((a, b) => {
                        const folderA = a.folderId ? folders.find(f => f.id === a.folderId)?.name || '' : 'zzz';
                        const folderB = b.folderId ? folders.find(f => f.id === b.folderId)?.name || '' : 'zzz';
                        return folderA.localeCompare(folderB);
                    });
                }
                
                return filtered;
            }, [quickWins, winFilter, reminders, folders]);
            
            // Group wins by folder for folder view
            const groupedByFolder = useMemo(() => {
                if (winFilter !== 'folder') return null;
                
                const groups = {};
                const unsorted = [];
                
                activeWins.forEach(win => {
                    if (win.folderId) {
                        const folder = folders.find(f => f.id === win.folderId);
                        if (folder) {
                            if (!groups[folder.id]) {
                                groups[folder.id] = { folder, wins: [] };
                            }
                            groups[folder.id].wins.push(win);
                        } else {
                            unsorted.push(win);
                        }
                    } else {
                        unsorted.push(win);
                    }
                });
                
                // Sort groups alphabetically by folder name
                const sortedGroups = Object.values(groups).sort((a, b) => 
                    a.folder.name.localeCompare(b.folder.name)
                );
                
                // Add unsorted group at the end if it has items
                if (unsorted.length > 0) {
                    sortedGroups.push({ folder: { name: 'Unsorted', id: 'unsorted' }, wins: unsorted });
                }
                
                return sortedGroups;
            }, [activeWins, winFilter, folders]);
            
            const completedWins = useMemo(() => 
                quickWins.filter(w => w.completed), 
                [quickWins]
            );
            
            const dailyAgenda = useMemo(() => 
                reminders[currentKey] || [], 
                [reminders, currentKey]
            );

            const saveToFirestore = useCallback((collection, docId, data) => {
                if (!user || !db) {
                    console.warn('âš ï¸ Firebase not configured - data will not persist!');
                    console.warn('Please complete Firebase setup:');
                    console.warn('1. Enable Email/Password Authentication');
                    console.warn('2. Create Firestore Database');
                    console.warn('3. Set Security Rules');
                    return;
                }
                
                setSyncStatus('syncing');
                db.collection('users').doc(user.uid).collection(collection).doc(docId)
                    .set(data, { merge: true })
                    .then(() => {
                        console.log(`âœ“ Saved ${collection}/${docId} to Firebase`);
                        setSyncStatus('connected');
                    })
                    .catch((error) => {
                        console.error(`âœ— Error saving to ${collection}:`, error);
                        console.error('Check that Firestore is enabled and rules are set correctly');
                        setSyncStatus('disconnected');
                    });
            }, [user]);

            const deleteFromFirestore = useCallback((collection, docId) => {
                if (!user || !db) return;
                
                setSyncStatus('syncing');
                db.collection('users').doc(user.uid).collection(collection).doc(docId)
                    .delete()
                    .then(() => setSyncStatus('connected'))
                    .catch((error) => {
                        console.error(`Error deleting from ${collection}:`, error);
                        setSyncStatus('disconnected');
                    });
            }, [user]);

            const handleWinToggle = useCallback((id) => {
                setQuickWins(prev => {
                    const updated = prev.map(w => 
                        w.id === id ? {...w, completed: !w.completed} : w
                    );
                    const item = updated.find(w => w.id === id);
                    if (item && user && db) {
                        saveToFirestore('quickWins', id, item);
                    }
                    return updated;
                });
            }, [user, saveToFirestore]);

            const handleWinDelete = useCallback((id) => {
                setQuickWins(prev => prev.filter(w => w.id !== id));
                deleteFromFirestore('quickWins', id);
            }, [deleteFromFirestore]);

            const handleWinStartEdit = useCallback((id, text, details) => {
                setEditingNoteId(id);
                setTempNoteText(text);
                setTempNoteDetails(details);
                // Find the win's current folder and priority
                const win = quickWins.find(w => w.id === id);
                setFormData(prev => ({
                    ...prev, 
                    folderId: win?.folderId || '',
                    priority: win?.priority || '3'
                }));
            }, [quickWins]);

            const handleWinSaveEdit = useCallback((id, text, details) => {
                setQuickWins(prev => {
                    const updated = prev.map(w => 
                        w.id === id ? {
                            ...w, 
                            text, 
                            details, 
                            folderId: formData.folderId || null,
                            priority: formData.priority || '3'
                        } : w
                    );
                    const item = updated.find(w => w.id === id);
                    if (item && user && db) {
                        saveToFirestore('quickWins', id, item);
                    }
                    return updated;
                });
                setEditingNoteId(null);
            }, [user, saveToFirestore, formData]);

            const handleWinCancelEdit = useCallback(() => {
                setEditingNoteId(null);
            }, []);

            const handleWinStartSchedule = useCallback((id) => {
                setSchedulingNoteId(id);
                setEditingNoteId(null);
            }, []);

            const handleWinScheduleConfirm = useCallback((item, targetDate) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    const list = updated[targetDate] || [];
                    const newEvent = { 
                        id: Date.now(), 
                        text: item.text, 
                        notes: item.details, 
                        startDate: targetDate, 
                        type: 'win',
                        linkedNoteId: item.id
                    };
                    list.push(newEvent);
                    updated[targetDate] = list;
                    
                    if (user && db) {
                        saveToFirestore('reminders', targetDate, { events: list });
                    }
                    return updated;
                });
                setSchedulingNoteId(null);
            }, [user, saveToFirestore]);

            const handleNoteDelete = useCallback((id) => {
                setScratchNotes(prev => prev.filter(n => n.id !== id));
                deleteFromFirestore('scratchNotes', id);
            }, [deleteFromFirestore]);

            const handleNoteStartEdit = useCallback((id, text, details) => {
                setEditingNoteId(id);
                setSchedulingNoteId(null);
                setTempNoteText(text);
                setTempNoteDetails(details);
                // Find the note's current folder
                const note = scratchNotes.find(n => n.id === id);
                setFormData(prev => ({...prev, folderId: note?.folderId || ''}));
            }, [scratchNotes]);

            const handleNoteSaveEdit = useCallback((id, text, details) => {
                setScratchNotes(prev => {
                    const updated = prev.map(n => 
                        n.id === id ? {...n, text, details, folderId: formData.folderId || null} : n
                    );
                    const item = updated.find(n => n.id === id);
                    if (item && user && db) {
                        saveToFirestore('scratchNotes', id, item);
                    }
                    return updated;
                });
                
                setReminders(prev => {
                    const updated = { ...prev };
                    let hasChanges = false;
                    
                    Object.keys(updated).forEach(dateKey => {
                        updated[dateKey] = updated[dateKey].map(event => {
                            if (event.linkedNoteId === id) {
                                hasChanges = true;
                                return { ...event, text, notes: details };
                            }
                            return event;
                        });
                        
                        if (hasChanges && user && db) {
                            saveToFirestore('reminders', dateKey, { events: updated[dateKey] });
                        }
                    });
                    
                    return updated;
                });
                
                setEditingNoteId(null);
            }, [user, saveToFirestore, formData]);

            const handleNoteStartSchedule = useCallback((id, text, details) => {
                setEditingNoteId(null);
                setSchedulingNoteId(id);
                setFormData(prev => ({...prev, text, details}));
            }, []);

            const handleNoteScheduleConfirm = useCallback((note, targetDate) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    const list = updated[targetDate] || [];
                    const newEvent = { 
                        id: Date.now(), 
                        text: note.text, 
                        notes: note.details, 
                        startDate: targetDate, 
                        type: 'note',
                        linkedNoteId: note.id
                    };
                    list.push(newEvent);
                    updated[targetDate] = list;
                    
                    if (user && db) {
                        saveToFirestore('reminders', targetDate, { events: list });
                    }
                    return updated;
                });
                setSchedulingNoteId(null);
            }, [user, saveToFirestore]);

            const handleAgendaStartEdit = useCallback((id, text, notes) => {
                setEditingNoteId(id);
                setTempNoteText(text);
                setTempNoteDetails(notes || "");
            }, []);

            const handleAgendaSaveEdit = useCallback((id, text, notes) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    updated[currentKey] = updated[currentKey].map(item => 
                        item.id === id ? { ...item, text, notes } : item
                    );
                    
                    if (user && db) {
                        saveToFirestore('reminders', currentKey, { events: updated[currentKey] });
                    }
                    return updated;
                });
                setEditingNoteId(null);
            }, [currentKey, user, saveToFirestore]);

            const handleAgendaDelete = useCallback((id) => {
                setReminders(prev => {
                    const updated = { ...prev };
                    updated[currentKey] = updated[currentKey].filter(item => item.id !== id);
                    
                    if (user && db) {
                        saveToFirestore('reminders', currentKey, { events: updated[currentKey] });
                    }
                    return updated;
                });
            }, [currentKey, user, saveToFirestore]);

            const handleAddWin = useCallback((text) => {
                const newWin = { 
                    id: Date.now().toString(), 
                    text, 
                    details: "", 
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                setQuickWins(prev => [newWin, ...prev]);
                
                if (user && db) {
                    saveToFirestore('quickWins', newWin.id, newWin);
                }
            }, [user, saveToFirestore]);

            const handleAddNote = useCallback((text) => {
                const newNote = {
                    text,
                    details: "",
                    id: Date.now().toString(),
                    createdAt: new Date().toISOString()
                };
                
                setScratchNotes(prev => [newNote, ...prev]);
                
                if (user && db) {
                    saveToFirestore('scratchNotes', newNote.id, newNote);
                }
            }, [user, saveToFirestore]);

            const calendarDays = useMemo(() => {
                const year = navDate.getFullYear(); 
                const month = navDate.getMonth(); 
                const firstDay = new Date(year, month, 1).getDay(); 
                const daysInMonth = new Date(year, month + 1, 0).getDate(); 
                const days = [];
                
                for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} />);
                
                for (let i = 1; i <= daysInMonth; i++) {
                    const d = new Date(year, month, i); 
                    const k = formatKey(d);
                    const hasWin = reminders[k] && reminders[k].some(r => r.type === 'win');
                    const hasNote = reminders[k] && reminders[k].some(r => r.type === 'note' || !r.type);
                    
                    days.push(
                        <div key={i} className="relative">
                            <button 
                                onClick={() => setSelectedDate(d)} 
                                onDoubleClick={() => {
                                    setSelectedDate(d);
                                    setTempNoteText("");
                                    setTempNoteDetails("");
                                    setIsCreatingEvent(true);
                                }}
                                className={`w-full aspect-square text-[9px] font-bold rounded-md flex flex-col items-center justify-center transition-all ${formatKey(selectedDate) === k ? 'bg-gray-900 text-white' : 'hover:bg-gray-50 text-gray-500'}`}
                            >
                                {i}
                                <div className="flex gap-0.5 mt-0.5">
                                    {hasWin && <div className="w-1 h-1 rounded-full bg-blue-500" />}
                                    {hasNote && <div className="w-1 h-1 rounded-full bg-pink-500" />}
                                </div>
                            </button>

                            {isCreatingEvent && formatKey(selectedDate) === k && (
                                <div className="absolute top-0 left-full ml-2 w-48 bg-white border-2 border-pink-500 shadow-2xl rounded-2xl p-3 z-[110] animate-pop text-black">
                                    <p className="text-[8px] font-black text-pink-500 uppercase mb-2">New Event: {k}</p>
                                    <input 
                                        autoFocus
                                        placeholder="Event Title"
                                        className="w-full text-[10px] font-bold p-2 bg-gray-50 rounded-lg mb-2 outline-none border border-transparent focus:border-pink-200"
                                        value={tempNoteText}
                                        onChange={e => setTempNoteText(e.target.value)}
                                    />
                                    <textarea 
                                        placeholder="Details..."
                                        className="w-full text-[9px] p-2 bg-gray-50 rounded-lg mb-3 outline-none min-h-[60px] resize-none"
                                        value={tempNoteDetails}
                                        onChange={e => setTempNoteDetails(e.target.value)}
                                    />
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => {
                                                if(!tempNoteText) return;
                                                setReminders(prev => {
                                                    const updated = { ...prev };
                                                    const list = updated[k] || [];
                                                    const newEvent = { 
                                                        id: Date.now(), 
                                                        text: tempNoteText, 
                                                        notes: tempNoteDetails, 
                                                        startDate: k, 
                                                        type: 'note' 
                                                    };
                                                    list.push(newEvent);
                                                    updated[k] = list;
                                                    
                                                    if (user && db) {
                                                        saveToFirestore('reminders', k, { events: list });
                                                    }
                                                    return updated;
                                                });
                                                setIsCreatingEvent(false);
                                                setTempNoteText("");
                                                setTempNoteDetails("");
                                            }}
                                            className="flex-grow bg-pink-500 text-white text-[8px] font-black uppercase py-1.5 rounded-lg"
                                        >
                                            Create
                                        </button>
                                        <button 
                                            onClick={() => setIsCreatingEvent(false)} 
                                            className="bg-gray-100 text-gray-400 text-[8px] font-black uppercase px-2 py-1.5 rounded-lg"
                                        >
                                            Ã—
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }
                return days;
            }, [navDate, reminders, selectedDate, isCreatingEvent, tempNoteText, tempNoteDetails, user, saveToFirestore]);

            return (
                <>
                    {/* Hamburger Menu */}
                    <div ref={menuRef} className="fixed top-6 left-6 z-[2000] flex gap-3">
                        <button
                            onClick={() => setMenuOpen(!menuOpen)}
                            className="relative bg-white rounded-2xl p-4 shadow-lg border-2 border-gray-100 hover:border-gray-200 transition-all"
                        >
                            {/* Online Status Dot */}
                            <div className={`absolute -top-1 -right-1 w-3 h-3 rounded-full border-2 border-white ${
                                syncStatus === 'connected' ? 'bg-green-500' :
                                syncStatus === 'syncing' ? 'bg-orange-500' :
                                'bg-red-500'
                            }`} />
                            
                            {/* Hamburger Icon */}
                            <div className="space-y-1.5">
                                <div className="w-6 h-6 bg-gray-900"></div>
                                <div className="w-6 h-0.5 bg-gray-900"></div>
                                <div className="w-6 h-0.5 bg-gray-900"></div>
                            </div>
                        </button>

                        {/* Search Button */}
                        <button
                            onClick={() => setShowSearch(!showSearch)}
                            className="bg-white rounded-2xl p-4 shadow-lg border-2 border-gray-100 hover:border-gray-200 transition-all"
                        >
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-gray-900">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </button>

                        {/* Menu Dropdown */}
                        {menuOpen && (
                            <div className="absolute top-full left-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border-2 border-gray-100 overflow-hidden animate-pop">
                                {/* Status Header */}
                                <div className="p-4 bg-gray-50 border-b border-gray-100">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-2 h-2 rounded-full ${
                                            syncStatus === 'connected' ? 'bg-green-500' :
                                            syncStatus === 'syncing' ? 'bg-orange-500 animate-pulse' :
                                            'bg-red-500'
                                        }`} />
                                        <div>
                                            <p className="text-xs font-black uppercase tracking-wider text-gray-900">
                                                {syncStatus === 'connected' ? 'Online' :
                                                syncStatus === 'syncing' ? 'Syncing' :
                                                'Offline'}
                                            </p>
                                            <p className="text-[10px] text-gray-500 truncate">{user.email}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Folders Section */}
                                <div className="p-4 max-h-96 overflow-y-auto custom-scroll">
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="text-xs font-black uppercase tracking-wider text-gray-600">Folders</h3>
                                        <button
                                            onClick={() => setShowFolderInput(!showFolderInput)}
                                            className="text-blue-600 hover:text-blue-700 font-black text-lg leading-none"
                                        >
                                            +
                                        </button>
                                    </div>

                                    {showFolderInput && (
                                        <div className="mb-4 p-3 bg-gray-50 rounded-xl space-y-2">
                                            <input
                                                type="text"
                                                placeholder="Folder name"
                                                value={newFolderName}
                                                onChange={(e) => setNewFolderName(e.target.value)}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter') handleAddFolder();
                                                }}
                                                className="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-500"
                                                autoFocus
                                            />
                                            <div>
                                                <label className="block text-[9px] font-black uppercase tracking-wider text-gray-600 mb-2">
                                                    Folder Color
                                                </label>
                                                <div className="grid grid-cols-6 gap-2">
                                                    {['blue', 'purple', 'pink', 'red', 'orange', 'green'].map(color => (
                                                        <button
                                                            key={color}
                                                            onClick={() => setNewFolderType(color)}
                                                            className={`w-8 h-8 rounded-lg transition-all ${
                                                                newFolderType === color ? 'ring-2 ring-offset-2 ring-gray-900' : ''
                                                            } ${
                                                                color === 'blue' ? 'bg-blue-500' :
                                                                color === 'purple' ? 'bg-purple-500' :
                                                                color === 'pink' ? 'bg-pink-500' :
                                                                color === 'red' ? 'bg-red-500' :
                                                                color === 'orange' ? 'bg-orange-500' :
                                                                'bg-green-500'
                                                            }`}
                                                        />
                                                    ))}
                                                </div>
                                            </div>
                                            <button
                                                onClick={handleAddFolder}
                                                className="w-full bg-gray-900 text-white py-2 rounded-lg text-xs font-black uppercase"
                                            >
                                                Create Folder
                                            </button>
                                        </div>
                                    )}

                                        {folders.map(folder => {
                                            const noteCount = scratchNotes.filter(n => n.folderId === folder.id).length;
                                            const winCount = quickWins.filter(w => w.folderId === folder.id).length;
                                            const totalCount = noteCount + winCount;
                                            
                                            const colorClasses = {
                                                blue: 'bg-blue-500',
                                                purple: 'bg-purple-500',
                                                pink: 'bg-pink-500',
                                                red: 'bg-red-500',
                                                orange: 'bg-orange-500',
                                                green: 'bg-green-500'
                                            };
                                            
                                            return (
                                                <div key={folder.id}>
                                                    {editingFolderId === folder.id ? (
                                                        // Edit Mode
                                                        <div className="p-3 bg-white rounded-xl border-2 border-blue-500 space-y-2">
                                                            <input
                                                                type="text"
                                                                value={editFolderName}
                                                                onChange={(e) => setEditFolderName(e.target.value)}
                                                                className="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-500"
                                                                autoFocus
                                                            />
                                                            <div>
                                                                <label className="block text-[9px] font-black uppercase tracking-wider text-gray-600 mb-2">
                                                                    Folder Color
                                                                </label>
                                                                <div className="grid grid-cols-6 gap-2">
                                                                    {['blue', 'purple', 'pink', 'red', 'orange', 'green'].map(color => (
                                                                        <button
                                                                            key={color}
                                                                            onClick={() => setEditFolderColor(color)}
                                                                            className={`w-6 h-6 rounded-lg transition-all ${
                                                                                editFolderColor === color ? 'ring-2 ring-offset-1 ring-gray-900' : ''
                                                                            } ${
                                                                                color === 'blue' ? 'bg-blue-500' :
                                                                                color === 'purple' ? 'bg-purple-500' :
                                                                                color === 'pink' ? 'bg-pink-500' :
                                                                                color === 'red' ? 'bg-red-500' :
                                                                                color === 'orange' ? 'bg-orange-500' :
                                                                                'bg-green-500'
                                                                            }`}
                                                                        />
                                                                    ))}
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button
                                                                    onClick={handleSaveEditFolder}
                                                                    className="flex-1 bg-blue-600 text-white py-1.5 rounded-lg text-xs font-black uppercase"
                                                                >
                                                                    Save
                                                                </button>
                                                                <button
                                                                    onClick={handleCancelEditFolder}
                                                                    className="flex-1 bg-gray-200 text-gray-600 py-1.5 rounded-lg text-xs font-black uppercase"
                                                                >
                                                                    Cancel
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        // View Mode
                                                        <div
                                                            onClick={() => handleOpenFolder(folder)}
                                                            className="flex items-center justify-between p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition-all group cursor-pointer"
                                                        >
                                                            <div className="flex items-center gap-3 flex-grow min-w-0">
                                                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${colorClasses[folder.type] || 'bg-gray-400'}`}>
                                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                                                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                                                    </svg>
                                                                </div>
                                                                <div className="min-w-0 flex-grow">
                                                                    <p className="text-sm font-bold text-gray-900 truncate">{folder.name}</p>
                                                                    <p className="text-[10px] text-gray-500 uppercase">{totalCount} items</p>
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-1 opacity-0 group-hover:opacity-100 shrink-0">
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        handleStartEditFolder(folder);
                                                                    }}
                                                                    className="p-1.5 text-gray-400 hover:text-blue-500 transition-all"
                                                                    title="Edit folder"
                                                                >
                                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                                    </svg>
                                                                </button>
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        handleDeleteFolder(folder.id);
                                                                    }}

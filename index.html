<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Follow-Up Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
:root{
  --ink:#1B2A41;
  --ink-2:#24344F;
  --ink-3:#33465F;
  --paper:#F6F7F9;
  --card:#FFFFFF;
  --line:#DCE2EA;
  --text:#22303F;
  --muted:#68788C;
  --red:#C2453B;
  --red-bg:#FBEEEC;
  --amber:#B97B14;
  --amber-bg:#FCF3E1;
  --green:#2E7D5B;
  --green-bg:#E8F4EE;
  --blue:#3A6EA5;
  --blue-bg:#EAF1F8;
  --gray-bg:#EEF1F5;
  --accent:#E8A13D;
  --radius:10px;
  --shadow:0 1px 3px rgba(27,42,65,.10),0 4px 14px rgba(27,42,65,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--text);
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
.display{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:210px 1fr;height:100dvh}
.rail{
  background:var(--ink);color:#E7ECF3;display:flex;flex-direction:column;
  padding:18px 12px calc(14px + env(safe-area-inset-bottom));
}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.brand h1{font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:1.05}
.brand .sub{font-size:11px;color:#93A3B8;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:8px;
  font-size:14.5px;font-weight:500;color:#C4CFDD;margin-bottom:3px;text-align:left;
}
.navbtn .ico{width:20px;text-align:center;font-size:16px}
.navbtn .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:20px;padding:2px 8px;min-width:24px;text-align:center}
.navbtn.active{background:var(--ink-3);color:#fff}
.navbtn.active .cnt{background:var(--accent);color:#33270D}
.navbtn:hover{background:var(--ink-2)}
.rail .spacer{flex:1}
.syncline{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12px;color:#93A3B8}
.dot{width:8px;height:8px;border-radius:50%;background:#6B7A8F;flex-shrink:0}
.dot.ok{background:#4CC38A}.dot.err{background:#E5534B}.dot.pending{background:var(--accent)}

.main{display:flex;flex-direction:column;min-width:0;height:100dvh}
.topbar{
  display:flex;align-items:center;gap:12px;padding:16px 22px 12px;background:var(--paper);
  position:sticky;top:0;z-index:5;
}
.topbar h2{font-family:'Barlow Condensed';font-weight:700;font-size:27px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.topbar .datebadge{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.topbar .grow{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);flex-shrink:0;
}
.iconbtn:hover{background:var(--gray-bg)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 22px 110px;-webkit-overflow-scrolling:touch}

/* ---------- Sections ---------- */
.sect{margin-top:20px}
.eyebrow{
  display:flex;align-items:center;gap:9px;font-family:'Barlow Condensed';font-weight:600;font-size:15px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:9px;
}
.eyebrow .num{font-weight:700;font-size:13px;border-radius:14px;padding:1px 8px;background:var(--gray-bg);color:var(--text)}
.eyebrow.hot{color:var(--red)}.eyebrow.hot .num{background:var(--red-bg);color:var(--red)}
.eyebrow.warm{color:var(--amber)}.eyebrow.warm .num{background:var(--amber-bg);color:var(--amber)}
.eyebrow.good{color:var(--green)}.eyebrow.good .num{background:var(--green-bg);color:var(--green)}
.eyebrow .rule{flex:1;height:1px;background:var(--line)}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px;margin-bottom:9px;cursor:pointer;
}
.card:active{transform:scale(.995)}
.card.s-new{border-left-color:#8A97A8}
.card.s-delegated,.card.s-waiting{border-left-color:var(--blue)}
.card.s-ready{border-left-color:var(--green)}
.card.overdue{border-left-color:var(--red)}
.card .titlerow{display:flex;align-items:flex-start;gap:10px}
.card .t{font-weight:600;font-size:15.5px;line-height:1.3;flex:1;color:var(--ink)}
.card .metarow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3.5px 9px;border-radius:6px;background:var(--gray-bg);color:var(--muted);white-space:nowrap;
}
.chip.person{background:var(--ink);color:#fff}
.chip.stamp{font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:700;border:1.5px solid currentColor;background:transparent}
.chip.stamp.new{color:#66758A}
.chip.stamp.delegated{color:var(--blue)}
.chip.stamp.waiting{color:var(--blue)}
.chip.stamp.ready{color:var(--green)}
.chip.stamp.closed{color:#8A97A8}
.chip.due{background:var(--gray-bg)}
.chip.due.today{background:var(--amber-bg);color:var(--amber)}
.chip.due.late{background:var(--red-bg);color:var(--red)}
.chip.hi{background:var(--red-bg);color:var(--red)}
.card .lastupd{
  margin-top:9px;font-size:13px;color:var(--muted);line-height:1.45;
  border-top:1px dashed var(--line);padding-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .lastupd b{color:var(--text);font-weight:600}
.qactions{display:flex;gap:6px;margin-top:10px}
.qbtn{
  font-size:12.5px;font-weight:600;padding:6.5px 11px;border-radius:7px;
  background:var(--gray-bg);color:var(--ink);
}
.qbtn:hover{background:var(--line)}
.qbtn.grn{background:var(--green-bg);color:var(--green)}
.qbtn.amb{background:var(--amber-bg);color:var(--amber)}

.empty{
  text-align:center;padding:34px 20px;color:var(--muted);font-size:14px;background:var(--card);
  border:1.5px dashed var(--line);border-radius:var(--radius);line-height:1.6;
}
.empty .big{font-size:30px;margin-bottom:6px}

/* ---------- Meeting mode ---------- */
.meetrow{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:15px 17px;margin-bottom:10px;cursor:pointer;border-left:4px solid var(--line);
}
.meetrow.s-ready{border-left-color:var(--green)}
.meetrow.overdue{border-left-color:var(--red)}
.meetrow.s-delegated,.meetrow.s-waiting{border-left-color:var(--blue)}
.meetrow .t{font-size:17.5px;font-weight:700;color:var(--ink);line-height:1.3}
.meetrow .say{
  margin-top:8px;font-size:15px;line-height:1.5;color:var(--text);
  background:var(--paper);border-radius:8px;padding:9px 12px;
}
.meetrow .say .lbl{
  font-family:'Barlow Condensed';font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px;
}
.meetrow .metarow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.searchwrap{position:relative;margin-top:14px}
.searchwrap input{
  width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:15px;
}
.searchwrap .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* ---------- People ---------- */
.persongroup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.personhead{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.avatar{
  width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.03em;flex-shrink:0;
}
.personhead .nm{font-weight:700;font-size:15.5px;color:var(--ink)}
.personhead .st{font-size:12.5px;color:var(--muted);margin-top:1px}
.personhead .st .late{color:var(--red);font-weight:600}
.nudgebtn{
  margin-left:auto;font-size:13px;font-weight:700;padding:8px 13px;border-radius:8px;
  background:var(--accent);color:#33270D;flex-shrink:0;
}
.personitems{padding:9px 15px 4px}
.pitem{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14px}
.pitem:last-child{border-bottom:none}
.pitem .age{font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;min-width:34px}
.pitem .age.late{color:var(--red)}
.pitem .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:22px;bottom:24px;z-index:40;width:58px;height:58px;border-radius:16px;
  background:var(--accent);color:#33270D;font-size:28px;font-weight:600;box-shadow:0 6px 20px rgba(27,42,65,.3);
  display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.96)}

/* ---------- Modals ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(19,29,45,.55);z-index:60;display:none;
  align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:620px;max-height:92dvh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:768px){
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:16px;padding-bottom:24px}
}
.sheethead{display:flex;align-items:center;margin-bottom:16px}
.sheethead h3{font-family:'Barlow Condensed';font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.xbtn{margin-left:auto;width:34px;height:34px;border-radius:8px;background:var(--gray-bg);font-size:16px;color:var(--muted)}
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-family:'Barlow Condensed';font-size:13.5px}
.f input,.f select,.f textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.frow{display:flex;gap:11px}
.frow .f{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  padding:8.5px 13px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:#fff;color:var(--muted);
}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.primary{
  width:100%;padding:14px;border-radius:10px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;margin-top:6px;
}
.primary:active{opacity:.9}
.primary.warn{background:var(--red)}
.ghost{width:100%;padding:12px;border-radius:10px;background:var(--gray-bg);color:var(--ink);font-size:14px;font-weight:600;margin-top:8px}

/* ---------- Detail sheet ---------- */
.detailtop{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.updline{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.5}
.updline .when{color:var(--muted);font-size:11.5px;flex-shrink:0;min-width:62px;padding-top:2px;font-weight:600}
.updbox{display:flex;gap:8px;margin-top:12px}
.updbox input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:9px}
.updbox button{padding:0 16px;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.bumpsrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- Setup screen ---------- */
.setup{
  position:fixed;inset:0;background:var(--ink);z-index:100;display:none;align-items:center;justify-content:center;padding:22px;
}
.setup.open{display:flex}
.setupcard{background:var(--card);border-radius:16px;padding:28px 24px;max-width:440px;width:100%}
.setupcard h2{font-family:'Barlow Condensed';font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);line-height:1.1}
.setupcard p{font-size:14px;color:var(--muted);line-height:1.6;margin:12px 0 18px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Calendar ---------- */
.content.calmode{padding:4px 16px 16px;display:flex;flex-direction:column;overflow:hidden}
.cv{flex:1;display:flex;flex-direction:column;min-height:0}
.cv-head{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}
.cv-mon{font-family:'Barlow Condensed';font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);line-height:1}
.cv-mon span{color:var(--muted);font-weight:500}
.cv-stats{display:flex;gap:6px;margin-left:6px}
.cv-head .grow{flex:1}
.cv-btn{height:36px;min-width:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;padding:0 10px}
.cv-btn:hover{background:var(--gray-bg)}
.cv-body{flex:1;display:flex;gap:14px;min-height:0}
.cv-gridwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.cv-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cv-dow span{font-family:'Barlow Condensed';font-size:12.5px;font-weight:600;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;padding:2px 8px}
.cv-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:5px;min-height:0}
.cv-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.cv-cell:hover{border-color:#AFBDCF;box-shadow:var(--shadow)}
.cv-cell.dim{opacity:.42}
.cv-cell.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cv-dnum{font-size:12.5px;font-weight:600;color:var(--muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.cv-cell.today .cv-dnum{background:var(--ink);color:#fff;font-weight:700}
.cv-pills{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.cv-pill{font-size:11px;font-weight:600;line-height:1.25;padding:3px 7px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;flex-shrink:0}
.cv-pill:hover{filter:brightness(.96)}
.cv-pill.fu{background:var(--amber-bg);color:#8A5C0E;border-color:var(--amber)}
.cv-pill.due{background:var(--blue-bg);color:#2B517A;border-color:var(--blue)}
.cv-pill.late{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.cv-more{font-size:10.5px;font-weight:700;color:var(--muted);padding:1px 7px;flex-shrink:0}
.cv-agenda{width:332px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;overflow-y:auto}
.cv-aghead{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.cv-agsub{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.cv-agenda .card{box-shadow:none}
@keyframes cvL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes cvR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.cv-grid.animL{animation:cvL .22s ease-out}
.cv-grid.animR{animation:cvR .22s ease-out}
@media(max-width:1000px){.cv-agenda{display:none}}
@media(max-width:767px){
  .content.calmode{padding:4px 10px calc(72px + env(safe-area-inset-bottom))}
  .cv-mon{font-size:23px}
  .cv-stats{display:none}
  .cv-grid{gap:4px}
  .cv-cell{padding:4px 3px;border-radius:8px;gap:2px}
  .cv-pill{font-size:9px;padding:2px 4px;border-left-width:2px;border-radius:4px}
  .cv-more{font-size:9px;padding:0 4px}
  .cv-dnum{width:20px;height:20px;font-size:11px}
  .cv-dow span{padding:2px 3px;font-size:10.5px}
}

/* ---------- Mobile ---------- */
.bottombar{display:none}
@media(max-width:767px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .content{padding:4px 14px 130px}
  .topbar{padding:14px 14px 10px}
  .bottombar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .bottombar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
    color:#93A3B8;font-size:10.5px;font-weight:600;border-radius:9px;position:relative;
  }
  .bottombar button .ico{font-size:19px}
  .bottombar button.active{color:#fff}
  .bottombar button .bdg{
    position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;
    font-size:9.5px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px;
  }
  .fab{bottom:calc(74px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- Setup screen (first run) -->
<div class="setup" id="setup">
  <div class="setupcard">
    <h2>Follow-Up Tracker</h2>
    <p>Pick a <b>sync code</b> — any word or phrase you'll remember (like <i>jax-tracker-2026</i>). Enter the <b>same code</b> on your phone and computer and they'll stay in sync automatically.</p>
    <div class="f">
      <label>Sync code</label>
      <input type="text" id="setup-code" placeholder="e.g. jax-tracker-2026" autocomplete="off">
    </div>
    <button class="primary" onclick="finishSetup()">Start tracking</button>
  </div>
</div>

<div class="app">
  <!-- Desktop rail -->
  <nav class="rail">
    <div class="brand"><h1>Follow-Up<br>Tracker</h1><div class="sub">Work order desk</div></div>
    <button class="navbtn" data-v="today" onclick="setView('today')"><span class="ico">&#9728;</span>Today<span class="cnt" id="rc-today">0</span></button>
    <button class="navbtn" data-v="meeting" onclick="setView('meeting')"><span class="ico">&#128227;</span>Meeting Mode<span class="cnt" id="rc-meeting">0</span></button>
    <button class="navbtn" data-v="cal" onclick="setView('cal')"><span class="ico">&#128197;</span>Calendar</button>
    <button class="navbtn" data-v="people" onclick="setView('people')"><span class="ico">&#128101;</span>My Team<span class="cnt" id="rc-people">0</span></button>
    <button class="navbtn" data-v="all" onclick="setView('all')"><span class="ico">&#128203;</span>All Items<span class="cnt" id="rc-all">0</span></button>
    <div class="spacer"></div>

<div class="toast" id="toast"></div>
<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyC21uDcMLyGso3kLqBYimTL8loUi5zzLjw",
  authDomain: "nova-quick.firebaseapp.com",
  projectId: "nova-quick",
  storageBucket: "nova-quick.firebasestorage.app",
  messagingSenderId: "914595554926",
  appId: "1:914595554926:web:e19d4fc962794d9e9aa87f"
};
let db = null, unsub = null, firebaseOk = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseOk = true;
} catch (e) { console.error("Firebase init failed:", e); }

/* ================= State ================= */
let state = { orders: [], people: [] };
let workspace = null;
let currentView = 'today';
let detailId = null;
let editId = null;
let nudgeCtx = null;
let showClosed = false;
let applyingRemote = false;
let saveTimer = null;

const STATUS_LABEL = { new:'New', delegated:'Delegated', waiting:'Waiting on update', ready:'Ready to report', closed:'Closed' };

/* ================= Storage helpers ================= */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

/* ================= Date helpers ================= */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysStr(base, n){ const p=base.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nextMondayStr(){ const d=new Date(); const add=((8-d.getDay())%7)||7; return addDaysStr(todayStr(), add); }
function fmtDate(s){ if(!s) return ''; const p=s.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function daysDiff(s){ if(!s) return null; const p=s.split('-'); const a=new Date(+p[0],+p[1]-1,+p[2]); const t=new Date(); const b=new Date(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((b-a)/86400000); }
function ageDays(ts){ return Math.max(0, Math.floor((Date.now()-ts)/86400000)); }
function fmtWhen(ts){ const d=new Date(ts); const now=new Date(); const sameDay=d.toDateString()===now.toDateString(); if(sameDay) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function displayTitle(o){ const wo=o.woNum? 'WO #'+o.woNum : ''; if(wo && o.title) return wo+' \u2014 '+o.title; return wo || o.title || '(untitled)'; }
function locStr(o){ const p=[]; if(o.building) p.push('Bldg '+o.building); if(o.floor) p.push('Fl '+o.floor); if(o.room) p.push('Rm '+o.room); return p.join(' \u00b7 '); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= Derived ================= */
function openOrders(){ return state.orders.filter(o=>o.status!=='closed'); }
function isOverdue(o){ const d=daysDiff(o.followUp); return o.status!=='closed' && d!==null && d>0; }
function isChaseToday(o){ const d=daysDiff(o.followUp); return o.status!=='closed' && d===0; }
function updatedLast24h(o){ return (o.updates||[]).some(u=>Date.now()-u.ts < 86400000); }
function lastUpdate(o){ const u=o.updates||[]; return u.length?u[u.length-1]:null; }
function sortKey(o){ const d=daysDiff(o.followUp); const late=(d!==null&&d>0)?0:1; const hi=o.priority==='high'?0:1; return [late,hi,-(d==null?-9999:d)]; }
function sortOrders(list){ return list.slice().sort((a,b)=>{ const ka=sortKey(a),kb=sortKey(b); for(let i=0;i<3;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; } return (b.createdAt||0)-(a.createdAt||0); }); }

/* ================= Sync ================= */
function setSync(cls, txt, help){
  const dot=document.getElementById('syncdot');
  dot.className='dot '+cls;
  document.getElementById('synctext').textContent=txt;
  document.getElementById('s-syncstate').textContent=txt;
  document.getElementById('s-synchelp').textContent=help||'';
}
function docRef(){ return db.collection('woTracker').doc(workspace); }
function startSync(){
  if(!firebaseOk || !workspace){ setSync('err','Offline — saving to this device only',''); return; }
  if(unsub) unsub();
  setSync('pending','Connecting…','');
  unsub = docRef().onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites){ setSync('ok','Synced',''); return; }
    if(snap.exists){
      const d=snap.data();
      applyingRemote=true;
      state.orders = Array.isArray(d.orders)? d.orders : [];
      state.people = Array.isArray(d.people)? d.people : [];
      applyingRemote=false;
      lsSet('wot-cache-'+workspace, JSON.stringify(state));
      render();
    }
    setSync('ok','Synced','');
  }, err=>{
    console.error(err);
    setSync('err','Sync blocked','Your database rules may be blocking this app. In Firebase Console → Firestore → Rules, allow read/write on the "woTracker" collection, then reload.');
  });
}
function persist(){
  if(applyingRemote) return;
  lsSet('wot-cache-'+workspace, JSON.stringify(state));
  if(!firebaseOk || !workspace) return;
  setSync('pending','Saving…','');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    docRef().set({ orders: state.orders, people: state.people, updatedAt: Date.now() })
      .then(()=>setSync('ok','Synced',''))
      .catch(e=>{ console.error(e); setSync('err','Sync blocked','Data is saved on this device. Check Firestore rules for the "woTracker" collection.'); });
  }, 600);
}

/* ================= Setup ================= */
function boot(){
  workspace = lsGet('wot-workspace');
  showClosed = lsGet('wot-showclosed')==='1';
  if(!workspace){
    document.getElementById('setup').classList.add('open');
    return;
  }
  const cache = lsGet('wot-cache-'+workspace);
  if(cache){ try{ state=JSON.parse(cache); }catch(e){} }
  startSync();
  render();
}
function finishSetup(){
  const code=document.getElementById('setup-code').value.trim().toLowerCase().replace(/\s+/g,'-');
  if(!code){ toast('Enter a sync code first'); return; }
  workspace=code; lsSet('wot-workspace', code);
  document.getElementById('setup').classList.remove('open');
  startSync(); render();
}
function applyCode(){
  const code=document.getElementById('s-code').value.trim().toLowerCase().replace(/\s+/g,'-');
  if(!code){ toast('Enter a sync code'); return; }
  workspace=code; lsSet('wot-workspace', code);
  const cache = lsGet('wot-cache-'+workspace);
  state = cache ? JSON.parse(cache) : { orders: [], people: [] };
  startSync(); render(); toast('Sync code applied');
}

/* ================= Views ================= */
function setView(v){
  currentView=v;
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  const titles={ today:'Today', meeting:'Meeting Mode', cal:'Calendar', people:'My Team', all:'All Items' };
  document.getElementById('viewtitle').textContent=titles[v];
  render();
  document.getElementById('content').scrollTop=0;
}
function render(){
  const el=document.getElementById('content');
  el.classList.toggle('calmode', currentView==='cal');
  if(currentView==='today') el.innerHTML=renderToday();
  else if(currentView==='meeting') el.innerHTML=renderMeeting();
  else if(currentView==='cal') el.innerHTML=renderCal();
  else if(currentView==='people') el.innerHTML=renderPeople();
  else el.innerHTML=renderAll();
  renderCounts();
  document.getElementById('datebadge').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
function renderCounts(){
  const late=openOrders().filter(isOverdue).length;
  const chase=openOrders().filter(o=>isOverdue(o)||isChaseToday(o)).length;
  const open=openOrders().length;
  const ppl=new Set(openOrders().map(o=>o.assignedTo).filter(Boolean)).size;
  setTxt('rc-today', chase); setTxt('rc-meeting', open); setTxt('rc-people', ppl); setTxt('rc-all', open);
  const b=document.getElementById('bc-today');
  if(late>0){ b.style.display='block'; b.textContent=late; } else b.style.display='none';
}
function setTxt(id,v){ const e=document.getElementById(id); if(e) e.textContent=v; }

function cardHTML(o){
  const late=isOverdue(o), today=isChaseToday(o);
  const d=daysDiff(o.followUp);
  let dueChip='';
  if(o.status!=='closed' && o.followUp){
    const cls = late?'late': today?'today':'';
    const label = late? (d===1?'1 day late':d+' days late') : today? 'Follow up today' : 'Follow up '+fmtDate(o.followUp);
    dueChip = '<span class="chip due '+cls+'">&#9200; '+label+'</span>';
  }
  const lu=lastUpdate(o);
  const luHTML = lu ? '<div class="lastupd"><b>'+fmtWhen(lu.ts)+':</b> '+esc(lu.text)+'</div>' : '';
  return '<div class="card s-'+o.status+(late?' overdue':'')+'" onclick="openDetail(\''+o.id+'\')">'
    +'<div class="titlerow"><div class="t">'+esc(displayTitle(o))+'</div>'+(o.priority==='high'?'<span class="chip hi">HIGH</span>':'')+'</div>'
    +'<div class="metarow">'
    +'<span class="chip stamp '+o.status+'">'+STATUS_LABEL[o.status]+'</span>'
    +(o.assignedTo?'<span class="chip person">'+esc(o.assignedTo)+'</span>':'<span class="chip">Unassigned</span>')
    +dueChip
    +(locStr(o)?'<span class="chip">&#128205; '+esc(locStr(o))+'</span>':'')
    +(o.source?'<span class="chip">via '+esc(o.source)+'</span>':'')
    +'</div>'+luHTML+'</div>';
}
function emptyHTML(icon, msg){ return '<div class="empty"><div class="big">'+icon+'</div>'+msg+'</div>'; }

function renderToday(){
  const open=openOrders();
  const late=sortOrders(open.filter(isOverdue));
  const chase=sortOrders(open.filter(isChaseToday));
  const report=sortOrders(open.filter(o=>o.status==='ready'||updatedLast24h(o)));
  const upcoming=sortOrders(open.filter(o=>{ const d=daysDiff(o.followUp); return d!==null && d<0 && d>=-3; }));
  let h='';
  if(!open.length) return emptyHTML('&#9728;','Nothing open. When your name gets called or a text comes in,<br>hit <b>+</b> and log it in ten seconds.');
  if(late.length){ h+='<div class="sect"><div class="eyebrow hot"><span class="num">'+late.length+'</span>Past follow-up — chase now<span class="rule"></span></div>'+late.map(cardHTML).join('')+'</div>'; }
  if(chase.length){ h+='<div class="sect"><div class="eyebrow warm"><span class="num">'+chase.length+'</span>Chase today<span class="rule"></span></div>'+chase.map(cardHTML).join('')+'</div>'; }
  if(report.length){ h+='<div class="sect"><div class="eyebrow good"><span class="num">'+report.length+'</span>Have answers — report at meeting<span class="rule"></span></div>'+report.map(cardHTML).join('')+'</div>'; }
  if(upcoming.length){ h+='<div class="sect"><div class="eyebrow"><span class="num">'+upcoming.length+'</span>Coming up (next 3 days)<span class="rule"></span></div>'+upcoming.map(cardHTML).join('')+'</div>'; }
  if(!h) h=emptyHTML('&#9989;','All caught up for today. Open items are in <b>All Items</b>.');
  return h;
}

function renderMeeting(){
  const open=sortOrders(openOrders());
  if(!open.length) return emptyHTML('&#128227;','No open work orders. You are bulletproof in that meeting.');
  const q=(window._meetQ||'').toLowerCase();
  const list=q? open.filter(o=> (o.title+' '+(o.woNum||'')+' '+(o.building||'')+' '+(o.floor||'')+' '+(o.room||'')+' '+(o.details||'')+' '+(o.assignedTo||'')+' '+(o.requestedBy||'')).toLowerCase().includes(q)) : open;
  let h='<div class="searchwrap"><span class="mag">&#128269;</span><input type="text" placeholder="They called a name or WO# — type to find it fast" value="'+esc(window._meetQ||'')+'" oninput="window._meetQ=this.value;rerenderMeeting(this)"></div><div class="sect" id="meetlist">';
  h+=meetListHTML(list);
  h+='</div>';
  return h;
}
function meetListHTML(list){
  return list.map(o=>{
    const lu=lastUpdate(o);
    const late=isOverdue(o);
    const say = lu ? esc(lu.text)+' <span style="color:var(--muted)">('+fmtWhen(lu.ts)+')</span>'
      : (o.status==='new' ? 'Not delegated yet — assigning it out.' : 'Delegated to '+esc(o.assignedTo||'the team')+', waiting on their update.');
    return '<div class="meetrow s-'+o.status+(late?' overdue':'')+'" onclick="openDetail(\''+o.id+'\')">'
      +'<div class="t">'+esc(displayTitle(o))+'</div>'
      +'<div class="say"><span class="lbl">If asked, say</span>'+say+'</div>'
      +'<div class="metarow"><span class="chip stamp '+o.status+'">'+STATUS_LABEL[o.status]+'</span>'
      +(o.assignedTo?'<span class="chip person">'+esc(o.assignedTo)+'</span>':'')
      +(o.followUp?'<span class="chip due'+(late?' late':'')+'">Next check: '+fmtDate(o.followUp)+'</span>':'')
      +(locStr(o)?'<span class="chip">&#128205; '+esc(locStr(o))+'</span>':'')
      +(o.requestedBy?'<span class="chip">for '+esc(o.requestedBy)+'</span>':'')
      +'</div></div>';
  }).join('') || emptyHTML('&#128269;','No matches. Clear the search to see everything.');
}
function rerenderMeeting(inp){
  const q=(window._meetQ||'').toLowerCase();
  const open=sortOrders(openOrders());
  const list=q? open.filter(o=> (o.title+' '+(o.woNum||'')+' '+(o.building||'')+' '+(o.floor||'')+' '+(o.room||'')+' '+(o.details||'')+' '+(o.assignedTo||'')+' '+(o.requestedBy||'')).toLowerCase().includes(q)) : open;
  document.getElementById('meetlist').innerHTML=meetListHTML(list);
}

function renderPeople(){
  const open=openOrders().filter(o=>o.assignedTo);
  if(!open.length) return emptyHTML('&#128101;','Once you assign work orders to your team,<br>each person shows up here with everything they owe you.');
  const groups={};
  open.forEach(o=>{ (groups[o.assignedTo]=groups[o.assignedTo]||[]).push(o); });
  const names=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  return '<div class="sect">'+names.map(nm=>{
    const items=sortOrders(groups[nm]);
    const late=items.filter(isOverdue).length;
    const initials=nm.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const stat=items.length+' open'+(late?' &middot; <span class="late">'+late+' past follow-up</span>':'');
    return '<div class="persongroup"><div class="personhead"><div class="avatar">'+esc(initials)+'</div>'
      +'<div><div class="nm">'+esc(nm)+'</div><div class="st">'+stat+'</div></div>'
      +'<button class="nudgebtn" onclick="event.stopPropagation();openNudgePersonEnc(\''+encodeURIComponent(nm)+'\')">Send reminder</button></div>'
      +'<div class="personitems">'+items.map(o=>{
        const a=ageDays(o.createdAt); const late=isOverdue(o);
        return '<div class="pitem" onclick="openDetail(\''+o.id+'\')"><span class="age'+(late?' late':'')+'">'+(a===0?'today':a+'d')+'</span><span class="pt">'+esc(displayTitle(o))+'</span><span class="chip stamp '+o.status+'" style="font-size:11px">'+STATUS_LABEL[o.status]+'</span></div>';
      }).join('')+'</div></div>';
  }).join('')+'</div>';
}

function renderAll(){
  let list=state.orders.slice();
  if(!showClosed) list=list.filter(o=>o.status!=='closed');
  if(!list.length) return emptyHTML('&#128203;', showClosed?'Nothing here yet.':'No open items. Toggle closed items in Settings to see history.');
  const open=sortOrders(list.filter(o=>o.status!=='closed'));
  const closed=list.filter(o=>o.status==='closed').sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
  let h='';
  if(open.length) h+='<div class="sect"><div class="eyebrow"><span class="num">'+open.length+'</span>Open<span class="rule"></span></div>'+open.map(cardHTML).join('')+'</div>';
  if(closed.length) h+='<div class="sect"><div class="eyebrow"><span class="num">'+closed.length+'</span>Closed<span class="rule"></span></div>'+closed.map(cardHTML).join('')+'</div>';
  return h;
}

/* ================= Calendar ================= */
let calY=null, calM=null, calSel=null, calAnim='';
function itemsOn(ds){ return openOrders().filter(o=>o.followUp===ds||o.dueDate===ds); }
function pillCls(o,ds,today){ if(ds<today) return 'late'; return o.followUp===ds?'fu':'due'; }
function renderCal(){
  const t=new Date();
  if(calY===null){ calY=t.getFullYear(); calM=t.getMonth(); calSel=todayStr(); }
  const first=new Date(calY,calM,1);
  const startDow=first.getDay();
  const monName=first.toLocaleDateString(undefined,{month:'long'});
  const today=todayStr();
  const mPrefix=calY+'-'+String(calM+1).padStart(2,'0');
  let fuCount=0,dueCount=0;
  openOrders().forEach(o=>{ if((o.followUp||'').indexOf(mPrefix)===0) fuCount++; if((o.dueDate||'').indexOf(mPrefix)===0) dueCount++; });
  let h='<div class="cv"><div class="cv-head"><div class="cv-mon">'+monName+' <span>'+calY+'</span></div>'
   +'<div class="cv-stats">'+(fuCount?'<span class="chip due today">'+fuCount+' follow-up'+(fuCount>1?'s':'')+'</span>':'')
   +(dueCount?'<span class="chip" style="background:var(--blue-bg);color:var(--blue)">'+dueCount+' due</span>':'')+'</div>'
   +'<div class="grow"></div>'
   +'<button class="cv-btn" onclick="calShift(-1)" title="Previous month">&#9664;</button>'
   +'<button class="cv-btn" onclick="calGoToday()">Today</button>'
   +'<button class="cv-btn" onclick="calShift(1)" title="Next month">&#9654;</button></div>'
   +'<div class="cv-body"><div class="cv-gridwrap">'
   +'<div class="cv-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>'
   +'<div class="cv-grid '+calAnim+'" ontouchstart="window._cvx=event.touches[0].clientX" ontouchend="cvSwipe(event)">';
  const start=new Date(calY,calM,1-startDow);
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const inMon=d.getMonth()===calM;
    const its=sortOrders(itemsOn(ds));
    let pills='';
    its.slice(0,3).forEach(o=>{
      const label=o.woNum? '#'+o.woNum+(o.title?' \u00b7 '+o.title:'') : (o.title||'');
      pills+='<div class="cv-pill '+pillCls(o,ds,today)+'" onclick="event.stopPropagation();openDetail(\''+o.id+'\')" title="'+esc(displayTitle(o))+'">'+esc(label)+'</div>';
    });
    if(its.length>3) pills+='<div class="cv-more">+'+(its.length-3)+' more</div>';
    h+='<div class="cv-cell'+(inMon?'':' dim')+(ds===today?' today':'')+(ds===calSel?' sel':'')+'" onclick="calPick(\''+ds+'\')"><div class="cv-dnum">'+d.getDate()+'</div><div class="cv-pills">'+pills+'</div></div>';
  }
  h+='</div></div><aside class="cv-agenda">'+agendaHTML(calSel||today,false)+'</aside></div></div>';
  calAnim='';
  return h;
}
function agendaHTML(ds,bare){
  const its=sortOrders(itemsOn(ds));
  const p=ds.split('-');
  const dt=new Date(+p[0],+p[1]-1,+p[2]);
  const dd=daysDiff(ds);
  const rel= dd===0?'Today': dd===-1?'Tomorrow': dd===1?'Yesterday': (dd<0? (-dd)+' days out' : dd+' days ago');
  let h='';
  if(!bare){
    h+='<div class="cv-aghead">'+dt.toLocaleDateString(undefined,{weekday:'long'})+'</div>'
      +'<div class="cv-agsub">'+dt.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})+' \u00b7 '+rel+'</div>';
  }
  h+= its.length? its.map(cardHTML).join('') : '<div class="empty" style="padding:20px">Nothing lands on this day.</div>';
  h+='<button class="ghost" onclick="closeOv(\'ov-day\');openAdd(\''+ds+'\')">+ Log a work order for this day</button>';
  return h;
}
function calShift(nn){ calAnim= nn>0?'animL':'animR'; calM+=nn; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} render(); }
function calGoToday(){ const t=new Date(); calAnim='animR'; calY=t.getFullYear(); calM=t.getMonth(); calSel=todayStr(); render(); }
function calPick(ds){
  calSel=ds;
  const p=ds.split('-'); const y=+p[0], m=+p[1]-1;
  if(y!==calY||m!==calM){ calAnim=(y*12+m)>(calY*12+calM)?'animL':'animR'; calY=y; calM=m; }
  render();
  if(window.matchMedia('(max-width:1000px)').matches){
    document.getElementById('day-title').textContent=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    document.getElementById('day-list').innerHTML=agendaHTML(ds,true);
    openOv('ov-day');
  }
}
function cvSwipe(e){
  const dx=e.changedTouches[0].clientX-(window._cvx||0);
  if(Math.abs(dx)>60) calShift(dx<0?1:-1);
}

/* ================= Add / Edit ================= *//* ================= Add / Edit ================= */
function segPick(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function segVal(id){ const on=document.querySelector('#'+id+' button.on'); return on?on.dataset.x:''; }
function segSet(id,val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.x===val)); }

function openAdd(prefDate){
  editId=null;
  document.getElementById('add-title').textContent='Log Work Order';
  document.getElementById('a-title').value='';
  document.getElementById('a-wonum').value='';
  document.getElementById('a-bldg').value='';
  document.getElementById('a-floor').value='';
  document.getElementById('a-room').value='';
  document.getElementById('a-details').value='';
  document.getElementById('a-reqby').value='';
  document.getElementById('a-assign').value='';
  document.getElementById('a-pri').value='normal';
  document.getElementById('a-follow').value=(typeof prefDate==='string'&&prefDate)?prefDate:addDaysStr(todayStr(),1);
  document.getElementById('a-due').value='';
  segSet('a-source','Meeting');
  document.getElementById('a-delete').style.display='none';
  fillPeopleList();
  openOv('ov-add');
  setTimeout(()=>document.getElementById('a-wonum').focus(),150);
}
function editFromDetail(){
  const o=findOrder(detailId); if(!o) return;
  editId=o.id;
  closeOv('ov-detail');
  document.getElementById('add-title').textContent='Edit Work Order';
  document.getElementById('a-title').value=o.title||'';
  document.getElementById('a-wonum').value=o.woNum||'';
  document.getElementById('a-bldg').value=o.building||'';
  document.getElementById('a-floor').value=o.floor||'';
  document.getElementById('a-room').value=o.room||'';
  document.getElementById('a-details').value=o.details||'';
  document.getElementById('a-reqby').value=o.requestedBy||'';
  document.getElementById('a-assign').value=o.assignedTo||'';
  document.getElementById('a-pri').value=o.priority||'normal';
  document.getElementById('a-follow').value=o.followUp||'';
  document.getElementById('a-due').value=o.dueDate||'';
  segSet('a-source', o.source||'Other');
  document.getElementById('a-delete').style.display='block';
  fillPeopleList();
  openOv('ov-add');
}
function fillPeopleList(){
  const names=new Set(state.people.map(p=>p.name));
  state.orders.forEach(o=>{ if(o.assignedTo) names.add(o.assignedTo); });
  document.getElementById('peoplelist').innerHTML=[...names].map(n=>'<option value="'+esc(n)+'">').join('');
}
function saveOrder(){
  const title=document.getElementById('a-title').value.trim();
  const woNum=document.getElementById('a-wonum').value.trim();
  if(!title && !woNum){ toast('Add a WO # or a description'); return; }
  const assignedTo=document.getElementById('a-assign').value.trim();
  const vals={
    title, woNum,
    building:document.getElementById('a-bldg').value.trim(),
    floor:document.getElementById('a-floor').value.trim(),
    room:document.getElementById('a-room').value.trim(),
    details:document.getElementById('a-details').value.trim(),
    requestedBy:document.getElementById('a-reqby').value.trim(),
    assignedTo, priority:document.getElementById('a-pri').value,
    followUp:document.getElementById('a-follow').value||null,
    dueDate:document.getElementById('a-due').value||null,
    source:segVal('a-source')||'Other'
  };
  if(editId){
    const o=findOrder(editId); if(!o) return;
    const wasAssigned=o.assignedTo;
    Object.assign(o, vals);
    if(!wasAssigned && assignedTo && o.status==='new') o.status='delegated';
  } else {
    state.orders.push(Object.assign({
      id:'wo'+Date.now()+Math.floor(Math.random()*999),
      status: assignedTo?'delegated':'new',
      createdAt:Date.now(), updates:[], closedAt:null
    }, vals));
  }
  persist(); render(); closeOv('ov-add');
  toast(editId?'Updated':'Logged'+(assignedTo?' — delegated to '+assignedTo:''));
  editId=null;
}
function deleteOrder(){
  if(!editId) return;
  if(!confirm('Delete this work order permanently?')) return;
  state.orders=state.orders.filter(o=>o.id!==editId);
  editId=null; persist(); render(); closeOv('ov-add'); toast('Deleted');
}

/* ================= Detail ================= */
function findOrder(id){ return state.orders.find(o=>o.id===id); }
function openDetail(id){
  detailId=id; const o=findOrder(id); if(!o) return;
  document.getElementById('d-title').textContent=displayTitle(o);
  document.getElementById('d-detailtext').textContent=o.details||'';
  document.getElementById('d-detailtext').style.display=o.details?'block':'none';
  let chips='';
  if(locStr(o)) chips+='<span class="chip">&#128205; '+esc(locStr(o))+'</span>';
  if(o.assignedTo) chips+='<span class="chip person">'+esc(o.assignedTo)+'</span>';
  if(o.requestedBy) chips+='<span class="chip">for '+esc(o.requestedBy)+'</span>';
  if(o.source) chips+='<span class="chip">via '+esc(o.source)+'</span>';
  if(o.dueDate) chips+='<span class="chip">Expected done '+fmtDate(o.dueDate)+'</span>';
  if(o.priority==='high') chips+='<span class="chip hi">HIGH</span>';
  chips+='<span class="chip">Logged '+fmtWhen(o.createdAt)+'</span>';
  document.getElementById('d-chips').innerHTML=chips;
  segSet('d-status', o.status);
  document.getElementById('d-follow').value=o.followUp||'';
  renderUpdates(o);
  document.getElementById('d-newupd').value='';
  openOv('ov-detail');
}
function renderUpdates(o){
  const u=o.updates||[];
  document.getElementById('d-updates').innerHTML = u.length
    ? u.slice().reverse().map(x=>'<div class="updline"><span class="when">'+fmtWhen(x.ts)+'</span><span>'+esc(x.text)+'</span></div>').join('')
    : '<div style="font-size:13px;color:var(--muted);padding:6px 0">No updates yet.</div>';
}
function setStatus(s){
  const o=findOrder(detailId); if(!o) return;
  o.status=s;
  if(s==='closed'){ o.closedAt=Date.now(); }
  segSet('d-status', s);
  persist(); render();
  if(s==='ready') toast('Marked ready — it will show in your meeting list');
  if(s==='closed'){ closeOv('ov-detail'); toast('Closed'); }
}
function setFollow(v){
  const o=findOrder(detailId); if(!o) return;
  o.followUp=v||null; persist(); render();
}
function bump(n){
  const o=findOrder(detailId); if(!o) return;
  const base=(o.followUp && daysDiff(o.followUp)<0)? o.followUp : todayStr();
  o.followUp=addDaysStr(base,n);
  document.getElementById('d-follow').value=o.followUp;
  persist(); render(); toast('Follow-up moved to '+fmtDate(o.followUp));
}
function bumpMonday(){
  const o=findOrder(detailId); if(!o) return;
  o.followUp=nextMondayStr();
  document.getElementById('d-follow').value=o.followUp;
  persist(); render(); toast('Follow-up moved to '+fmtDate(o.followUp));
}
function addUpdate(){
  const inp=document.getElementById('d-newupd');
  const txt=inp.value.trim(); if(!txt) return;
  const o=findOrder(detailId); if(!o) return;
  (o.updates=o.updates||[]).push({ts:Date.now(), text:txt});
  if(o.status==='delegated') o.status='waiting';
  inp.value=''; renderUpdates(o); segSet('d-status',o.status);
  persist(); render();
}

/* ================= Nudges ================= */
function contactFor(name){ return state.people.find(p=>p.name.toLowerCase()===String(name).toLowerCase()); }
function buildNudge(name, items){
  const lines=items.map(o=>{
    let l='• '+displayTitle(o);
    const loc=locStr(o); if(loc) l+=' ('+loc+')';
    if(o.dueDate) l+=' (needed by '+fmtDate(o.dueDate)+')';
    else if(o.followUp) l+=' (checking in '+fmtDate(o.followUp)+')';
    return l;
  });
  const first=String(name).split(/\s+/)[0];
  return 'Hey '+first+', quick check-in on '+(items.length===1?'this one':'these')+':\n\n'+lines.join('\n')+'\n\nCan you shoot me a status when you get a minute? I get asked about these in the morning meeting. Thanks!';
}
function openNudgePersonEnc(enc){ openNudgePerson(decodeURIComponent(enc)); }
function openNudgePerson(name){
  const items=sortOrders(openOrders().filter(o=>o.assignedTo===name));
  if(!items.length){ toast('Nothing open for '+name); return; }
  nudgeCtx={ name };
  document.getElementById('n-title').textContent='Remind '+name;
  document.getElementById('n-msg').value=buildNudge(name, items);
  const c=contactFor(name);
  document.getElementById('n-contactnote').innerHTML = c && (c.phone||c.email)
    ? 'Sending to: '+esc(c.phone||'')+(c.phone&&c.email?' · ':'')+esc(c.email||'')
    : 'Tip: add '+esc(name)+'\'s cell or email in <b>Settings</b> and the buttons below will open a pre-filled text or email.';
  openOv('ov-nudge');
}
function nudgeFromDetail(){
  const o=findOrder(detailId); if(!o) return;
  if(!o.assignedTo){ toast('Assign it to someone first'); return; }
  nudgeCtx={ name:o.assignedTo };
  document.getElementById('n-title').textContent='Remind '+o.assignedTo;
  document.getElementById('n-msg').value=buildNudge(o.assignedTo,[o]);
  const c=contactFor(o.assignedTo);
  document.getElementById('n-contactnote').innerHTML = c && (c.phone||c.email)
    ? 'Sending to: '+esc(c.phone||'')+(c.phone&&c.email?' · ':'')+esc(c.email||'')
    : 'Tip: add '+esc(o.assignedTo)+'\'s cell or email in <b>Settings</b> for one-tap texts and emails.';
  closeOv('ov-detail');
  openOv('ov-nudge');
}
function copyNudge(){
  const txt=document.getElementById('n-msg').value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Copied — paste it anywhere')).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Select and copy manually'); }
  document.body.removeChild(ta);
}
function smsNudge(){
  const c=nudgeCtx&&contactFor(nudgeCtx.name);
  const body=encodeURIComponent(document.getElementById('n-msg').value);
  const num=c&&c.phone? encodeURIComponent(c.phone):'';
  window.location.href='sms:'+num+'?&body='+body;
}
function emailNudge(){
  const c=nudgeCtx&&contactFor(nudgeCtx.name);
  const body=encodeURIComponent(document.getElementById('n-msg').value);
  const to=c&&c.email? encodeURIComponent(c.email):'';
  window.location.href='mailto:'+to+'?subject='+encodeURIComponent('Quick status check')+'&body='+body;
}

/* ================= Settings ================= */
function openSettings(){
  document.getElementById('s-code').value=workspace||'';
  renderPeopleSettings();
  document.getElementById('s-showclosed').textContent=(showClosed?'Hide':'Show')+' closed items in All view';
  openOv('ov-set');
}
function renderPeopleSettings(){
  const el=document.getElementById('s-people');
  el.innerHTML = state.people.length
    ? state.people.map((p,i)=>'<div class="pitem"><span class="pt"><b>'+esc(p.name)+'</b> '+esc(p.phone||'')+' '+esc(p.email||'')+'</span><button class="qbtn" onclick="removePerson('+i+')" style="color:var(--red)">Remove</button></div>').join('')
    : '<div style="font-size:13px;color:var(--muted);padding:4px 0 8px">No contacts saved yet.</div>';
}
function addPerson(){
  const name=document.getElementById('s-pname').value.trim();
  if(!name){ toast('Enter a name'); return; }
  const phone=document.getElementById('s-pphone').value.trim();
  const email=document.getElementById('s-pemail').value.trim();
  const existing=contactFor(name);
  if(existing){ existing.phone=phone||existing.phone; existing.email=email||existing.email; }
  else state.people.push({name, phone, email});
  document.getElementById('s-pname').value=''; document.getElementById('s-pphone').value=''; document.getElementById('s-pemail').value='';
  persist(); renderPeopleSettings(); toast('Contact saved');
}
function removePerson(i){ state.people.splice(i,1); persist(); renderPeopleSettings(); }
function toggleClosed(){
  showClosed=!showClosed; lsSet('wot-showclosed', showClosed?'1':'0');
  document.getElementById('s-showclosed').textContent=(showClosed?'Hide':'Show')+' closed items in All view';
  render();
}

/* ================= Misc ================= */
function openOv(id){ document.getElementById(id).classList.add('open'); }
function closeOv(id){ document.getElementById(id).classList.remove('open'); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open')); }
});
document.addEventListener('keydown', e=>{
  if(currentView!=='cal') return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(document.querySelector('.overlay.open')) return;
  if(e.key==='ArrowLeft') calShift(-1);
  if(e.key==='ArrowRight') calShift(1);
});
setView('today');
boot();
</script>
</body>
